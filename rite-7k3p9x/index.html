const Q=[{"s": "Madrid 2017", "n": 1, "q": "En los edificios de viviendas, los aparcamientos, cumplirán los requisitos de calidad del aire interior establecidos en", "c": "", "o": {"A": "En la IT correspondiente del Reglamento de Instalaciones Térmicas.", "B": "No están obligados a cumplir con ningún requisito.", "C": "Cumplirán con la Sección HS 3 del Código Técnico de la Edificación."}, "k": "C", "e": "Referencia: RITE 1.1.4.2.1.", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 2, "q": "En los quirófanos, los filtros finales se instalaran", "c": "", "o": {"A": "No es necesario poner filtro final.", "B": "Después del ventilador de impulsión.", "C": "Antes de la sección de tratamiento."}, "k": "B", "e": "Referencia: RITE 1.1.4.2.4", "nk": 0}, {"s": "Madrid 2017", "n": 3, "q": "Las exigencias de calidad del ambiente acústico vienen incluidas", "c": "", "o": {"A": "En el Código Técnico de la Edificación.", "B": "No existen exigencias de calidad del ambiente acústico en instalaciones térmicas.", "C": "En el Reglamento de Instalaciones Térmicas."}, "k": "A", "e": "Referencia: RITE 1.1.4.4", "nk": 0}, {"s": "Madrid 2017", "n": 4, "q": "Si durante una inspección de eficiencia energética se detectase un defecto leve ya detectado en otra inspección anterior y que no haya sido corregido, la calificación de la instalación será", "c": "", "o": {"A": "Aceptable, pero con plazo de 3 meses para su corrección.", "B": "Condicionada.", "C": "Negativa."}, "k": "B", "e": "Referencia: Artículo 32 RITE", "nk": 0}, {"s": "Madrid 2017", "n": 5, "q": "Indique cuál de los siguientes valores serían los correctos para cumplir con las exigencias del RITE en un local que alberga una piscina climatizada cuya temperatura del agua es de 30 °C", "c": "", "o": {"A": "31 °C de temperatura seca del aire y una humedad relativa del local del 60%.", "B": "31 °C de temperatura seca del aire y una humedad relativa del local del 65%.", "C": "30 °C de temperatura seca del aire y una humedad relativa del local del 60%."}, "k": "C", "e": "Referencia: RITE IT 1.1.4.1.2 Aptado 3", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 6, "q": "La empresa mantenedora medirá y registrará el contenido de CO y CO2 en los productos de la combustión en equipos generadores de calor de potencia 100000 kcal/h", "c": "", "o": {"A": "Cada dos años.", "B": "Cada tres meses.", "C": "Cada mes."}, "k": "B", "e": "Referencia: 100000 kcal/h / 860 kcal/h/kw = 116,27 kw >70 kw .RD 1027/2007 IT 3.4.1, tabla 3.2", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 7, "q": "La reforma de un sala de máquina(existente a la entrada en vigor del actual RITE), con caldera a gas, que se encuentre en un segundo sótano, se realizará", "c": "", "o": {"A": "Las calderas se podrán mantener en el mismo local.", "B": "Se habilitará un nuevo local para las calderas.", "C": "Las calderas se podrán mantener en el mismo local, siempre que se suministren con gas natural."}, "k": "B", "e": "Referencia: RD 1027/2007 IT 1.3.4.1.2.8", "nk": 0}, {"s": "Madrid 2017", "n": 8, "q": "Se observa que una tubería para transporte de fluidos está marcada con tres franjas de color rojo fuerte. Indicar que fluido transportará", "c": "", "o": {"A": "Refrigerantes del grupo III.", "B": "Agua no potable caliente y refrigerada.", "C": "Vapor o agua sobrecalentada a más de 8 bar abs."}, "k": "C", "e": "Referencia: UNE 100100:2000", "nk": 0}, {"s": "Madrid 2017", "n": 9, "q": "El registro de una operación de mantenimiento en una sala de calderas de 400 kw, se conservará durante", "c": "", "o": {"A": "Dos años como mínimo.", "B": "Lo que determine el mantenedor.", "C": "Cinco años."}, "k": "C", "e": "Referencia: RD 1027/2007, artículo 27.2", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 10, "q": "Cuando el evaporador o el condensador del sistema de refrigeración enfría o calienta un fluido secundario que se hace circular para enfriar o calentar el medio a tratar", "c": "", "o": {"A": "Es un sistema abierto.", "B": "Es un sistema indirecto.", "C": "Sistema directo abierto."}, "k": "B", "e": "Referencia: MI-IF 03, 1.2.3", "nk": 0}, {"s": "Madrid 2017", "n": 11, "q": "En la planta baja de un edificio de oficinas tienen instalada una caldera a gas natural de 320 kW dentro de un local con las siguientes dimensiones: 22 x 6,5 x 3,5 metros (largo x ancho x altura) y una de sus paredes colinda directamente con un patio de ventilación de 8 m2 (2x4) sin puerta o ventana alguna, pero por donde discurre el contrapeso de un ascensor ¿Cuál sería la mínima superficie de baja resistencia mecánica que debe tener dicha pared?", "c": "", "o": {"A": "1,43 m².", "B": "Aproximadamente 5 m².", "C": "Las superficies de baja resistencia mecanica no pueden desembocar en patios donde existan contrapesos de ascensores."}, "k": "B", "e": "Referencia: IT1.3.4.1.2.3 – 2 (22*6,5*3,5/100= 5,005 m²)", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 12, "q": "En las inspecciones periódicas de la eficiencia energética de los sistemas de aire acondicionado, el Coeficiente de Eficiencia Frigorífica tendrá un valor", "c": "", "o": {"A": "2 o más.", "B": "No superior a dos.", "C": "No es necesario medirlo."}, "k": "A", "e": "Referencia: RITE IT 4.2.2", "nk": 0}, {"s": "Madrid 2017", "n": 13, "q": "¿Cuál de los siguientes combustibles no se considera combustibles fosiles?", "c": "", "o": {"A": "Gas natural.", "B": "Propano.", "C": "Madera."}, "k": "C", "e": "", "nk": 0}, {"s": "Madrid 2017", "n": 14, "q": "¿Cuántas horas deberán funcionar las bombas tras el llenado de agua de una red de tuberías que se quiere limpiar?", "c": "", "o": {"A": "Lo que determine el fabricante del compuesto dispersante.", "B": "1 hora.", "C": "No hace falta dejar funcionando las bombas al actuar el dispersante bajo condiciones estáticas del fluido."}, "k": "A", "e": "Referencia: RITE 2.2.2.2-5", "nk": 0}, {"s": "Madrid 2017", "n": 15, "q": "El rendimiento mínimo instantáneo exigido para generadores de calor que utilicen biomasa, será de", "c": "", "o": {"A": "80% a plena carga.", "B": "65% a plena carga.", "C": "No se exige rendimiento mínimo."}, "k": "A", "e": "Referencia: IT 1.2.4.1.2.1, apartado 4.", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 16, "q": "En las instalaciones solares, ¿es obligatorio la instalación de un sistema de medida de la energía suministrada?", "c": "", "o": {"A": "Sí, siempre.", "B": "No.", "C": "Si la instalación es de más de 14 kw."}, "k": "C", "e": "Referencia: HS4 2.2.4", "nk": 0, "top": 1}, {"s": "Madrid 2017", "n": 17, "q": "Indicar el espesor mínimo del aislamiento de una red de tuberías de agua caliente sanitaria a 60 ºC y un diámetro exterior de 95 mm (se considera la conductividad térmica mínima de referencia igual a 0,04 W/(m.K) a 10ºC", "c": "", "o": {"A": "40 mm", "B": "35 mm", "C": "30 mm"}, "k": "B", "e": "Referencia: RITE 1.2.4.2.1.2 -3", "nk": 0, "top": 1}, {"s": "Andalucía 2018 (2ª conv.)", "n": 1, "q": "Un ventilador que forma parte de una instalación de climatización, llevará incorporado un dispositivo indirecto para la medición y control del caudal de aire:", "c": "", "o": {"A": "Si el caudal es superior a 5 m³/s.", "B": "Si el caudal es igual o superior a 5 m³/s.", "C": "Si el caudal es inferior a 5 m³/s.", "D": "En cualquier caso."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 2, "q": "Una sala de máquinas con 75 m² de superficie en planta, y 4 m de altura, dispone de calderas a gas con una potencia térmica total de 400.000 Kcal/h. ¿Cuál será la superficie mínima de cada uno de los tres espacios iguales en los que se pretende dividir la superficie de baja resistencia de los paramentos?:", "c": "", "o": {"A": "3´3 m2.", "B": "3 m².", "C": "1´1m2", "D": "1 m2."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 3, "q": "En una red de tuberías con funcionamiento continuo de agua caliente sanitaria. ¿Cuál es el espesor mínimo de aislamiento térmico que debe de tener dicha tubería, si discurre por el interior del falso techo de la buhardilla de una vivienda unifamiliar, si su diámetro exterior es de 5 pulgadas y media (5´5”) y transporta agua a una temperatura de 343 F:", "c": "", "o": {"A": "40 mm.", "B": "45 mm.", "C": "50 mm.", "D": "10 mm."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 4, "q": "En una instalación térmica, formada principalmente por dos calderas a gas natural de 400 Kw, cada una, dispone de vaso de expansión conectado al colector de retorno. En tal caso, las válvulas de interceptacion a intercalar en el retorno de ambas calderas serán del tipo:", "c": "", "o": {"A": "Clapeta.", "B": "Reductora de presión.", "C": "Diferencial.", "D": "Tres vías."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 5, "q": "En una instalación con un generador de calor de 70 Kw térmicos. Los conductos de retorno de sección rectangular que discurren por el aparcamiento, tendrán un espesor mínimo, para una conductividad del material de 0´35 w/m·K, de:", "c": "", "o": {"A": "27´75 mm.", "B": "46´25 mm.", "C": "55´5 mm.", "D": "64´75 mm."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 6, "q": "Para evitar las sobrepresiones debidas al cierre brusco de una válvula, las tuberías de diámetro nominal mayor de DN150, llevaran:", "c": "", "o": {"A": "Válvulas de mariposa.", "B": "Válvulas de retención simple clapeta.", "C": "Válvulas de retención de disco", "D": "Válvulas de esfera con desmultiplicador. 2ª Convocatoria 2018"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 7, "q": "Para un edificio de uso sanitario, la inspección visual de la red de conductos de retorno de un centro de salud, debe de efectuarse con una periodicidad:", "c": "", "o": {"A": "Bienal (2 años).", "B": "Anual (1 año).", "C": "Semestral (6 meses).", "D": "Mensual (1 mes)."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 8, "q": "En una sala de calderas a gas, con una potencia térmica nominal de 60200 Kcal/h. Los elementos que a continuación se indican, tendrán un equipamiento mínimo obligatorio de aparatos de medición de:", "c": "", "o": {"A": "Colector de impulsión: Dos termómetros, uno a la entrada y otro a la salida.", "B": "Chimenea: Un pirómetro y un pirostato con sus respectivas escalas indicadoras.", "C": "Bombas: Dos manómetros para lectura diferencial de presión.", "D": "Ninguna respuesta es correcta."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 9, "q": "Por las tuberías de una instalación térmica circula un fluido refrigerante del grupo II. Tales tuberías, se señalizarán:", "c": "", "o": {"A": "Con una franja gris de 150 mm de ancho, y sobre esta, un anillo central naranja de 1´5 cm de espesor.", "B": "Con una franja gris de 150 mm de ancho, y sobre esta, dos anillos centrales naranja de 1´5 cm de espesor, cada uno.", "C": "Con dos franjas grises de 20 cm de ancho, cada una, y sobre cada franja, un anillo central naranja de 2 cm de espesor.", "D": "Con dos franjas grises de 20 cm de ancho, cada una, separadas entre si 200 mm, y sobre cada franja, un anillo central naranja de 2 cm de espesor."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 10, "q": "En un edificio de viviendas existente y en reformas. ¿Es posible la evacuación de los productos de la combustión de las calderas individuales que utilicen biocombustible sólido, a través del patio de ventilación de 4 m² de superficie en planta, y totalmente descubierto?:", "c": "", "o": {"A": "Si, siempre que las calderas sean estancas con emisiones de NOx, clase 5.", "B": "Si, hasta una potencia nominal térmica igual o inferior a 60200 Kcal/h.", "C": "Si, cuando las calderas sean estancas, con emisión de NOx clase 5 y potencia nominal térmica hasta 60200 Kcal/h.", "D": "No."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 11, "q": "La limpieza de la red de tuberías de agua caliente sanitaria podrá efectuarse con:", "c": "", "o": {"A": "Agua o solución acuosa de un producto detergente.", "B": "Agua o solución acuosa de un producto detergente cuya concentración sea facilitada por el fabricante.", "C": "Agua o solución acuosa de un producto detergente adecuada a los materiales empleados en el circuito y cuya concentración sea facilitada por el fabricante.", "D": "Agua o solución acuosa de un producto no detergente adecuada a los materiales empleados en el circuito y cuya concentración sea facilitada por el fabricante."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 12, "q": "La responsabilidad del mantenimiento de una instalación, compuesta, fundamentalmente, por caldera de biomasa de 4´3 Mcal/h (megacalorias-hora) de potencia térmica, le corresponde al:", "c": "", "o": {"A": "Técnico titulado de mantenimiento.", "B": "Mantenedor habilitado de la empresa de mantenimiento.", "C": "Titular de las instalaciones.", "D": "Ninguna respuesta es correcta. 2ª Convocatoria 2018"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 13, "q": "Una sala de máquinas de 75 m² de superficie en planta, dispone de caldera a gasóleo de una potencia térmica total de 344000 Kcal/h. Según el vigente Reglamento de Instalaciones Térmicas, ¿cuál será la superficie mínima libre al exterior para ventilación natural directa de la sala?: Por orificio Por conducto vertical (menos de 10 m de recorrido horizontal) Por conducto horizontal con recorrido < 10 m", "c": "", "o": {"A": "2000 cm2 3000 cm2 4000 cm2", "B": "4000 cm2 3000 cm2 2000 cm2", "C": "750 cm2 1000 cm2 1500 cm2", "D": "250 cm2 500 cm2 1000 cm2"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 14, "q": "De las siguientes instalaciones térmicas. ¿Cuál precisa tener Manual de Uso y Mantenimiento?:", "c": "", "o": {"A": "Calentador acumulador de 17063 BTU de potencia térmica, instalado en cada una de las viviendas de un edificio de nueva construcción, formado por siete plantas, y dos viviendas por planta.", "B": "El túnel de secado de ladrillos cerámicos, formado por un generador de calor a gas natural, de 350 Kw de potencia térmica.", "C": "En un hotel, la sustitución de la caldera a gas natural, de 750 Kw de potencia térmica nominal, por otra de similares características.", "D": "Ninguna respuesta es correcta."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 15, "q": "En el vigente Reglamento de Instalaciones Térmicas en los Edificios (RITE/2007). ¿Cuál de las siguientes practicas está completamente prohibida?:", "c": "", "o": {"A": "El uso de agua de calidad sanitaria, para enfriamiento adiabático.", "B": "La humectación del aire mediante inyección directa de vapor de calidad sanitaria procedente de calderas.", "C": "La preparación de agua caliente para usos sanitarios, mediante mezcla directa de agua fría con condensado o vapor.", "D": "Todas las anteriores"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 16, "q": "Según el vigente Reglamento de Instalaciones Térmicas en los Edificios (RITE/2007), para una temperatura seca del aire de 300 K. ¿La velocidad media del aire con difusión por desplazamiento, intensidad de la turbulencia 15% y PPD para corrientes de aire del 8%, será?:", "c": "", "o": {"A": "0´17 m/s.", "B": "0´15 m/s.", "C": "0´13 m/s.", "D": "0´10 m/s."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 17, "q": "En una instalación de energía solar térmica, las tuberías del circuito secundario se someterán a una prueba de resistencia mecánica, equivalente a:", "c": "", "o": {"A": "1´5 veces, la presión máxima de trabajo, con un mínimo de 30´6 m.c.a.", "B": "1´5 veces, la presión máxima de trabajo, con un mínimo de 61´2 m.c.a.", "C": "2 veces, la presión máxima de trabajo, con un mínimo de 30´6 m.c.a.", "D": "2 veces, la presión máxima de trabajo, con un mínimo de 61´2 m.c.a."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 18, "q": "La empresa mantenedora medirá y registrará el contenido de partículas sólidas en combustible de una caldera individual de pellet de potencia térmica nominal de 60500 Kcal/h:", "c": "", "o": {"A": "Con una periodicidad mensual, la primera al inicio de la temporada.", "B": "Con una periodicidad bimestral, la primera al inicio de la temporada.", "C": "Con una periodicidad cuatrimestral, la primera al inicio de la temporada.", "D": "Con una periodicidad trimestral, la primera al inicio de temporada. 2ª Convocatoria 2018"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 19, "q": "Los datos del consumo de energía y de agua, obtenidos periódicamente de una instalación de calefacción de un hotel, formada por caldera de bioconbustible solido de 2508000 Kcal/h de potencia térmica, redes de distribución de agua y fan-coil, se conservarán durante:", "c": "", "o": {"A": "Cinco años.", "B": "Tres años.", "C": "Un año.", "D": "Como mínimo, hasta el comienzo de la siguiente temporada."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 20, "q": "Se considera que un centro comercial de 1000 m² de superficie útil, cumple con el valor límite de temperatura, durante la campaña de verano, cuando la temperatura media del recinto, sea:", "c": "", "o": {"A": "Superior a 21º C, medidos a 1´7 m del suelo con equipo de ±0´5º C .de exactitud y humedad relativa del 65%", "B": "Inferior a 25º C, medidos a 1´7 m del suelo con equipo de ±0´5º C .de exactitud y humedad relativa del 65%", "C": "21º C, medidos a 1´7 m del suelo con equipo de ±0´2º C .de exactitud y humedad relativa del 70%.", "D": "25º C, medidos a 1´7 m del suelo con equipo de ±0´2º C .de exactitud y humedad relativa del 70%."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 21, "q": "Una Instalación de calefacción, formada principalmente por caldera a gas de 150 Kw de potencia térmica nominal, redes de tuberías de diferentes diámetros y radiadores de aluminio. ¿El sistema de distribución incluyendo su aislamiento, se inspeccionarán periódicamente, cada?:", "c": "", "o": {"A": "5 años.", "B": "4 años.", "C": "2 años.", "D": "Anualmente, al inicio de la temporada."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 22, "q": "En la sala de Rayos X de un hospital. ¿El caudal mínimo de aire exterior de ventilación será?:", "c": "", "o": {"A": "30 m3 /(h.m2).", "B": "15 m3 /(h.m2).", "C": "10 m3 /(h.m2).", "D": "5 m3 /(h.m2)."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 23, "q": "Indique cuál de los siguientes valores, serían los correctos para cumplir con las exigencias del vigente Reglamento de Instalaciones en Edificios (RITE/2007), en un local privado que alberga una piscina climatizada, cuya temperatura del agua es de 30º C:", "c": "", "o": {"A": "31º C de temperatura seca del aire y humedad relativa del 65%.", "B": "31º C de temperatura seca del aire y humedad relativa del 60%.", "C": "30º C de temperatura seca del aire y humedad relativa del 60%.", "D": "Es indiferente en piscinas privadas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 24, "q": "Los conductos de aire deben cumplir en cuanto a materiales y fabricación:", "c": "", "o": {"A": "y B), son correctas.", "B": "La norma UNE-EN 13403.", "C": "Las que establezca el fabricante en su proceso de fabricación según módulo G.", "D": ""}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 25, "q": "En la instalación térmica de un Instituto de Enseñanza Secundaria, se está sustituyendo la caldera a gasóleo de 215000 Kcal/h de potencia térmica nominal, por otra que utiliza gas natural como combustible. ¿El control de la recepción en obra del aludido generador de calor, lo llevara a cabo?:", "c": "", "o": {"A": "El Instalador habilitado y el Director de la Instalación.", "B": "El Titular de la Instalación, con el visto bueno de la Empresa Instaladora habilitada.", "C": "El Titular de la Instalación y el Instalador habilitado.", "D": "El Instalador habilitado o el Director de la Instalación. 2ª Convocatoria 2018"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 26, "q": "Las unidades exteriores de los equipos autónomos de refrigeración, se situarán en fachada, debiendo quedar integrados en la misma, y ocultas a la vista exterior:", "c": "", "o": {"A": "En todos los edificios existentes que se reformen.", "B": "En todos los edificios de nueva construcción.", "C": "En los edificios de nueva construcción que dispongan de preinstalación.", "D": "En los edificios existentes que se reformen y no dispongan de azotea o terraza."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 27, "q": "En un complejo hospitalario se ha instalado un equipo autónomo de generación de calor a gas natural ubicado en el exterior, a la intemperie, en zona transitada para el uso habitual del edificio sanitario. En tal caso, se dejará alrededor del generador de calor una franja libre para mantenimiento de:", "c": "", "o": {"A": "Un metro (1 m), como mínimo.", "B": "Un metro (1 m), si no existe a ras de suelo, sumideros u otras aperturas dentro de la zona de influencia del equipo.", "C": "Un metro (1 m), como máximo.", "D": "Un metro (1 m), como mínimo, restringiendo el acceso a personal no autorizado."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 28, "q": "¿Qué clase de filtración se usaría para el aire interior de un museo, si el aire exterior presenta una concentración alta de partículas?:", "c": "", "o": {"A": "F6 + F8.", "B": "F7 + F9.", "C": "F5 + F7.", "D": "F8."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 29, "q": "Un circuito hidráulico se dimensionará con una velocidad de paso, a filtro limpio, menor o igual que la velocidad del fluido en las tuberías contiguas, y se protegerá mediante un filtro con una luz como máximo de:", "c": "", "o": {"A": "0´25 mm.", "B": "1 mm.", "C": "1´25 mm.", "D": "2 mm."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 30, "q": "En un sistema de climatización en el que se aportan 2700 litros/s de aire exterior y en el que se han establecido 5500 horas anuales de funcionamiento. ¿Cuál es la eficiencia mínima en calor sensible sobre el aire exterior?:", "c": "", "o": {"A": "64 %.", "B": "55 %.", "C": "50 %.", "D": "47 % 2ª Convocatoria 2018 RESPUESTAS"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 1, "q": "Se entiende por reforma de una instalación térmica:", "c": "", "o": {"A": "Todo cambio que se efectúe en ella y que suponga una modificación del proyecto o memoria técnica con el que fue ejecutada y registrada.", "B": "La sustitución o reposición de un generador de calor o frío por otro de similares características, al requerir modificación del proyecto o memoria técnica.", "C": "La sustitución o reposición de un generador de calor o frío de similares características, aunque ello no suponga una modificación del proyecto o memoria técnica.", "D": "Las respuestas A y C son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 2, "q": "En una fábrica, el Real Decreto 1027/2007 con sus modificaciones es de aplicación a:", "c": "", "o": {"A": "La instalación térmica fija de la oficina de administración, cuyo fin es el bienestar térmico del perso- nal.", "B": "La instalación térmica encargada del proceso industrial de esterilización del material.", "C": "El aire acondicionado portátil instalado en la oficina del director.", "D": "Las respuestas A y C son correctas."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 3, "q": "La memoria técnica de diseño elaborada por instalador habilitado o técnico titulado competente, se redactará en Andalucía:", "c": "", "o": {"A": "Sobre el modelo establecido por la Junta de Andalucía y publicado en el BOJA.", "B": "No hay modelo establecido por la Junta de Andalucía, pero la memoria ha de disponer del siguiente contenido mínimo:  Justificación de que la solución propuesta cumple las exigencias de bienestar térmico e higiene, eficiencia energética y seguridad del RITE.  Breve memoria descriptiva de la instalación, en la que figuren el tipo, el número y las caracterís- ticas de los equipos generadores, sistemas de energías renovables y otros elementos principales.  Cálculo de la potencia térmica instalada de acuerdo con un procedimiento reconocido; explicitán- dose los parámetros de diseño elegidos.  Los planos o esquemas de las instalaciones.", "C": "No hay modelo establecido, solo debe disponer de una breve memoria descriptiva de la instalación, en la que figuren el tipo, el número y las características de los equipos generadores, sistemas de energías renovables y otros elementos principales.", "D": "Ninguna de las anteriores es correcta."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 4, "q": "Para la generación de calefacción y agua caliente sanitaria se instala en un edificio una instalación solar térmica con una superficie de apertura de campo de los captadores de 30 m2 y una caldera de gas con 60 kW de potencia térmica nominal. ¿Qué documentación técnica de diseño y dimensionado debe hacerse como base para la ejecución de la insta- lación?", "c": "", "o": {"A": "Proyecto, por ser la potencia térmica nominal a instalar en generación de calor, mayor que 70 kW.", "B": "El proyecto podrá ser sustituido por una memoria técnica, por ser la potencia térmica nominal a insta- lar en generación de calor, menor o igual que 70 kW.", "C": "Ninguna documentación técnica de diseño, por ser la potencia térmica nominal a instalar en ge- neración de calor, menor o igual que 70 kW.", "D": "Ninguna de las respuestas es correcta 26/09/2020"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 5, "q": "La evaluación periódica del rendimiento de un generador de calor de 80 kW de potencia térmica nominal instalada, se realizará:", "c": "", "o": {"A": "Cada 2 años.", "B": "Cada 3 meses, la primera al inicio de la temporada.", "C": "Cada 2 meses, la primera al inicio de la temporada.", "D": "Una vez al mes."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 6, "q": "En caso de sustitución de un equipo de generación de frío de potencia útil nominal 50 kW por otro equipo de 65 kW, ¿es necesario el registro del certificado de la instalación en el órgano competente de la comunidad autónoma donde radique la instalación, para la pues- ta en servicio?:", "c": "", "o": {"A": "No por tratarse de un generador de potencia útil nominal menor a 70 kW.", "B": "No, tan solo deberá conservar el titular o usuario de la instalación, la factura de adquisición del ge- nerador y de su instalación.", "C": "Sí, por suponer una variación de la potencia útil nominal del generador superior al 25%.", "D": "Las respuestas A y B son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 7, "q": "El Manual de uso y mantenimiento de la instalación debe contener:", "c": "", "o": {"A": "Las instrucciones de seguridad y de manejo y maniobra de la instalación.", "B": "Los programas de funcionamiento y de mantenimiento preventivo.", "C": "El programa de gestión energética.", "D": "Todas las respuestas son correctas."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 8, "q": "El defecto que no supone un peligro inmediato para la seguridad de las personas, bienes o medio ambiente, pero puede reducir de modo sustancial la capacidad de utilización de la instalación térmica o su eficiencia energética, tendría la clasificación de:", "c": "", "o": {"A": "Aceptable", "B": "Leve.", "C": "Grave.", "D": "Muy grave."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 9, "q": "¿Qué norma establece un procedimiento válido para el cálculo de la temperatura operativa y la humedad relativa, para valores de actividad metabólica 3 met, grado de vestimenta 0,5 clo en verano y un PPD del 15%?", "c": "", "o": {"A": "No hay norma, para estos valores la temperatura operativa en verano estará comprendida entre 23 y 25ºC.", "B": "La norma UNE-EN 13779.", "C": "La norma UNE-EN ISO 7730.", "D": "Ninguna de las respuestas es correcta. 26/09/2020"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 10, "q": "En una oficina con una superficie de 50 m2, en la que trabajan 5 personas con una activi- dad metabólica sedentaria, y en la que es baja la producción de sustancias contaminantes por fuentes diferentes del ser humano y no está permitido fumar, el caudal mínimo de aire exterior será:", "c": "", "o": {"A": "27,5 l/s.", "B": "40 l/s", "C": "41,5 l/s", "D": "62,5 l/s."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 11, "q": "¿Qué clase de filtración mínima habrá de emplearse para un aire exterior con concen- traciones altas de partículas, que va a introducirse en un bar?", "c": "", "o": {"A": "F5 + F7.", "B": "F5 + F6", "C": "F6 + F8", "D": "F7."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 12, "q": "Los prefiltros del aire exterior de ventilación:", "c": "", "o": {"A": "Solo se emplearán en caso de aire con concentraciones muy altas de partículas.", "B": "Se instalarán solo en la entrada del aire exterior a la unidad de tratamiento.", "C": "Se instalarán en la entrada del aire exterior a la unidad de tratamiento y en la entrada del aire de re- torno.", "D": "Las opciones A y B son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 13, "q": "¿Está permitido que el aire de extracción de una sauna sea empleado como aire de transferencia hacia un garaje?", "c": "", "o": {"A": "Si", "B": "No", "C": "Si, en caso de que se mezcle con otro aire de extracción que tenga bajo nivel de contaminación.", "D": "Si, en caso de que se mezcle con otro aire de extracción que tenga moderado nivel de contaminación."}, "k": "B", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2020 (1ª conv.)", "n": 14, "q": "En la determinación de las condiciones de bienestar en un edificio se tendrán en consi- deración y se valorarán:", "c": "", "o": {"A": "Las molestias por corrientes de aire.", "B": "La diferencia vertical de la temperatura del aire. Estratificación.", "C": "La asimetría de temperatura radiante.", "D": "Todas las anteriores son correctas. 26/09/2020"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 15, "q": "La red de conductos de planchas de material aislante, que cumplen la norma UNE-EN 13043 para conductos no metálicos, ¿ha de estar equipada de aperturas de servicio para la limpieza y desinfección de los mismos, acordes a lo establecido en la norma UNE-EN 12097?:", "c": "", "o": {"A": "Si, debiendo resistir las planchas operaciones de limpieza equivalentes a un ciclo de 20 años de uso (una operación de limpieza por año), sin ningún daño.", "B": "Si, debiendo resistir las planchas operaciones de limpieza equivalentes a un ciclo de 10 años de uso (una operación de limpieza por año), sin ningún daño.", "C": "No es necesario que dispongan de las aperturas de servicio según dispone la UNE-EN 12097, es posi- ble cortar aperturas en los conductos cuando proceda la limpieza y luego cerrarlas con cinta de alu- minio.", "D": "No es necesario que dispongan de las aperturas de servicio, siempre que el material de las placas no facilite la proliferación microbiana."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 16, "q": "La memoria técnica de diseño ha de incluir una estimación del consumo…(elija una op- ción), expresado en energía primaria y emisiones de dióxido de carbono, realizada dicha estimación con un método que la buena práctica haya contrastado, indicándose el mismo.", "c": "", "o": {"A": "Una estimación del consumo de energía mensual.", "B": "Una estimación del consumo de energía anual.", "C": "Una estimación del consumo de energía mensual y anual.", "D": "No es necesario ninguna estimación del consumo en la memoria técnica, tan solo se requiere inc- luirla en proyectos emitidos por técnicos competentes."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 17, "q": "Los generadores que empleen energías convencionales:", "c": "", "o": {"A": "Se conectarán hidráulicamente en paralelo y deben poder independizarse entre sí, salvo casos excep- cionales.", "B": "Se conectarán hidráulicamente en serie y deben poder independizarse entre sí, salvo casos excepcio- nales.", "C": "Se conectarán hidráulicamente indistintamente en paralelo o en serie, siempre que puedan inde- pendizarse entre sí.", "D": "No podrán conectarse hidráulicamente."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 18, "q": "¿Está permitida la instalación de un calentador a gas de 25 kW de tipo B (el aire necesario para realizar la combustión del gas se toma de la atmósfera del local donde se encuentra instalado y la evacuación de los productos de la combustión al exterior es conducida)?", "c": "", "o": {"A": "No, salvo que el local cumpla los requisitos de ventilación establecidos para las salas de máquinas.", "B": "No, salvo que el aparato sea del tipo B3x.", "C": "Las opciones A y B son correctas.", "D": "No está permitido en ningún caso. 26/09/2020"}, "k": "C", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2020 (1ª conv.)", "n": 19, "q": "Conforme el procedimiento simplificado, ¿cuál será el aislamiento mínimo para una tubería de 50 mm de diámetro, que transporta agua caliente sanitaria (funcionamiento continuo) a 65 ºC y discurre por el interior del edificio, si se emplea un material de conductividad térmica 0,040 W(m.K) a 10ºC?", "c": "", "o": {"A": "30 mm", "B": "35 mm", "C": "40 mm", "D": "45 mm"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 20, "q": "Las bombas de calor deben cumplir el siguiente requisito:", "c": "", "o": {"A": "Los fabricantes aportarán las tablas de funcionamiento de los equipos a distintas temperaturas, para facilitar la evaluación y rendimiento energético de la instalación.", "B": "La temperatura del agua a la salida de las plantas deberá ser mantenida constante al variar la carga, salvo excepciones que se justificarán.", "C": "Se procurará que la potencia máxima en los equipos se obtenga con el salto máximo de temperaturas de entrada y salida establecido por el fabricante.", "D": "Todas las anteriores son correctas."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 21, "q": "Las redes de conductos tendrán una estanqueidad correspondiente a la clase:", "c": "", "o": {"A": "B", "B": "C", "C": "D", "D": "Todas la opciones son correctas, según la aplicación."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 22, "q": "Un ventilador que absorbe una potencia de 2.582 W para transportar un caudal de fluido de 13.720 m³/h, pertenecería por su potencia específica a la categoría:", "c": "", "o": {"A": "SPF1", "B": "SPF2", "C": "SPF3", "D": "SPF4"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 23, "q": "El rearme de los dispositivos de seguridad:", "c": "", "o": {"A": "Se permite automático, solo cuando se indique expresamente en las instrucciones técnicas.", "B": "Se permite manual, solo cuando se indique expresamente en las instrucciones técnicas.", "C": "Será automático siempre, sin excepciones.", "D": "Será manual siempre, sin excepciones. 26/09/2020"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 24, "q": "Indique la opción correcta:", "c": "", "o": {"A": "Las instalaciones solares de más de 10 m2 de superficie de apertura han de tener un sistema de medida de la energía final suministrada.", "B": "Las instalaciones de energía solar térmica en las que se entregue a los distintos usuarios la energía solar a través del secundario, pueden prescindir de la contabilización individualizada, siempre que exista un sistema de control de la energía aportada por la instalación solar térmica de forma centra- lizada.", "C": "El diseño del sistema de contabilización de energía solar debe permitir al usuario de la instalación, controlar periódicamente la producción de la instalación.", "D": "Todas las anteriores son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 25, "q": "¿Qué es un sistema todo-aire?:", "c": "", "o": {"A": "Técnica de acondicionamiento en la que el control de las condiciones térmicas interiores está a cargo del sistema de ventilación.", "B": "Técnica de acondicionamiento en la que el control de las condiciones térmicas interiores está a cargo de un subsistema (aparatos autónomos, ventiloconvectores, radiadores, etc.) en combinación con el subsistema de ventilación.", "C": "Máquina o instalación que transfiere calor del entorno natural, como el aire, el agua o la tierra, al edificio, invirtiendo el flujo de calor, de modo que fluya de una temperatura más baja a otra más alta.", "D": "Ninguna de las anteriores es correcta."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 26, "q": "Si el sistema de climatización de una piscina climatizada, expulsa un caudal de aire al ex- terior de 6.120 m3/h, la energía térmica contenida en el aire expulsado debe ser recu- perada con una eficiencia mínima en calor sensible sobre el aire exterior (%) de:", "c": "", "o": {"A": "47 %", "B": "50 %", "C": "55 %", "D": "Ha de indicarse el número de horas anuales de funcionamiento para poder determinarla."}, "k": "C", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2020 (1ª conv.)", "n": 27, "q": "En un hotel, la sala de máquinas de nueva construcción, con generadores de calor a gas, ha de disponer de:", "c": "", "o": {"A": "Detectores de fugas de gas, conformes con las normas UNE-EN 61779-1 y UNE EN-61779-4.", "B": "Detectores de fugas de gas, conformes con las normas UNE-EN 50194 y UNE EN-50244.", "C": "El cuadro eléctrico de protección y mando de los equipos instalados en la sala, o por lo menos, el interruptor general y el interruptor del sistema de ventilación, deben situarse dentro de la sala y en la proximidad de uno de los accesos.", "D": "Las opciones B y C son correctas. 26/09/2020"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 28, "q": "La evacuación de los productos de la combustión en las instalaciones térmicas se realizará como norma general por conducto por la cubierta del edificio, con la siguiente excepción:", "c": "", "o": {"A": "Instalaciones térmicas existentes que se reformen cambiándose sus generadores y que no dispongan de conducto de evacuación a cubierta.", "B": "Instalaciones térmicas existentes que se reformen cambiándose sus generadores y que dispongan de conducto de evacuación a cubierta, no adecuado al nuevo generador objeto de la reforma.", "C": "En generadores que utilicen combustibles gaseosos, se permitirá la salida directa de estos productos al exterior con conductos por fachada o patio de ventilación, cuando se trate de aparatos estancos de potencia útil nominal inferior o igual a 70 kW o de aparatos de tiro natural para la producción de agua caliente sanitaria de potencia útil inferior o igual a 24,4 kW en determinados casos establecidos en el reglamento.", "D": "Todas las anteriores son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 29, "q": "La longitud de la conexión flexible que se utilice para conectar la red de conductos a las unidades terminales no será mayor de :", "c": "", "o": {"A": "0,8 m", "B": "1 m", "C": "1,5 m", "D": "2 m"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 30, "q": "En una sala de exposiciones de 2000 m2, se visualizará la temperatura del aire y la hume- dad relativa registradas en cada momento y las que debería tener, por medio de:", "c": "", "o": {"A": "3 dispositivos, uno de ellos en el vestíbulo de acceso.", "B": "2 dispositivos, uno de ellos en el vestíbulo de acceso", "C": "1 dispositivo en el vestíbulo de acceso", "D": "No hay que visualizar la temperatura y humedad registrada, sería suficiente indicar mediante carteles informativos las condiciones de temperatura y humedad límites establecidas por el reglamento. 26/09/2020"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 1, "q": "Se entiende por reforma de una instalación térmica:", "c": "", "o": {"A": "La incorporación a la instalación de nuevos subsistemas de climatización o de producción de A.C.S. y de energías renovables", "B": "Unicamente el cambio de tipo de la energía utilizada", "C": "Unicamente la sustitución del generador de calor de la instalación térmica", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 2, "q": "Con el objeto de facilitar su comprensión y utilización, el RITE se ordena en:", "c": "", "o": {"A": "Tres partes: Disposiciones generales, Instrucciones Técnicas y Apéndices", "B": "Dos partes: Disposiciones generales e Instrucciones Técnicas", "C": "Es único, no está dividido en partes diferenciadas", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 3, "q": "Dentro de las exigencias técnicas de bienestar e higiene se incluyen:", "c": "", "o": {"A": "La calidad térmica del ambiente y el rendimiento energético de los equipos", "B": "Calidad del aire interior e higiene", "C": "Calidad del ambiente atmosférico", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 4, "q": "Para cumplir las exigencias del RITE es necesario aplicar:", "c": "", "o": {"A": "Exclusivamente las Instrucciones Técnicas del RITE", "B": "Las Instrucciones Técnicas y/o alternativamente aportar soluciones que ofrezcan prestaciones equivalen- tes", "C": "Las Instrucciones Técnicas del RITE y además el Código Técnico de la Edificación en su defecto", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 5, "q": "El Certificado de Mantenimiento se suscribirá:", "c": "", "o": {"A": "Anualmente por la empresa mantenedora de la instalación térmica", "B": "Cada cinco años por Organismo de Control Habilitado.", "C": "Anualmente por la empresa mantenedora y el director de mantenimiento, cuando la participación de este sea preceptiva, de la instalación térmica", "D": "Cada dos años por la empresa mantenedora de la instalación térmica"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 6, "q": "Para el ejercicio de la actividad como empresa instaladora / Mantenedora es necesario cumplir uno de los siguientes requisitos:", "c": "", "o": {"A": "Tener suscrito un seguro de responsabilidad civil que cubra los daños que puedan derivarse de sus ac- tuaciones, por una cuantía mínima de 300.000 euros y estar dados de alta en el correspondiente régi- men de la Seguridad Social y al corriente en el cumplimiento de las obligaciones del sistema.", "B": "Disponer de dos operarios en plantilla con carne profesional de instalaciones térmicas en edificios", "C": "Tener en plantilla personal certificado conforme a lo dispuesto en el R.D. 795/2010, por el que se regula la comercialización y manipulación de gases fluorados y equipos basados en los mismos", "D": "Estar dado de alta en el Régimen Especial de Empresas Instaladoras de la Seguridad Social"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 7, "q": "El Titular de la instalación es responsable de:", "c": "", "o": {"A": "Únicamente del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habili- tada.", "B": "Del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habilitada y de las inspecciones obligatorias.", "C": "Del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habilitada y de las inspecciones obligatorias. La conservación de la documentación de todas las actuaciones es respon- sabilidad de la empresa mantenedora.", "D": "Ninguna de las anteriores es correcta."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 8, "q": "Los aparatos de recuperación de calor deberán de estar siempre protegidos con una sección de filtros cuya clase será:", "c": "", "o": {"A": "La recomendada por el fabricante o como mínimo F5", "B": "La recomendada por el fabricante o como mínimo F6", "C": "Mínimo F6", "D": "No es necesario que los recuperadores estén protegidos"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 9, "q": "Los prefiltros se instalarán:", "c": "", "o": {"A": "Solo en la entrada de la unidad de tratamiento de aire (U.T.A.)", "B": "Solo en la entrada del aire de retorno", "C": "Solo en locales o edificios cuya calidad del aire interior deba ser IDA 1", "D": "Ninguna de las anteriores es correcta"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 10, "q": "El caudal mínimo de aire de extracción en los locales de servicio será como mínimo:", "c": "", "o": {"A": "2 dm3/s x m2 de superficie en planta", "B": "0,5 dm3/s x m2 de superficie en planta", "C": "1 dm3/s x m2 de superficie en planta", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 11, "q": "En piscinas climatizadas, la temperatura del agua estará comprendida entre:", "c": "", "o": {"A": "Dependerá exclusivamente del uso principal de la piscina", "B": "22º y 28º", "C": "18 y 26º", "D": "24º y 30º según el uso principal de la piscina, salvo usos terapeúticos"}, "k": "D", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2020 (2ª conv.)", "n": 12, "q": "La temperatura del agua en piscinas climatizadas se medirá:", "c": "", "o": {"A": "En el centro y a unos 20 cm. por debajo de la lámina de agua", "B": "Según el método de la norma UNE-EN-13779", "C": "En tres puntos equidistantes de uno de los vértices y a 10 cm. por debajo de la lámina de agua", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 13, "q": "El caudal mínimo de aire exterior de ventilación para locales no dedicados a ocupación humana permanente con un índice de calidad del aire interior IDA 4 será de:", "c": "", "o": {"A": "0,28 l/s por m2 de superficie del local", "B": "8 l/s y persona", "C": "500 ppm", "D": "0,8 dp"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 14, "q": "En el caso de generadores de calor que utilicen biomasa, el rendimiento mínimo instantáneo exigido será del:", "c": "", "o": {"A": "90% a plena carga", "B": "80% a plena carga", "C": "75% a plena carga y del 50% a media carga", "D": "80% a plena carga salvo estufas e insertables de leña."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 15, "q": "A los quemadores de los generadores de calor alimentados por combustibles líquidos o gaseosos con potencia térmica nominal de 100 kW, se les exigirá una regulación mínima:", "c": "", "o": {"A": "De una marcha", "B": "De dos marchas", "C": "De tres marchas o modulante", "D": "Exclusivamente modulante"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 16, "q": "Para calcular el espesor mínimo del aislamiento térmico por el procedimiento simplificado, se considera un material con la siguientes características de conductividad térmica (ref):", "c": "", "o": {"A": "0,030 W/mK a 20ºC", "B": "0.040 W/mK a 10ºC", "C": "0,020 W/mK a 25ºC", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 17, "q": "La caída máxima de presión admisible en unidades de tratamiento de aire (U.T.A.) sera:", "c": "", "o": {"A": "No mayor de 10 Pa", "B": "Igual o mayor de 20 Pa", "C": "No mayor de 40 Pa", "D": "De 40 a 200 Pa dependiendo del tipo de U.T.A."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 18, "q": "El enfriamiento gratuito por aire exterior (Free Cooling) debe ser instalado en los subsistemas:", "c": "", "o": {"A": "De tipo Todo Aire a partir de una potencia térmica nominal mayor que 100 kW", "B": "En todos los de tipo Mixto Agua-Aire", "C": "De tipo Todo Aire, a partir de una potencia térmica nominal mayor que 70 kW", "D": "Es opcional, a criterio del instalador o técnico competente, siguiendo (en subsistemas Todo Aire) las normas UNE-EN 13053 y 1751"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 19, "q": "Las bombas y ventiladores de potencia eléctrica del motor mayor de 20 kW dispondrán de:", "c": "", "o": {"A": "Un dispositivo que registre las horas de funcionamiento del equipo", "B": "Un sistema de medida de la energía eléctrica consumida", "C": "Un dispositivo que registre las horas de funcionamiento del equipo y un sistema de medida de la energía eléctrica consumida", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 20, "q": "La instalación de un calentador a gas de 26 kW de tipo B (Cámara abierta):", "c": "", "o": {"A": "Está prohibida, solo pueden instalarse aparatos de tipo C (Cámara cerrada)", "B": "Es posible si se instala en un local que cumpla los requisitos para sala de máquinas", "C": "La prohibición no afecta a aparatos de tipo B3X (Abierta con tiro forzado)", "D": "B y C son correctas"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 21, "q": "Si se ventila de forma natural al exterior por orificios:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "El local necesita una superficie abierta al aire libre mínima de 700 cm2.", "B": "El local necesita una superficie abierta al aire libre mínima de 2000 cm2.", "C": "El local necesita una superficie abierta al aire libre mínima de 5000 cm2.", "D": "El local necesita una superficie abierta al aire libre mínima de 700 cm2 complementado por otro orificio de superficie 600 cm2."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 22, "q": "Si se ventila de forma natural a través de conducto, la sección libre mínima de los conductos será de:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "1050 cm2 en conductos verticales y 1400 cm2 en los horizontales.", "B": "5000 cm2 en conductos verticales y 8000 cm2 en los horizontales.", "C": "2000 cm2 en conductos verticales y 5000 cm2 en los horizontales.", "D": "2100 cm2 en conductos verticales y 2800 cm2 en los horizontales."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 23, "q": "Si se opta por utilizar ventilación forzada, se instalará un ventilador de impulsión soplando desde la parte inferior de la sala que asegure:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "Un caudal mínimo 2100 m3/h.", "B": "Un caudal mínimo 852 m3/h.", "C": "Un caudal mínimo 1470 m3/h.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 24, "q": "Por tratarse de una caldera alimentada a gas natural, es necesario instalar en el local detectores de fugas combinados con un sistema de corte automático de la alimentación a la caldera, en una cantidad de:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "1 detector como mínimo", "B": "2 detectores como mínimo", "C": "3 detectores como mínimo", "D": "4 detectores distribuidos uniformemente como mínimo"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 25, "q": "El índice de calidad del aire interior (IDA) deberá ser como mínimo el siguiente:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "IDA 1.", "B": "IDA 2.", "C": "IDA 3.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 26, "q": "Si se calcula por el método indirecto por persona, el caudal mínimo del aire exterior de ventilación será:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "3600 dm3/s", "B": "4000 dm3/s", "C": "1200 dm3/s", "D": "800 dm3/s"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 27, "q": "Si se calcula por el método indirecto por ud. de superficie, el caudal mínimo del aire exterior de ventilación será:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "249 dm3/s", "B": "165 dm3/s", "C": "84 dm3/s", "D": "No se puede calcular por este método."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 28, "q": "Si el aire exterior al local tiene una alta concentración de partículas y de gases contaminantes, se requerirá instalar filtros con clase de filtración:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "F5+F7.", "B": "G4/F6.", "C": "F8.", "D": "F7+F9"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 29, "q": "Los l
