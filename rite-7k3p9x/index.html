o cerrado.", "B": "De tipo abierto.", "C": "De tipo abierto o cerrado indistintamente.", "D": "No requiere vaso de expansión."}, "k": "A", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 25, "q": "¿Qué norma UNE se seguirá para la prueba hidrostática de una red de tuberías plásticas?", "c": "", "o": {"A": "UNE 00151", "B": "UNE 12108", "C": "UNE 100000", "D": "UNE ISO 7730"}, "k": "B", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 26, "q": "La comprobación de estanqueidad del circuito de tuberías en una instalación de 80 kW de potencia térmica instalada se realizará:", "c": "", "o": {"A": "Una vez al mes.", "B": "Dos veces al año.", "C": "Una vez por temporada.", "D": "Dos veces al mes."}, "k": "C", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 27, "q": "¿A qué presión se realiza la prueba de resistencia mecánica de una red de ACS?", "c": "", "o": {"A": "2 veces la presión máxima efectiva de trabajo, con mínimo de 3 bar.", "B": "1,5 veces la presión máxima efectiva de trabajo, con mínimo de 3 bar.", "C": "1,5 veces la presión máxima efectiva de trabajo, con mínimo de 6 bar.", "D": "2 veces la presión máxima efectiva de trabajo, con mínimo de 6 bar."}, "k": "D", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 28, "q": "La relación entre la capacidad calorífica de una máquina frigorífica y la capacidad efectivamente absorbida por la unidad, se denomina:", "c": "", "o": {"A": "Capacidad calorífica.", "B": "COP.", "C": "EER.", "D": "Eficiencia energética."}, "k": "C", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 29, "q": "El ventilador de impulsión de la ventilación forzada de una sala de máquinas…:", "c": "", "o": {"A": "Soplará en la parte superior de la sala.", "B": "Soplará en la parte inferior de la sala.", "C": "Asegurará un caudal máximo.", "D": "Es indiferente su lugar de instalación."}, "k": "B", "e": "", "nk": 0, "top": 1}, {"s": "Andalucía 2025 (2ª conv.)", "n": 30, "q": "La Inspección de la Instalación térmica completa para potencias superiores a 70 kW, se realizará a partir de la fecha de emisión del primer certificado…:", "c": "", "o": {"A": "Cuando la instalación tenga más de 10 años de antigüedad.", "B": "Cada 5 años a partir de los 10 años de antigüedad.", "C": "Cuando tenga más de 5 años de antigüedad.", "D": "Cuando tenga más de 15 años de antigüedad."}, "k": "C", "e": "", "nk": 0, "top": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 1, "q": "Según el RD 1027/2007, para el dimensionamiento de los sistemas de calefacción, ¿qué temperatura de cálculo se empleará para las condiciones interiores?", "c": "", "o": {"A": "25 ºC", "B": "24 ºC", "C": "20 ºC", "D": "21 ºC"}, "k": "D", "e": "IT 1.1.4.1.2, tabla 1.4.1.1: en invierno la temperatura operativa va de 21 a 23 ºC; para calefacción se calcula con 21 ºC.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 2, "q": "Indique cuál de las siguientes frases es cierta referente a las condiciones a cumplir respecto a la filtración del aire exterior mínimo de ventilación.", "c": "", "o": {"A": "Las clases de filtración mínimas a emplear, dependen únicamente de la calidad del aire exterior (ODA).", "B": "Los prefiltros se instalarán en la entrada del aire exterior a la unidad de tratamiento, así como en la entrada del aire de retorno.", "C": "Los aparatos de recuperación de calor no es necesario que se protejan con una sección de filtros.", "D": "Las clases de filtración mínimas a emplear, dependen únicamente de la calidad del aire interior requerida (IDA)."}, "k": "B", "e": "IT 1.1.4.2.4: los prefiltros se instalan en la entrada del aire exterior a la unidad y en la entrada del aire de retorno. La clase de filtro depende de ODA e IDA a la vez.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 3, "q": "Según la clasificación de aire de extracción que realiza el RD 1027/2007, ¿Qué categorías está permitido que pueda ser retornado a los locales?", "c": "", "o": {"A": "Cualquiera de ellos ya que están filtrados.", "B": "El AE 1 si está exento de tabaco.", "C": "Los AE 3 y AE 4.", "D": "Solamente el AE 2."}, "k": "B", "e": "IT 1.1.4.2.5: sólo el aire de categoría AE 1, exento de humo de tabaco, puede retornarse a los locales.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 4, "q": "Con carácter general, los cerramientos (paredes y techos exteriores) de una sala de máquinas, ¿deben tener un elemento o disposición constructiva de baja resistencia mecánica?", "c": "", "o": {"A": "Sí, siempre.", "B": "No, nunca.", "C": "Es totalmente opcional.", "D": "Si, cuando son con generadores de calor a gas."}, "k": "D", "e": "IT 1.3.4.1.2.8: la superficie de baja resistencia mecánica (1/100 del volumen, mínimo 1 m²) se exige en salas de máquinas con generadores a gas.", "nk": 1, "top": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 5, "q": "En el caso de instalar una caldera de biomasa de 32 kW, la evacuación de los productos de combustión se permitirá por fachada si:", "c": "", "o": {"A": "Se trata de una vivienda unifamiliar.", "B": "Se trata de una vivienda en un edificio existente.", "C": "Se trata de una vivienda en un edificio existente siempre que la caldera sea de emisiones NOX de clase 5.", "D": "Nunca se permitirá, siempre la evacuación se realizará por la cubierta del edificio mediante un conducto adecuado."}, "k": "D", "e": "IT 1.3.4.1.3.1: la salida por fachada sólo se permite con combustibles gaseosos (aparatos estancos ≤70 kW o tiro natural ACS ≤24,4 kW). Una caldera de biomasa debe evacuar por cubierta.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 7, "q": "Se pueden utilizar los pasillos como plenums de retorno en instalaciones de climatización:", "c": "", "o": {"A": "Si, solamente en viviendas.", "B": "No, en ningún caso.", "C": "Si, en todos los casos.", "D": "Cuando sirvan de paso del aire desde zonas acondicionadas hacia los locales de servicio."}, "k": "A", "e": "IT 1.3.4.2.10.4: los pasillos y vestíbulos pueden utilizarse como plenums de retorno solamente en viviendas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 8, "q": "¿Cuál sería la categoría mínima de calidad del aire interior (IDA) en un gimnasio ubicado en una residencia de estudiantes?", "c": "", "o": {"A": "IDA 1 (aire de óptima calidad)", "B": "IDA 2 (aire de buena calidad)", "C": "IDA 3 (aire de calidad media)", "D": "IDA 4 (aire de baja calidad)"}, "k": "C", "e": "IT 1.1.4.2.2: los gimnasios son IDA 3 (aire de calidad media), aunque estén dentro de una residencia.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 9, "q": "El caudal de aire de extracción de locales de servicio será como mínimo de:", "c": "", "o": {"A": "2 dm3 /s por planta.", "B": "2 dm3 /s por m2 de superficie en planta.", "C": "Depende de la categoría de la extracción del aire según el uso del local.", "D": "No existe un caudal mínimo."}, "k": "B", "e": "IT 1.1.4.2.5: el caudal de aire de extracción de locales de servicio será como mínimo 2 dm³/s por m² de superficie en planta.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 10, "q": "Según el artículo 2 del Reglamento de Seguridad para Instalaciones Frigoríficas vigente, ¿Qué sistema de refrigeración compacto NO quedaría excluido del ámbito de aplicación del reglamento?", "c": "", "o": {"A": "Con carga de refrigerante inferior a 2´5 kg de refrigerante del grupo L1.", "B": "Con carga de refrigerante inferior a 0´5 kg de refrigerante del grupo L2.", "C": "Con carga de refrigerante superior a 0´5 kg de refrigerante del grupo L2.", "D": "Con carga de refrigerante inferior a 0´5 kg de refrigerante del grupo L3."}, "k": "C", "e": "RSIF (RD 552/2019), art. 2: quedan excluidos los sistemas compactos con menos de 2,5 kg de L1 o menos de 0,5 kg de L2/L3. Con más de 0,5 kg de L2 sí se aplica el reglamento. (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 11, "q": "Complete la siguiente frase: “En el Proyecto o Memoria Técnica se indicarán las prestaciones energéticas de los equipos de generación de calor y frío seleccionados ...”", "c": "", "o": {"A": "Únicamente para su potencia máxima.", "B": "Únicamente para su potencia mínima.", "C": "En el rango de potencias en las que van a trabajar en la instalación.", "D": "No es necesario indicarlas."}, "k": "C", "e": "IT 1.2.4.1.1: en el proyecto o memoria se indican las prestaciones energéticas de los generadores en el rango de potencias en que van a trabajar.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 12, "q": "Los emisores de calefacción deberán estar calculados para una temperatura máxima de entrada al emisor de:", "c": "", "o": {"A": "70 ºC", "B": "60 ºC", "C": "50 ºC", "D": "90 ºC"}, "k": "B", "e": "IT 1.2.4.1.2.1 (RD 178/2021): los emisores de calefacción se calcularán para una temperatura máxima de entrada de 60 ºC.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 13, "q": "Para evitar la congelación del agua en tuberías expuestas a temperaturas del aire menores a las del cambio de estado se podrá recurrir a", "c": "", "o": {"A": "Empleo de una mezcla de agua y anticongelante.", "B": "Circulación del fluido.", "C": "Aislamiento de la tubería.", "D": "Todas son correctas."}, "k": "D", "e": "IT 1.3.4.2.3 (protección contra heladas): se puede usar anticongelante, mantener la circulación o aislar; todas son válidas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 14, "q": "Las instalaciones térmicas se utilizarán y mantendrán de acuerdo con su potencia térmica nominal y sus características técnicas, de conformidad con los siguientes procedimientos: (señale la respuesta incorrecta)", "c": "", "o": {"A": "Programa de gestión energética", "B": "Programa de mantenimiento preventivo", "C": "Instrucciones de manejo y maniobra", "D": "Certificado final de obra"}, "k": "D", "e": "IT 3.1 y 3.3: las instalaciones se usan y mantienen según el programa de mantenimiento preventivo, el programa de gestión energética y las instrucciones de manejo y maniobra. El certificado final de obra no es un procedimiento de uso.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 15, "q": "Con respecto a las comunicaciones de reforma de una instalación térmica existente que precisen comunicación al órgano competente de la Comunidad Autónoma, ¿quién tendrá la obligación de comunicar la acreditación del cumplimiento de las obligaciones reglamentariamente exigibles previas a la puesta en servicio de la instalación?", "c": "", "o": {"A": "El titular de la instalación.", "B": "La empresa instaladora habilitada.", "C": "La empresa mantenedora habilitada.", "D": "El Organismo de Control."}, "k": "B", "e": "Art. 24 RITE: para la puesta en servicio (nueva o reforma) la empresa instaladora presenta el certificado de la instalación y la documentación al órgano competente.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 16, "q": "Según el reglamento de instalaciones térmicas en los edificios (RITE), se considera sala de máquinas al local técnico donde se alojan los equipos de producción de frío o calor y otros equipos auxiliares y accesorios de la instalación térmica, con potencia", "c": "", "o": {"A": "Superior o igual a 60 kW", "B": "Superior o igual a 70 kW", "C": "Superior a 70 kW", "D": "Superior a 100 kW"}, "k": "C", "e": "IT 1.3.4.1.2.1: los generadores de calor con potencia térmica nominal superior a 70 kW deben instalarse en sala de máquinas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 17, "q": "Los locales con calefacción mediante generadores de aire caliente o tubos radiantes a gas, ¿en qué supuesto tendrán la consideración de sala de máquinas?", "c": "", "o": {"A": "No tendrán la consideración de sala de máquinas", "B": "Con potencia superior o igual a 70 kW", "C": "Con potencia superior a 70 kW", "D": "Con potencia superior a 100 kW"}, "k": "A", "e": "IT 1.3.4.1.2.1: los locales con generadores de aire caliente, tubos radiantes a gas o similares no tienen la consideración de sala de máquinas (se aplica la UNE-EN 13410 para ventilación).", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 18, "q": "Las salas de máquinas con generadores de calor a gas natural se ubicarán preferentemente", "c": "", "o": {"A": "En semisótano o primer sótano.", "B": "En planta baja.", "C": "En cubierta.", "D": "En un nivel igual o superior al semisótano o primer sótano."}, "k": "D", "e": "IT 1.3.4.1.2.8: no se permiten salas con calderas a gas por debajo de semisótano o primer sótano.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 19, "q": "En instalaciones de potencia térmica nominal mayor que 70 kW, el equipamiento mínimo de aparatos de medición en colectores de impulsión y retorno de un fluido portador será:", "c": "", "o": {"A": "Un termómetro.", "B": "Un manómetro.", "C": "Un termómetro y un manómetro.", "D": "Un pirómetro o un pirostato con escala indicadora."}, "k": "C", "e": "IT 1.3.4.4.1 (equipamiento mínimo >70 kW): en colectores de impulsión y retorno, un termómetro y un manómetro.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 20, "q": "La unificación del uso de los conductos de evacuación de los productos de la combustión con otras instalaciones de evacuación", "c": "", "o": {"A": "Está prohibida.", "B": "Está permitida.", "C": "Está recomendada.", "D": "Está permitida en circunstancias especiales."}, "k": "A", "e": "IT 1.3.4.1.3.2: queda prohibida la unificación de los conductos de evacuación de humos con otras instalaciones de evacuación.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 1, "q": "¿Qué espesor mínimo de aislamiento debe tener un material con conductividad térmica a 10°C de 0,040 W/(mK) de una tubería de diámetro exterior de 90 mm que transporta fluidos fríos a 15°C y que discurre por el interior de los edificios?", "c": "", "o": {"A": "20 mm", "B": "30 mm", "C": "35 mm", "D": "40 mm"}, "k": "B", "e": "Tabla 1.2.4.2.3 (fluidos fríos, interior): diámetro 60<D≤90 mm y temperatura mayor de 10 ºC → 30 mm.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 2, "q": "En una instalación de aire acondicionado con refrigerante R-744, ¿cuál es la clase de inflamabilidad del refrigerante?", "c": "", "o": {"A": "1", "B": "2L", "C": "2", "D": "3"}, "k": "A", "e": "El R-744 es CO₂: clase de seguridad A1 según UNE-EN 378 / RSIF, es decir, inflamabilidad clase 1 (no inflamable). (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 3, "q": "En un colegio de 300 alumnos, con 20 alumnos por clase y el docente, se ha de calcular la exigencia de calidad del aire interior. ¿Cuál es el caudal mínimo de aire exterior de ventilación, que hay que inyectar por hora en cada clase?", "c": "", "o": {"A": "1512 m3/h", "B": "1440 m3/h", "C": "945 m3/h", "D": "900 m3/h"}, "k": "C", "e": "Aula: IDA 2 = 12,5 l/s por persona. 21 personas × 12,5 = 262,5 l/s × 3,6 = 945 m³/h.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 4, "q": "En el aula del ejercicio anterior, se precisa calcular la filtración del aire exterior mínimo de ventilación, sabiendo que es un aire puro que se ensucia sólo temporalmente. ¿Cómo mínimo, que clase de filtración hay que instalar?", "c": "", "o": {"A": "F8", "B": "F7", "C": "F9", "D": "F6 + F8"}, "k": "D", "e": "Aire puro que se ensucia temporalmente = ODA 2. Aula = IDA 2. Tabla 1.4.2.5: ODA 2 + IDA 2 → F6 + F8.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 5, "q": "Un sistema de agua caliente sanitaria de potencia 75 kW dispone de un sistema de vaciado total y varios vaciados parciales. ¿Cuál deberá ser el diámetro mínimo de dichos elementos de vaciado?", "c": "", "o": {"A": "20 mm para los sistemas parciales y 32 mm para el sistema total.", "B": "20 mm para los sistemas parciales y 25 mm para el sistema total.", "C": "15 mm para los sistemas parciales y 25 mm para el sistema total.", "D": "Ninguno de los anteriores."}, "k": "B", "e": "IT 1.3.4.2.3 y tabla 3.4.2.3: vaciados parciales DN 20 mm; vaciado total para 70<P≤150 kW en calor: 25 mm.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 6, "q": "En un edificio existente realizamos la reforma de una sala de máquinas de 80 m² con calderas de gas cuya potencia térmica nominal es de 500 kW, en la que no es posible lograr la superficie no resistente al exterior, o a patio de ventilación. ¿Qué opción de las siguientes es la adecuada?", "c": "", "o": {"A": "Se realizará una ventilación forzada y se instalará un sistema de detección y corte de fugas de gas. En la ventilación, se dispondrá de un ventilador de impulsión, soplando en la parte inferior de la sala, que asegure un caudal mínimo, de 1.700 m³/h.", "B": "Se deberá obligatoriamente realizar ventilación natural directa al exterior, mediante aberturas de área libre mínima de 2.000 cm².", "C": "Se podrá realizar ventilación natural directa por conductos horizontales de sección libre mínima de 5.000 cm².", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "IT 1.3.4.1.2.8: si no hay superficie de baja resistencia → ventilación forzada + detección y corte de gas. Caudal mínimo 1,8·PN + 10·A = 1,8·500 + 10·80 = 1.700 m³/h.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 7, "q": "¿Podemos considerar como patio de ventilación, a efectos de evacuación de los pdC, un patio de 4 m2 al cual dan 9 locales que pueden contener aparatos conducidos?", "c": "", "o": {"A": "Sí, siempre.", "B": "No, tendría que ser como mínimo de 4,5 m2 y tratarse de un patio de ventilación de edificios existentes.", "C": "No, tendría que ser como mínimo de 4,5 m2, ya sea un patio de ventilación de edificios nuevos o existentes.", "D": "No, tendría que ser como mínimo de 3 m2."}, "k": "B", "e": "IT 1.3.4.1.3.1: en edificios existentes el patio debe tener 0,5 × NT m² (NT = locales), mínimo 4 m². 0,5 × 9 = 4,5 m². Sólo vale para edificios existentes.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 8, "q": "Para una sala de máquinas, con potencia nominal de generación 200 kW, superficie de local 20 m2 y volumen de local 50 m3, se debe disponer un sistema de ventilación natural por conducto. ¿Cuál debe ser la sección libre mínima (cm2) de los conductos de ventilación, según sea vertical u horizontal?", "c": "", "o": {"A": "Vertical, 150 cm2; horizontal, 200 cm2", "B": "Vertical, 375 cm2; horizontal, 500 cm2", "C": "Vertical, 750 cm2; horizontal, 1000 cm2", "D": "Vertical, 1500 cm2; horizontal, 2000 cm2"}, "k": "D", "e": "IT 1.3.4.1.2.7: conductos verticales 7,5 cm²/kW y horizontales 10 cm²/kW. 200 kW → 1.500 y 2.000 cm².", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 9, "q": "En una sala de máquinas con generadores de calor a gas, con potencia nominal de generación 200 kW y volumen de local 50 m3, ¿cuál debe ser la mínima superficie de baja resistencia mecánica en comunicación directa a una zona exterior o patio descubierto, si dicha superficie se fragmenta en dos?", "c": "", "o": {"A": "1 m2, con un mínimo de 250 cm2 por división", "B": "1,1 m2, con un mínimo de 250 cm2 por división", "C": "2 m2, con un mínimo de 250 cm2 por división", "D": "2,2 m2, con un mínimo de 500 cm2 por división"}, "k": "B", "e": "Superficie = volumen/100 = 0,5 m², pero el mínimo es 1 m². Al fragmentarse se aumenta un 10 % → 1,1 m², con mínimo 250 cm² por división.", "nk": 1, "top": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 10, "q": "La alimentación de los circuitos de una instalación térmica se realizará mediante un dispositivo, denominado desconector, que servirá para reponer las pérdidas de agua. El diámetro mínimo de las conexiones es función de la potencia útil nominal de la instalación. Para una instalación de calefacción de potencia útil nominal 400 kW, el diámetro nominal mínimo de la conexión será:", "c": "", "o": {"A": "20 mm", "B": "25 mm", "C": "32 mm", "D": "40 mm"}, "k": "B", "e": "Tabla 3.4.2.2 (conexión de alimentación): 150<P≤400 kW en calor → DN 25 mm.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 1, "q": "¿A qué grupo pertenecen los refrigerantes no inflamables y de acción tóxica ligera o nula?", "c": "", "o": {"A": "Alta seguridad (L1)", "B": "Media seguridad (L2)", "C": "Media seguridad (A2L)", "D": "Baja seguridad (L3)"}, "k": "A", "e": "RSIF (RD 552/2019): grupo L1 alta seguridad = refrigerantes no inflamables y de toxicidad ligera o nula (A1). (No es RITE, respuesta elaborada.)", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 2, "q": "¿Cuál es el color de fondo de las señales de las tuberías de refrigerante?", "c": "", "o": {"A": "Blanco RAL 1021", "B": "Amarillo RAL 1021", "C": "Verde RAL 1021", "D": "Azul RAL 1021"}, "k": "B", "e": "RSIF, señalización de tuberías de refrigerante: fondo amarillo RAL 1021. (No es RITE, respuesta elaborada.)", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 3, "q": "Cómo mínimo, ¿Qué categoría de calidad de aire interior se deberá alcanzar en una sala de cine?", "c": "", "o": {"A": "AE 3", "B": "IDA 2", "C": "ODA 2", "D": "IDA 3"}, "k": "D", "e": "IT 1.1.4.2.2: cines, teatros, salones de actos, bares, restaurantes, comercios y gimnasios son IDA 3.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 4, "q": "¿Cuál es la mínima potencia útil nominal que obliga a que los generadores de calor y de frío dispondrán de un dispositivo que permita registrar su número de horas de funcionamiento?", "c": "", "o": {"A": "De 30 kW", "B": "De 50 kW", "C": "De 70 kW", "D": "De 100 Kw"}, "k": "C", "e": "IT 1.2.4.4: generadores de calor y frío de potencia útil nominal mayor que 70 kW llevan contador de horas de funcionamiento.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 5, "q": "Respecto a las dimensiones de una sala de máquinas en una instalación térmica, ¿cuál es la opción correcta?", "c": "", "o": {"A": "La altura mínima de la sala será de 2´25 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´5 m.", "B": "La altura mínima de la sala será de 2´50 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´5 m.", "C": "La altura mínima de la sala será de 2´50 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´3 m.", "D": "La altura mínima de la sala será de 2´25 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´3 m."}, "k": "B", "e": "IT 1.3.4.1.2.2: altura mínima de la sala 2,50 m y 0,5 m libres sobre la caldera.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 6, "q": "Según el reglamento de instalaciones térmicas, ¿para qué temperatura máxima de entrada al emisor de calefacción han de estar calculados los emisores de calefacción?", "c": "", "o": {"A": "55º C", "B": "60º C", "C": "65º C", "D": "70º C"}, "k": "B", "e": "IT 1.2.4.1.2.1 (RD 178/2021): temperatura máxima de entrada al emisor 60 ºC.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 7, "q": "Según el reglamento de instalaciones térmicas, en edificios nuevos ¿cuál es la capacidad mínima de almacenamiento de biocombustibles?", "c": "", "o": {"A": "La suficiente para cubrir el consumo de 5 días", "B": "La suficiente para cubrir el consumo de 10 días", "C": "La suficiente para cubrir el consumo de 15 días", "D": "La suficiente para cubrir el consumo de 20 días"}, "k": "C", "e": "IT 1.3.4.1.4: en edificios nuevos el almacenamiento de biocombustible cubrirá el consumo de 15 días.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 8, "q": "¿Dónde se instalan los prefiltros?", "c": "", "o": {"A": "A la salida de la unidad de tratamiento del aire exterior.", "B": "Justo antes de los filtros finales.", "C": "Después de la sección de tratamiento.", "D": "En la entrada del aire exterior a la unidad de tratamiento, así como en la entrada del aire de retorno."}, "k": "D", "e": "IT 1.1.4.2.4: prefiltros en la entrada del aire exterior a la unidad de tratamiento y en la entrada del aire de retorno.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 9, "q": "Las instalaciones que requieren sala de máquinas de riesgo alto son aquellas que:", "c": "", "o": {"A": "Han sido realizadas en edificios institucionales o de pública concurrencia.", "B": "Trabajen con agua a temperatura máxima de 100 °C.", "C": "Se hayan realizado reformas en edificios de uso residencial existentes con calderas de gas.", "D": "Se haya cambiado el tipo de energía utilizada"}, "k": "A", "e": "IT 1.3.4.1.2.4: sala de máquinas de riesgo alto = edificios institucionales o de pública concurrencia, o agua a más de 110 ºC.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 10, "q": "¿Con qué periodicidad se realizará la inspección de la instalación térmica completa?", "c": "", "o": {"A": "Anualmente.", "B": "Cada dos años.", "C": "Cada cinco años.", "D": "Cada quince años."}, "k": "D", "e": "IT 4.3.3: la inspección de la instalación térmica completa se realiza cada quince años (la primera al superar los 15 años de antigüedad).", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 11, "q": "La prueba preliminar de estanquidad de las redes de distribución de tuberías en una instalación térmica, que consiste en detener fallos de continuidad de la red y evitar los daños que podría provocar la prueba de resistencia mecánica, se debe realizar a:", "c": "", "o": {"A": "Muy alta presión", "B": "Alta presión", "C": "Media presión", "D": "Baja presión"}, "k": "D", "e": "IT 2.2.2: la prueba preliminar de estanquidad se hace a baja presión para detectar fallos de continuidad antes de la prueba de resistencia.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 12, "q": "En una nueva instalación o en la reforma de una existente, ¿quién tiene la obligación de comunicar la acreditación del cumplimiento de las condiciones reglamentariamente exigibles previas a la puesta en servicio de la instalación térmica?", "c": "", "o": {"A": "El titular de la instalación.", "B": "El usuario de la instalación.", "C": "La empresa instaladora habilitada en instalaciones térmicas.", "D": "El instalador habilitado en instalaciones térmicas."}, "k": "C", "e": "Art. 24 RITE: la empresa instaladora presenta al órgano competente el certificado de la instalación y la documentación para la puesta en servicio.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 13, "q": "En el caso de reforma de una instalación térmica existente, por sustitución de una caldera de gas por un equipo de aerotermia de potencia térmica nominal de generación de calor superior a 5 kW, ¿debe realizarse la comunicación de reforma de instalación existente, según Orden de 27 de abril de 2009?", "c": "", "o": {"A": "Siempre.", "B": "Sí, pero solo en el caso de que la potencia térmica nominal de generación de calor instalada sea superior a 70 kW.", "C": "Sí, pero solo si comporta una variación superior al 25% de la su potencia útil nominal del equipo sustituido.", "D": "No."}, "k": "A", "e": "Art. 2.3 RITE: sustituir un generador por otro de distintas características o cambiar el tipo de energía es una reforma, y toda reforma de ≥5 kW se comunica (art. 15 y 24). En Aragón lo regula la Orden de 27/4/2009.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 14, "q": "En un edificio de nueva construcción, de 3 plantas y 4 viviendas por planta, se plantea una instalación térmica en edificio compuesta por un generador de calor y frío por vivienda, de potencia térmicas nominales 10,8 kW en calor y 9,5 kW en frío, ¿cuál debe ser la documentación técnica sobre la que debe ejecutarse la instalación?", "c": "", "o": {"A": "Proyecto de la instalación térmica del edificio.", "B": "Proyecto de la instalación térmica de cada vivienda.", "C": "Memoria técnica de la instalación térmica del edificio.", "D": "Memoria técnica de la instalación térmica de cada vivienda."}, "k": "A", "e": "Art. 15.2 RITE: con varios generadores en un edificio la potencia es la suma: 12 viviendas × 10,8 kW = 129,6 kW ≥ 70 kW → proyecto de la instalación del edificio.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 15, "q": "En el caso de reforma de una instalación térmica, por sustitución de un generador de calor o de frío por otro de diferentes características, si la potencia térmica nominal de generación de calor o frío es superior a 5 kW e inferior a 70 kW, ¿qué documentación técnica debe presentarse en la comunicación de reforma de instalación existente, según Orden de 27 de abril de 2009?", "c": "", "o": {"A": "Únicamente certificado de instalación térmica, suscrito por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa", "B": "Memoria técnica y certificado de la instalación térmica, suscritos por empresa instaladora y profesional habilitados en instalaciones térmicas.", "C": "Memoria técnica y certificado de instalación térmica, suscritos por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa; certificado de inspección favorable emitido por organismo de control acreditado.", "D": "Proyecto y certificado de dirección de obra; certificado de instalación térmica, suscritos por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa; certificado de inspección favorable emitido por organismo de control acreditado."}, "k": "B", "e": "Arts. 15 y 16 RITE: entre 5 y 70 kW basta memoria técnica más certificado de la instalación, firmados por la empresa instaladora y el instalador habilitado. No hace falta OCA ni proyecto.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 16, "q": "En el caso de una instalación térmica de potencia superior a 5 kW e inferior a 70 kW, en el control de la instalación terminada, todas las pruebas deben realizarse en presencia de:", "c": "", "o": {"A": "El titular de la instalación.", "B": "El inspector de la empresa suministradora.", "C": "El instalador habilitado de la empresa instaladora habilitada.", "D": "El director de la instalación."}, "k": "C", "e": "IT 2.1: todas las pruebas se efectúan en presencia del instalador habilitado, o del director de la instalación cuando éste sea preceptivo (≥70 kW, con proyecto).", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 17, "q": "En una instalación térmica de una vivienda, de potencia térmica nominal de generación de calor 30 kW y combustible gas, la periodicidad de las operaciones de mantenimiento preventivo será, al menos:", "c": "", "o": {"A": "Cada cuatro años.", "B": "Cada dos años.", "C": "Anual.", "D": "Semestral."}, "k": "B", "e": "Tabla 3.1: calderas murales a gas ≤70 kW en viviendas → mantenimiento cada 2 años.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 18, "q": "En salas de máquinas con generadores de calor a gas, los cerramientos (paredes y techos exteriores) del recinto deben tener una superficie de baja resistencia mecánica de superficie mínima que, en m2, sea la centésima parte del volumen del local expresado en m3, con un mínimo de:", "c": "", "o": {"A": "1 m2", "B": "2 m2", "C": "250 cm2", "D": "500 cm2"}, "k": "A", "e": "IT 1.3.4.1.2.8: superficie de baja resistencia = 1/100 del volumen en m³, con un mínimo de 1 m².", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 19, "q": "En una instalación térmica de un edificio, de potencia térmica nominal de generación de frío superior a 70 kW e inferior a 1000 kW, la evaluación periódica del rendimiento de los equipos generadores de frío debe realizarse al menos:", "c": "", "o": {"A": "Una vez al mes; la primera al inicio de la temporada.", "B": "Cada tres meses; la primera al inicio de la temporada.", "C": "Anualmente.", "D": "Cada dos años."}, "k": "B", "e": "IT 3.4.2 y tabla 3.5: generadores de frío de 70 a 1.000 kW → cada 3 meses, la primera al inicio de la temporada.", "nk": 1, "top": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 20, "q": esión máxima de trabajo, con un mínimo de 6 bar.", "nk": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 1, "q": "En una instalación de producción de agua caliente sanitaria por medio de un calentador instantáneo de potencia térmica nominal 70kW, ¿qué documentación técnica es preceptiva presentar para acreditar el cumplimiento reglamentario ante el órgano competente de la Comunidad Autónoma?", "c": "", "o": {"A": "Proyecto.", "B": "Memoria técnica.", "C": "No es preceptivo presentar ningún tipo de documentación.", "D": "Comunicación de puesta en marcha."}, "k": "A", "e": "Art. 15.1.a) RITE: potencia térmica nominal ≥ 70 kW → proyecto. (Sólo se exime la ACS cuando la suma es ≤ 70 kW).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 2, "q": "En el caso de instalaciones solares térmicas, cuando no exista equipo de energía de apoyo, a efectos de cumplimentar la documentación técnica de diseño requerida, la potencia se determinará multiplicando la superficie de apertura de campo de los captadores solares instalada por:", "c": "", "o": {"A": "0,8 kW/m2", "B": "0,7 kW/m2", "C": "0,6 kW/m2", "D": "0,5 kW/m2"}, "k": "B", "e": "Art. 15.3 RITE: sin equipo de apoyo, la potencia de la solar térmica es superficie de apertura × 0,7 kW/m².", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 3, "q": "En cuál de los siguientes supuestos es preceptivo, para operaciones de mantenimiento, la colaboración de un técnico titulado competente con funciones de director de mantenimiento:", "c": "", "o": {"A": "Instalación térmica de calefacción de potencia térmica nominal de 1.500 kW", "B": "Instalación térmica de refrigeración de potencia térmica nominal de 1.500 kW", "C": "Instalación de calefacción solar cuya potencia térmica de 400 kW", "D": "Instalación de refrigeración solar cuya potencia térmica de 400 kW"}, "k": "B", "e": "Art. 26 RITE: director de mantenimiento obligatorio con más de 5.000 kW en calor y/o 1.000 kW en frío, o solar mayor de 400 kW. 1.500 kW de frío lo supera.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 4, "q": "A efectos de su inspección de eficiencia energética, la calificación de la instalación será condicionada cuando se detecte la existencia de, al menos:", "c": "", "o": {"A": "Un defecto grave o de un defecto leve ya detectado en otra inspección anterior y que no se haya corregido.", "B": "Dos defectos leves.", "C": "Un defecto muy grave o de un defecto leve ya detectado en otra inspección anterior y que no se haya corregido.", "D": "Dos defectos muy graves."}, "k": "A", "e": "IT 4.3 / art. 32 RITE: calificación condicionada con al menos un defecto grave, o un defecto leve de una inspección anterior sin corregir.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 5, "q": "En un edificio existente, ¿cuál es la superficie mínima en planta de un patio de ventilación no techado para permitir la evacuación de productos de la combustión de generadores de calor que utilicen gas como combustible?", "c": "", "o": {"A": "2 m2", "B": "6 m2", "C": "4 m2", "D": "No se permite la evacuación de productos de la combustión a través de un patio de ventilación en ningún caso."}, "k": "C", "e": "IT 1.3.4.1.3.1: patio de ventilación en edificios existentes: 0,5 × NT m², con un mínimo de 4 m².", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 6, "q": "En una instalación de climatización, ¿en qué puntos deben instalarse los prefiltros?", "c": "", "o": {"A": "En los correspondientes a la salida de la unidad de tratamiento del aire exterior.", "B": "Justo antes de los filtros finales.", "C": "Después de la sección de tratamiento.", "D": "En la entrada del aire exterior a la unidad de tratamiento y en la entrada del aire de retorno."}, "k": "D", "e": "IT 1.1.4.2.4: prefiltros en la entrada del aire exterior y en la entrada del aire de retorno.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 7, "q": "En una guardería, ¿cuál es la categoría de calidad del aire interior que se debe alcanzar como mínimo?", "c": "", "o": {"A": "IDA 1", "B": "IDA 2", "C": "IDA 3", "D": "IDA 4"}, "k": "A", "e": "IT 1.1.4.2.2: hospitales, clínicas, laboratorios y guarderías son IDA 1.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 8, "q": "En el diseño de una instalación térmica de nueva construcción, ¿cuál debe ser la temperatura máxima de entrada al emisor de calefacción?", "c": "", "o": {"A": "45 ºC", "B": "50 ºC", "C": "60 ºC", "D": "70 ºC"}, "k": "C", "e": "IT 1.2.4.1.2.1 (RD 178/2021): temperatura máxima de entrada al emisor 60 ºC.", "nk": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 9, "q": "En una sala de calderas para realizar los trabajos de mantenimiento e inspección, ¿cuál será el nivel mínimo de iluminación medio en servicio?", "c": "", "o": {"A": "200 lux, con una uniformidad media de 0,7.", "B": "400 lux, con una uniformidad media de 0,5.", "C": "200 lux, con una uniformidad media de 0,5.", "D": "400 lux, con una uniformidad media de 1."}, "k": "C", "e": "IT 1.3.4.1.2.3: iluminación mínima en salas de máquinas 200 lux con uniformidad media 0,5.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 10, "q": "¿Cuál es la periodicidad obligatoria de limpieza del quemador de una caldera de más de 70 kW?", "c": "", "o": {"A": "Mensual.", "B": "Trimestral.", "C": "Semestral.", "D": "Anual."}, "k": "A", "e": "Tabla 3.3 (>70 kW): limpieza del quemador de la caldera: mensual (m).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 11, "q": "En el caso de la reforma de una instalación térmica en edificio existente, ¿quién tiene la obligación de comunicar la acreditación del cumplimiento de las condiciones reglamentariamente exigibles previas a la puesta en servicio de la instalación térmica?", "c": "", "o": {"A": "El titular de la instalación.", "B": "El usuario de la instalación.", "C": "El instalador habilitado.", "D": "La empresa instaladora habilitada."}, "k": "D", "e": "Art. 24 RITE: la empresa instaladora presenta al órgano competente el certificado de la instalación y la documentación (proyecto o memoria, etc.).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 12, "q": "Los generadores de calor que tengan la misma configuración para la evacuación de los productos de la combustión, podrán tener el conducto de evacuación común a varios generadores, siempre y cuando la suma de la potencia térmica nominal sea igual o menor a:", "c": "", "o": {"A": "400 kW", "B": "500 kW", "C": "1.000 kW", "D": "5.000 kW"}, "k": "A", "e": "IT 1.3.4.1.3.2: conducto común a varios generadores de igual configuración si la suma de potencias no supera 400 kW (más de 400 kW cada uno necesita conducto propio).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 13, "q": "¿Cuál es la temperatura máxima permitida en recintos calefactados de uso administrativo que consuman energía convencional para la generación de calor?", "c": "", "o": {"A": "26 ºC", "B": "25 ºC", "C": "23 ºC", "D": "21 ºC"}, "k": "D", "e": "IT 3.8.2: en recintos calefactados de uso administrativo, comercial, cultural, ocio y transporte, la temperatura no será mayor de 21 ºC.", "nk": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 14, "q": "En las inspecciones periódicas de eficiencia energética, el rendimiento a potencia útil nominal del generador de calor tendrá un valor mínimo de:", "c": "", "o": {"A": "90%", "B": "82%", "C": "75%", "D": "80%"}, "k": "D", "e": "IT 4.2.1: en las inspecciones periódicas el rendimiento a potencia útil nominal no será inferior al 80 %.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 15, "q": "Indique las siglas que definen la relación entre la capacidad frigorífica y la potencia efectivamente absorbida.", "c": "", "o": {"A": "COOP", "B": "CLO", "C": "EER", "D": "COP"}, "k": "C", "e": "EER (Energy Efficiency Ratio) = capacidad frigorífica / potencia absorbida. COP es el equivalente en calefacción.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 16, "q": "Según el Reglamento de seguridad para instalaciones frigoríficas, indique a que grupo simplificado pertenecen los refrigerantes de clase de seguridad A2L:", "c": "", "o": {"A": "Grupo de alta seguridad (L1)", "B": "Grupo de media seguridad (L2)", "C": "Grupo de baja seguridad (L3)", "D": "A ninguno"}, "k": "B", "e": "RSIF (RD 552/2019), IF-02: grupo L2 (media seguridad) incluye A2L, A2, B1, B2L y B2. L1 = A1; L3 = A3 y B3. (No es RITE, respuesta elaborada.)", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 17, "q": "Se dispondrán dispositivos para la medición de la energía térmica generada o demandada, en centrales de potencia útil nominal mayor que:", "c": "", "o": {"A": "20 kW en refrigeración o 70 kW calefacción.", "B": "70 kW en refrigeración o calefacción.", "C": "60 kW en refrigeración o calefacción.", "D": "No es obligatorio, es recomendable si lo determina el proyectista."}, "k": "B", "e": "IT 1.2.4.4: medición de la energía térmica generada o demandada en centrales de potencia útil nominal mayor que 70 kW, en refrigeración o calefacción.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 18, "q": "¿Con qué periodicidad se realizarán las inspecciones de las instalaciones térmicas completas?", "c": "", "o": {"A": "Cada dos años.", "B": "Cada cinco años.", "C": "Cada diez años.", "D": "Cada quince años."}, "k": "D", "e": "IT 4.3.3: la inspección de la instalación térmica completa se realiza cada quince años.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 19, "q": "Las salas situadas en edificios institucionales o de pública concurrencia se consideran:", "c": "", "o": {"A": "Salas de máquinas de riesgo alto.", "B": "Salas de máquinas de pública concurrencia.", "C": "Salas de máquinas específica.", "D": "Salas de máquinas de seguridad elevada."}, "k": "A", "e": "IT 1.3.4.1.2.4: las salas en edificios institucionales o de pública concurrencia son salas de máquinas de riesgo alto.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 20, "q": "En una instalación térmica, ¿cuál es el porcentaje máximo admisible de perdida de calor en los conductos y accesorios de la red de impulsión respecto a la potencia que transportan?", "c": "", "o": {"A": "8%", "B": "4%", "C": "2%", "D": "5%"}, "k": "B", "e": "IT 1.2.4.2.2: la pérdida de calor en conductos y accesorios de impulsión no será mayor que el 4 % de la potencia que transportan.", "nk": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 1, "q": "Según el RITE, la prueba de resistencia mecánica en circuitos cerrados de agua refrigerada o de agua caliente (hasta 100 ºC) se realiza a una presión de:", "c": "", "o": {"A": "1,5 veces la presión máxima de trabajo, con mínimo 3 bar.", "B": "2 veces la presión máxima de trabajo, con mínimo 6 bar.", "C": "1,5 veces la presión máxima de trabajo, con mínimo 6 bar.", "D": "2 veces la presión máxima de trabajo, con mínimo 3 bar."}, "k": "C", "e": "IT 2.2.2: 1,5 veces la presión máxima de trabajo con un mínimo de 6 bar (agua hasta 100 ºC).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 2, "q": "Un sistema de agua caliente sanitario de potencia 400 kW dispone de un sistema de vaciado total y varios parciales. ¿Cuál es el diámetro mínimo de los elementos de vaciado?", "c": "", "o": {"A": "20 mm para los sistemas parciales y 32 mm para el sistema total.", "B": "20 mm para los sistemas parciales y 25 mm para el sistema total.", "C": "25 mm para los sistemas parciales y 25 mm para el sistema total.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "Tabla 3.4.2.3: parciales DN 20 mm; total con 150<P≤400 kW en calor → 32 mm.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 3, "q": "En un edificio existente, se realiza la reforma de su sala de calderas de calefacción a gas natural, cuya superficie es de 50 m². Se ha de considerar que no es posible lograr la superficie de baja resistencia mecánica en dicha sala y que la potencia nominal de las calderas es 200 kW. Determinar cuál de las siguientes configuraciones será la adecuada.", "c": "", "o": {"A": "Ventilación forzada y se instalará un sistema de detección y corte de fugas de gas. En la ventilación, se dispondrá de un ventilador de impulsión, soplando en la parte inferior de la sala, que asegure un caudal mínimo, de 750 m³/h.", "B": "Ventilación natural directa al exterior, mediante aberturas de área libre mínima de 1.000 cm².", "C": "Ventilación natural directa al exterior, mediante conductos horizontales de sección libre mínima de 1.500 cm².", "D": "Ventilación forzada y se instalará un sistema de detección y corte de fugas de gas. En la ventilación, se dispondrá de un ventilador de impulsión, soplando en la parte inferior de la sala, que asegure un caudal mínimo, de 860 m³/h."}, "k": "D", "e": "IT 1.3.4.1.2.8: sin superficie de baja resistencia → ventilación forzada + detección y corte de gas. Caudal = 1,8·200 + 10·50 = 860 m³/h.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 4, "q": "Calcula la ventilación mínima de una sala de máquinas con una superficie de 35 m² que tiene instalados en su interior generadores de calor con una potencia térmica nominal total de 200 kW que utilizan como combustible biomasa, si se ventila de forma natural al exterior por orificios:", "c": "", "o": {"A": "El local necesita una superficie abierta al aire libre mínima de 1.000 cm²", "B": "El local necesita una superficie abierta al aire libre mínima de 5.000 cm²", "C": "Al ser el combustible biomasa, no es precisa ventilación mínima.", "D": "La ventilación deberá ser obligatoriamente forzada."}, "k": "A", "e": "IT 1.3.4.1.2.7: orificios de 5 cm²/kW → 200 × 5 = 1.000 cm².", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 6, "q": "En un edificio de viviendas, se dispone de tres equipos generadores de calor instalados en una sala de máquinas cuya potencia térmica nominal total asciende a 800.000 kcal/h. ¿Con qué periodicidad mínima debe la empresa mantenedora medir y registrar el contenido de CO y CO₂ en los productos de la combustión?", "c": "", "o": {"A": "1 mes", "B": "2 meses", "C": "3 meses", "D": "4 meses"}, "k": "C", "e": "800.000 kcal/h ÷ 860 = 930 kW. Tabla 3.4: 70<P≤1.000 kW → cada 3 meses (más de 1.000 kW sería mensual).", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 7, "q": "En una residencia de ancianos con una capacidad máxima de 200 personas, se proyecta la construcción de un aula taller con un aforo de 50 personas. A efectos de cumplir con las exigencias de calidad del aire interior, ¿cuál es el caudal mínimo de aire exterior de ventilación que debe impulsarse al aula taller?", "c": "", "o": {"A": "625 m3/h", "B": "2.250 m3/h", "C": "6.250 m3/h", "D": "22.500 m3/h"}, "k": "B", "e": "Residencias de ancianos y aulas son IDA 2 = 12,5 l/s·persona. 50 × 12,5 = 625 l/s = 2.250 m³/h.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 8, "q": "En el mismo supuesto anterior, se requiere determinar la filtración mínima del aire exterior de ventilación. Considerando que se trata de aire de buena calidad que solo presenta contaminación temporal, ¿cuál es la clase mínima de filtración que debe instalarse?", "c": "", "o": {"A": "F8", "B": "F7", "C": "F9", "D": "F6 + F8"}, "k": "D", "e": "Aire de buena calidad con contaminación temporal = ODA 2; residencia/aula = IDA 2 → tabla 1.4.2.5: F6 + F8.", "nk": 1, "top": 1}, {"s": "Aragón 2026 (con reglamento)", "n": 10, "q": "Según la sección HE 4 del Código Técnico de la Edificación, determine la demanda orientativa de ACS para un hotel de 5 estrellas de nueva construcción, con una ocupación de 100 personas y considerando una temperatura de referencia de 60 ºC.", "c": "", "o": {"A": "4.100 litros/día", "B": "5.500 litros/día", "C": "5.900 litros/día", "D": "6.900 litros/día"}, "k": "D", "e": "CTE DB HE 4, tabla de demanda de referencia a 60 ºC: hotel ***** = 69 l/día·persona × 100 = ademia · U8: CONDUCTOS Y VENTILADORES", "Academia · U9: ELECTRICIDAD Y CONTROL", "Academia · 10. CTE", "Academia · 11. DISPOSICIONES GENERALES", "Academia · 12. IT 1.1 EXIGENCIA BIENESTAR E HIGIENE", "Academia · 13. IT 1.2. EXIGENCIA EFICIENCIA ENERGÉTICA", "Academia · 14. IT 1.3. EXIGENCIA SEGURIDAD", "Academia · 15.1. RITE IT 2", "Academia · Adicional Aleatorio", "Academia · 15.2. RITE IT 3", "Academia · 15.3. RITE IT 4", "Academia · 16. RSIF", "Academia · 17. GASES FLUORADOS", "Academia · 18. CARGA MÁXIMA REFRIGERANTE"], EJ=[{"t": "Conversiones de unidades", "e": "Pasa: 12.500 kcal/h a kW; 7.200 kcal/h a kW; 5 kW a kcal/h; 12 MPa a bar; 5 bar a mca; 12 kPa a mca; 25 ºC a K; −30 ºF a ºC; 100 K a ºC; 2 m³/h a l/s; 12 m³/h a m³/s; 210 l/min a m³/h.", "f": "1 kW = 860 kcal/h · 1 bar = 10 mca = 100.000 Pa · 1 MPa = 10 bar · K = ºC + 273,15 · ºC = (ºF − 32)·5/9 · 1 l/s = 3,6 m³/h", "s": ["12.500 / 860 = 14,53 kW", "7.200 / 860 = 8,37 kW", "5 × 860 = 4.300 kcal/h", "12 MPa × 10 = 120 bar", "5 bar × 10 = 50 mca", "12 kPa = 0,12 bar = 1,2 mca", "25 + 273,15 = 298,15 K", "(−30 − 32) × 5/9 = −34,4 ºC", "100 − 273,15 = −173,15 ºC", "2.000 l / 3.600 s = 0,56 l/s", "12 / 3.600 = 0,0033 m³/s", "210 × 60 / 1.000 = 12,6 m³/h"], "r": "Ver pasos", "v": "Variante: 10.800 kcal/h → 12,56 kW · 7 kW → 6.020 kcal/h · 15 MPa → 150 bar · 3 bar → 30 mca · 9 kPa → 0,9 mca · 18 ºC → 291,15 K · −10 ºF → −23,3 ºC · 3 m³/h → 0,83 l/s · 150 l/min → 9 m³/h"}, {"t": "Volumen de una tubería (cilindro)", "e": "¿Cuántos litros de agua contiene una tubería de 5 m de longitud y 12 cm de diámetro interior?", "f": "V = π · D² / 4 · L  (D y L en metros → m³; × 1.000 = litros)", "s": ["D = 0,12 m → D² = 0,0144", "π × 0,0144 / 4 = 0,01131 m²", "0,01131 × 5 m = 0,0565 m³", "0,0565 × 1.000 = 56,5 l"], "r": "≈ 56 litros", "v": "Variante: 7 m y 10 cm → 0,055 m³ = 55 l"}, {"t": "Calor sensible (energía para calentar agua)", "e": "Calentar 750 litros de agua de 12 ºC a 60 ºC. ¿Cuánta energía hace falta?", "f": "Q = m · ce · ΔT   (agua: 1 l = 1 kg, ce = 1 kcal/kg·ºC)", "s": ["m = 750 kg", "ΔT = 60 − 12 = 48 ºC", "Q = 750 × 1 × 48 = 36.000 kcal", "En kWh: 36.000 / 860 = 41,9 kWh"], "r": "36.000 kcal", "v": "Variante: 620 l de 14 a 55 ºC → 25.420 kcal"}, {"t": "Calor sensible al revés (qué agua puedo calentar)", "e": "Un sistema aporta 6.200 kcal. ¿Cuántos litros se pueden calentar de 15 ºC a 50 ºC?", "f": "m = Q / (ce · ΔT)", "s": ["ΔT = 50 − 15 = 35 ºC", "m = 6.200 / (1 × 35) = 177,1 kg = 177,1 l"], "r": "177,1 litros", "v": "Variante: 5.400 kcal de 18 a 48 ºC → 180 l"}, {"t": "Pérdidas de calor por un muro", "e": "Muro de 7 m², U = 0,62 kcal/h·m²·ºC, interior 24 ºC, exterior 2 ºC. ¿Cuánto calor se pierde?", "f": "Q = U · A · ΔT", "s": ["ΔT = 24 − 2 = 22 ºC", "Q = 0,62 × 7 × 22 = 95,48 kcal/h", "En kW: 95,48 / 860 = 0,111 kW"], "r": "95,48 kcal/h", "v": "Variante: cubierta 6 m², U 0,58, 23/5 ºC → 62,64 kcal/h = 0,073 kW"}, {"t": "Pérdidas por aire de ventilación", "e": "Entran 75 m³/h de aire exterior a 4 ºC; interior a 20 ºC. ρ aire = 1,2 kg/m³, ce = 0,24 kcal/kg·ºC. ¿Calor perdido?", "f": "Q = V · ρ · ce · ΔT", "s": ["ΔT = 20 − 4 = 16 ºC", "Q = 75 × 1,2 × 0,24 × 16 = 345,6 kcal/h", "En kW: 345,6 / 860 = 0,40 kW"], "r": "345,6 kcal/h", "v": "Variante: 40 m³/h, 6 ºC / 21 ºC → 172,8 kcal/h = 0,201 kW"}, {"t": "Rendimiento de una caldera", "e": "Potencia nominal 250.000 kcal/h; entrega 212.632 kcal/h. ¿Rendimiento?", "f": "η = (P entregada / P nominal) × 100", "s": ["212.632 / 250.000 = 0,85", "0,85 × 100 = 85 %"], "r": "85 %", "v": "Variante: 180.000 nominal, 152.400 útil → 84,66 %"}, {"t": "Salto térmico con potencia y caudal", "e": "Intercambiador de 2.800 kcal/h con caudal de agua de 320 l/h. ¿Salto térmico?", "f": "ΔT = Q / (m · ce)", "s": ["m = 320 kg/h", "ΔT = 2.800 / (320 × 1) = 8,75 ºC"], "r": "8,75 ºC", "v": "Variante: 3.200 kcal/h y 280 l/h → 11,43 ºC"}, {"t": "Potencia útil de un calentador", "e": "Calentador de duchas: 17 l/min de 10 ºC a 40 ºC. ¿Potencia útil?", "f": "Q = m · ce · ΔT  (pasa el caudal a kg/h) · kW = kcal/h / 860", "s": ["17 l/min × 60 = 1.020 l/h = 1.020 kg/h", "ΔT = 40 − 10 = 30 ºC", "Q = 1.020 × 1 × 30 = 30.600 kcal/h", "30.600 / 860 = 35,6 kW"], "r": "30.600 kcal/h = 35,6 kW", "v": "Variante: 14 l/min de 12 a 42 ºC → 25.200 kcal/h = 29,3 kW"}, {"t": "Consumo de gas con el contador", "e": "Lectura inicial 2,267 m³; a los 52 s, 2,322 m³. ¿Consumo en m³/h?", "f": "Consumo = (lectura final − inicial) × 3.600 / segundos", "s": ["2,322 − 2,267 = 0,055 m³ en 52 s", "0,055 × 3.600 / 52 = 3,81 m³/h"], "r": "≈ 3,8 m³/h", "v": "Variante: 1,885 → 1,932 m³ en 54 s → 3,13 m³/h"}, {"t": "Volumen del vaso de expansión", "e": "Caldera 15 l + radiadores 23 l + tuberías 16 l. Coef. dilatación (70 ºC) 0,014; coef. presión 1,42. ¿Volumen del vaso?", "f": "Vu = Vi · Ce · Cp", "s": ["Vi = 15 + 23 + 16 = 54 l", "Vu = 54 × 0,014 × 1,42 = 1,07 l"], "r": "1,07 litros", "v": "Variante: 12+18+20 = 50 l, 0,015, 1,40 → 1,05 l"}, {"t": "Horas de funcionamiento", "e": "Caldera 12 h/día, 162 días/año, 4 años. ¿Horas totales?", "f": "Horas = h/día × días/año × años", "s": ["12 × 162 = 1.944 h/año", "1.944 × 4 = 7.776 h"], "r": "7.776 h", "v": "Variante: 10 h × 140 días × 5 años → 7.000 h"}, {"t": "Diagrama psicrométrico: temperatura de rocío", "e": "Aire a 22 ºC y 60 % de humedad relativa. ¿A qué temperatura condensa el agua sobre una tubería fría?", "f": "En el diagrama: desde 22 ºC sube hasta la curva del 60 %, ve en horizontal a la izquierda hasta la curva de saturación (100 %) y baja: esa es la temperatura de rocío.", "s": ["Punto: 22 ºC / 60 % HR", "Horizontal hasta saturación", "Lectura: ≈ 14 ºC. Si la tubería está por debajo de 14 ºC, condensa (hay que aislarla)"], "r": "≈ 14 ºC", "v": "Variante: 24 ºC y 50 % → 13,2 ºC"}, {"t": "Tiempo en enfriar un depósito", "e": "Enfriadora de 18.330 W; enfriar 315 l de 40 ºC a 15 ºC. ¿Tiempo?", "f": "Q = m · ce · ΔT (en kJ: ce agua = 4,18 kJ/kg·K) · t = Q / P", "s": ["ΔT = 25 K", "Q = 315 × 4,18 × 25 = 32.918 kJ", "t = 32.918 kJ / 18,33 kW = 1.796 s", "1.796 / 60 ≈ 30 min"], "r": "≈ 30 minutos (media hora)", "v": "Variante: 280 l de 38 a 12 ºC con 15,5 kW → 1.966 s ≈ 33 min"}, {"t": "EER y COP", "e": "Equipo reversible: consume 4 kW. En frío da 12 kW; en calor da 14 kW. Calcula EER y COP.", "f": "EER = potencia frigorífica / potencia eléctrica · COP = potencia calorífica / potencia eléctrica", "s": ["EER = 12 / 4 = 3,0", "COP = 14 / 4 = 3,5"], "r": "EER 3,0 · COP 3,5", "v": "Variante: 3,5 kW consumo, 10 kW frío, 12,5 kW calor → EER 2,86 · COP 3,57"}, {"t": "Diagrama de Mollier (p-h)", "e": "Con el ciclo dibujado sobre el diagrama p-h del refrigerante, calcula calor del condensador, del evaporador, trabajo del compresor, presión de alta, temperatura de líquido y de evaporación.", "f": "q evaporador = h1 − h4 · w compresor = h2 − h1 · q condensador = h2 − h3 (= evaporador + compresor). Las presiones se leen en el eje vertical y las temperaturas en las líneas de saturación.", "s": ["Lee las entalpías (h, kJ/kg) de los 4 puntos del ciclo en el eje horizontal", "Evaporador: h salida evaporador − h entrada", "Compresor: h salida compresor − h entrada", "Condensador: suma de los dos anteriores", "Alta presión: línea horizontal superior; temperatura de líquido: donde la línea de alta corta la curva de líquido saturado"], "r": "Ejemplo del curso (R-404A): condensador 185 kJ/kg, evaporador 155, compresor 30, alta 19 bar, líquido 20 ºC, evaporación −4 ºC", "v": "Variante (R290): 375 / 300 / 75 kJ/kg, 15 bar, 33 ºC, −8 ºC"}, {"t": "Coste mensual de calefacción", "e": "Vivienda de 125 m², 12 h/día, 31 días, consumo 32 W/m², 0,18 €/kWh. ¿Coste al mes?", "f": "Potencia = W/m² × m² · Energía = kW × horas × días · Coste = kWh × €/kWh", "s": ["125 × 32 = 4.000 W = 4 kW", "4 × 12 × 31 = 1.488 kWh", "1.488 × 0,18 = 267,84 €"], "r": "267,84 €", "v": "Variante: 110 m², 28 W/m², 10 h, 30 días, 0,21 € → 194,04 €"}, {"t": "Almacenamiento de pellets (biomasa)", "e": "Caldera de 14 kW, 8 h/día, PCI 5 kWh/kg. Almacenar para 15 días. ¿Cuántos kg?", "f": "kg = Pn × horas/día × días / PCI", "s": ["Energía al día: 14 × 8 = 112 kWh", "Pellets al día: 112 / 5 = 22,4 kg", "15 días: 22,4 × 15 = 336 kg"], "r": "336 kg", "v": "Variante: 12 kW, 7 h, 4,8 kWh/kg, 20 días → 350 kg. (RITE: en edificios nuevos el silo debe cubrir 15 días)"}, {"t": "Rendimiento de un captador solar (curva)", "e": "Captador plano con su curva de rendimiento. tm = 70 ºC, ta = 35 ºC, I = 750 W/m². ¿Rendimiento?", "f": "Eje X de la curva: (tm − ta) / I. Lee el rendimiento en el eje Y.", "s": ["(70 − 35) / 750 = 0,0467 m²·K/W", "Entra en la curva con 0,047 y lee η"], "r": "≈ 62 % (según la curva del ejercicio)", "v": "Variante: tm 65, ta 32, I 800 → 0,041 → 63 %"}, {"t": "Rendimiento de un captador solar (ecuación)", "e": "η = 0,770 − 3,181·T, con T = (tm − ta)/G. tm = 65 ºC, ta = 28 ºC, G = 800 W/m².", "f": "Sustituye T en la ecuación del fabricante", "s": ["T = (65 − 28) / 800 = 0,04625", "3,181 × 0,04625 = 0,147", "η = 0,770 − 0,147 = 0,623"], "r": "62,3 %", "v": "Variante: η = 0,782 − 3,12·T, tm 58, ta 25, G 900 → 66,8 %"}, {"t": "Porcentaje de glicol", "e": "Instalación solar en Granada, temperatura mínima histórica −13 ºC. ¿% de glicol para que no congele?", "f": "Se busca la temperatura mínima histórica de la ciudad (tabla) y se entra en la tabla de congelación del propilenglicol. Suele tomarse un margen de seguridad de unos 5 ºC.", "s": ["Tmín = −13 ºC", "Tabla de congelación: ≈ 42 % de glicol"], "r": "≈ 42 %", "v": "Variante: −15 ºC → 44 %"}, {"t": "COP de una aerotermia", "e": "Entrega 10 kW térmicos y consume 2.800 W. ¿COP?", "f": "COP = potencia térmica / potencia eléctrica (mismas unidades)", "s": ["2.800 W = 2,8 kW", "COP = 10 / 2,8 = 3,57"], "r": "3,57", "v": "Variante: 11,5 kW y 3.100 W → 3,71"}, {"t": "Diámetro de tubería (ábaco)", "e": "Caudal 2,16 m³/h y velocidad 0,8 m/s. ¿Diámetro?", "f": "En el ábaco: cruza la línea de caudal con la de velocidad y lee el diámetro. A mano: S = Q / v ; D = √(4·S/π)", "s": ["Q = 2,16 / 3.600 = 0,0006 m³/s", "S = 0,0006 / 0,8 = 0,00075 m²", "D = √(4 × 0,00075 / π) = 0,031 m = 31 mm → se elige 32 mm"], "r": "32 mm", "v": "Variante: 2,40 m³/h y 0,9 m/s → 32 mm"}, {"t": "Pérdida de carga de tubería (ábaco)", "e": "Diámetro 32 mm, velocidad 0,8 m/s. ¿Pérdida de carga?", "f": "En el ábaco: cruza diámetro con velocidad y lee la pérdida de carga por metro (mca/m o mmca/m).", "s": ["Entra con 32 mm y 0,8 m/s", "Lectura ≈ 0,044 mca/m (44 mmca/m)"], "r": "0,044 mca/m", "v": "Variante: 40 mm y 0,7 m/s → 0,029 mca/m"}, {"t": "Selección de bomba (tabla del fabricante)", "e": "Caudal 0,02 m³/min y altura 4 mca. ¿Modelo?", "f": "Pasa el caudal a m³/h (× 60) y busca en las curvas/tabla el modelo cuya curva queda por encima del punto.", "s": ["0,02 × 60 = 1,2 m³/h", "Punto: 1,2 m³/h y 4 mca", "En la tabla del curso: ALPHA2 XX-60"], "r": "ALPHA2 XX-60", "v": "Variante: 0,025 m³/min (1,5 m³/h) y 3,8 mca → ALPHA2 XX-60"}, {"t": "Rendimiento de una bomba", "e": "H = 12 mca, caudal 22 m³/h, potencia 1,5 kW. ¿Rendimiento?", "f": "η = (H · q / P) × 100, con H en Pa (1 mca = 9.810 Pa), q en m³/s y P en W", "s": ["H = 12 × 9.810 = 117.720 Pa", "q = 22 / 3.600 = 0,00611 m³/s", "H × q = 719 W (potencia hidráulica)", "719 / 1.500 = 0,48 → 48 %"], "r": "48 %", "v": "Variante: 10 mca, 18 m³/h, 1,2 kW → 41,7 %"}, {"t": "Sección de un conducto de aire", "e": "Caudal 2.700 m³/h, velocidad 6,5 m/s. ¿Sección?", "f": "S = Q / v  (Q en m³/s)", "s": ["2.700 / 3.600 = 0,75 m³/s", "S = 0,75 / 6,5 = 0,115 m²"], "r": "0,115 m²", "v": "Variante: 3.100 m³/h y 5,8 m/s → 0,148 m²"}, {"t": "Velocidad del aire en un conducto", "e": "Conducto de 30 × 20 cm, caudal 38 m³/min. ¿Velocidad?", "f": "v = Q / S", "s": ["S = 0,30 × 0,20 = 0,06 m²", "Q = 38 / 60 = 0,633 m³/s", "v = 0,633 / 0,06 = 10,56 m/s"], "r": "10,56 m/s", "v": "Variante: 25 × 15 cm y 30 m³/min → 13,33 m/s"}, {"t": "Caudal de un conducto", "e": "Conducto 50 × 20 cm, velocidad 180 m/min. ¿Caudal?", "f": "Q = S · v", "s": ["S = 0,5 × 0,2 = 0,10 m²", "v = 180 / 60 = 3 m/s", "Q = 0,10 × 3 = 0,30 m³/s = 1.080 m³/h"], "r": "0,30 m³/s = 1.080 m³/h", "v": "Variante: 45 × 18 cm y 160 m/min → 777,6 m³/h"}, {"t": "Selección de ventilador (gráfica)", "e": "1.200 m³/h y 300 Pa de pérdida de carga. ¿Qué ventilador?", "f": "Sitúa el punto caudal/presión en la gráfica del fabricante y elige el modelo cuya curva pasa por encima.", "s": ["Punto: 1.200 m³/h – 300 Pa", "En la gráfica del curso: TD-2000/315 SILENT 3V"], "r": "TD-2000/315 SILENT 3V", "v": "Variante: 900 m³/h y 240 Pa → TD-2000/315 SILENT 3V"}, {"t": "Ley de Ohm y potencia", "e": "Resistencia a 230 V con 8 A. ¿Resistencia y potencia?", "f": "R = V / I · P = V · I", "s": ["R = 230 / 8 = 28,75 Ω", "P = 230 × 8 = 1.840 W"], "r": "28,75 Ω · 1.840 W", "v": "Variante: 230 V y 6,5 A → 35,4 Ω · 1.495 W"}, {"t": "Potencia de un motor eléctrico", "e": "Motor monofásico 400 V, 9 A, cos φ = 0,9. ¿Potencia aparente y activa?", "f": "S = V · I (VA) · P = V · I · cos φ (W)", "s": ["S = 400 × 9 = 3.600 VA", "P = 3.600 × 0,9 = 3.240 W"], "r": "3.600 VA · 3.240 W", "v": "Variante: 400 V, 7 A, cos φ 0,88 → 2.800 VA · 2.464 W"}, {"t": "Velocidad del aire en la zona ocupada (RITE IT 1.1)", "e": "Temperatura seca interior 23 ºC, difusión por mezcla. ¿Velocidad media admisible?", "f": "Difusión por mezcla: v = t/100 − 0,07 · Difusión por desplazamiento: v = t/100 − 0,10 (t entre 20 y 27 ºC)", "s": ["v = 23/100 − 0,07 = 0,23 − 0,07", "v = 0,16 m/s"], "r": "0,16 m/s", "v": "Con desplazamiento sería 0,13 m/s"}, {"t": "Caudal mínimo de aire exterior (RITE IT 1.1)", "e": "Oficina con 16 personas, 38 m² de almacén y 22 m² de aseos. ¿Caudal mínimo de aire exterior?", "f": "Oficinas = IDA 2 → 12,5 l/s por persona. Locales sin ocupación permanente: método por superficie, IDA 2 → 0,83 l/s·m²", "s": ["Personas: 16 × 12,5 = 200 l/s", "Almacén: 38 × 0,83 = 31,5 l/s", "Aseos: 22 × 0,83 = 18,3 l/s", "Total = 249,8 l/s (≈ 900 m³/h)"], "r": "249,8 l/s", "v": "Recuerda: IDA 1 = 20 · IDA 2 = 12,5 · IDA 3 = 8 · IDA 4 = 5 l/s·persona"}, {"t": "Aberturas de limpieza en conductos (UNE-ENV 12097)", "e": "Conducto circular rígido de 450 mm de diámetro. ¿Medida mínima de la abertura rectangular de servicio?", "f": "Tabla de la norma UNE-ENV 12097 (a la que remite la IT 1.1.4.3.4): la abertura depende del diámetro.", "s": ["Para D = 450 mm la tabla da 300 × 200 mm"], "r": "300 × 200 mm", "v": "Diámetros pequeños (hasta 200 mm) llevan aberturas menores; a partir de 500 mm, 400 × 300 mm"}, {"t": "Eficiencia del recuperador de calor (RITE IT 1.2)", "e": "Caudal de extracción 1,8 m³/s, 3.600 horas al año. ¿Eficiencia mínima y pérdida de presión máxima?", "f": "Tabla 2.4.5.1: filas = horas anuales; columnas = caudal (m³/s). Obligatorio recuperar si el caudal de expulsión > 0,5 m³/s.", "s": ["Caudal 1,8 → columna > 1,5…3,0", "Horas 3.600 → fila > 2.000…4.000", "Lectura: 47 % y 160 Pa"], "r": "47 % · 160 Pa", "v": "Ejemplo oficial: piscina con 2 m³/s y >6.000 h → 55 %"}, {"t": "Aislamiento de tuberías de frío (RITE IT 1.2)", "e": "Fluido frío a −5 ºC, por el interior, diámetro exterior 70 mm, λ = 0,04 W/(m·K). ¿Espesor mínimo?", "f": "Tabla 1.2.4.2.3 (fluidos fríos, interior): fila por diámetro, columna por temperatura.", "s": ["−5 ºC → columna > −10…0 ºC", "70 mm → fila 60 < D ≤ 90", "Lectura: 40 mm"], "r": "40 mm", "v": "Si fuera por el exterior (tabla 1.2.4.2.4) serían 60 mm"}, {"t": "Aislamiento con conductividad distinta de 0,04", "e": "Fluido caliente a 50 ºC, por el exterior, D = 100 mm, λ = 0,03 W/(m·K). ¿Espesor mínimo?", "f": "1) Espesor de referencia de la tabla (λ = 0,04). 2) d = D/2 · [ e^( (λ/λref) · ln((D + 2·dref)/D) ) − 1 ]", "s": ["Tabla 1.2.4.2.2 (caliente, exterior): 90<D≤140 y 40…60 ºC → dref = 40 mm", "λ/λref = 0,03/0,04 = 0,75", "ln((100 + 80)/100) = ln 1,8 = 0,588", "e^(0,75 × 0,588) = e^0,441 = 1,554", "d = 50 × (1,554 − 1) = 27,7 mm → 30 mm"], "r": "30 mm", "v": "Un aislante mejor (λ menor) permite menos espesor"}, {"t": "Aislamiento de conductos (RITE IT 1.2)", "e": "Conductos por el interior, λ = 0,04, instalación de 60 kW. ¿Espesor mínimo?", "f": "Procedimiento simplificado (P ≤ 70 kW): interior 30 mm, exterior 50 mm. Pérdida máxima permitida: 4 % de la potencia.", "s": ["60 kW ≤ 70 kW → vale el simplificado", "Interior → 30 mm"], "r": "30 mm", "v": "Por el exterior serían 50 mm"}, {"t": "Potencia específica del ventilador, SFP (RITE IT 1.2)", "e": "Ventilador de impulsión: 3,2 kW absorbidos, caudal 2 m³/s. ¿Categoría SFP?", "f": "Wesp = W / (m³/s). Tabla 2.4.2.7: SFP 1 ≤500 · SFP 2 ≤750 · SFP 3 ≤1.250 · SFP 4 ≤2.000 · SFP 5 ≤3.000 W/(m³/s)", "s": ["3.200 / 2 = 1.600 W/(m³/s)", "1.250 < 1.600 ≤ 2.000 → SFP 4"], "r": "SFP 4", "v": "Máximo exigido: impulsión en climatización SFP 4, ventilación simple SFP 3; extracción SFP 3 / SFP 2"}, {"t": "Ventilación de sala de máquinas: abertura superior (gas)", "e": "Sala de máquinas de 28 m² con calderas de gas. ¿Superficie del orificio superior?", "f": "Orificio superior (gas) = 10 · A cm² (A = superficie de la sala en m²). Orificio inferior = 5 cm²/kW", "s": ["10 × 28 = 280 cm²"], "r": "280 cm²", "v": "Si la sala no es contigua al exterior: conductos verticales 7,5 cm²/kW; horizontales 10 cm²/kW"}, {"t": "Ventilación forzada de sala de máquinas", "e": "Sala de 20 m² con caldera de 180 kW. Caudal de aire por medios mecánicos (UNE 60601).", "f": "UNE 60601: Q = 2 · PN + 10 · A (m³/h). RITE IT 1.3.4.1.2.7 usa 1,8 · PN + 10 · A", "s": ["UNE 60601: 2 × 180 + 10 × 20 = 360 + 200 = 560 m³/h", "Con la fórmula del RITE: 1,8 × 180 + 200 = 524 m³/h"], "r": "560 m³/h (UNE 60601) · 524 m³/h (RITE)", "v": "Ejemplo oficial Aragón 2026: 200 kW y 50 m² → 1,8·200 + 10·50 = 860 m³/h"}, {"t": "Presión de una botella de refrigerante", "e": "Botella de R134a a 21 ºC marca 5,896 bar. Se calienta a 38 ºC. ¿Presión?", "f": "Con líquido y vapor en equilibrio, la presión solo depende de la temperatura: se lee en la tabla presión–temp
