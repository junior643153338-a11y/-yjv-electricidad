 potencia térmica.", "C": "En un hotel, la sustitución de la caldera a gas natural, de 750 Kw de potencia térmica nominal, por otra de similares características.", "D": "Ninguna respuesta es correcta."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 15, "q": "En el vigente Reglamento de Instalaciones Térmicas en los Edificios (RITE/2007). ¿Cuál de las siguientes practicas está completamente prohibida?:", "c": "", "o": {"A": "El uso de agua de calidad sanitaria, para enfriamiento adiabático.", "B": "La humectación del aire mediante inyección directa de vapor de calidad sanitaria procedente de calderas.", "C": "La preparación de agua caliente para usos sanitarios, mediante mezcla directa de agua fría con condensado o vapor.", "D": "Todas las anteriores"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 16, "q": "Según el vigente Reglamento de Instalaciones Térmicas en los Edificios (RITE/2007), para una temperatura seca del aire de 300 K. ¿La velocidad media del aire con difusión por desplazamiento, intensidad de la turbulencia 15% y PPD para corrientes de aire del 8%, será?:", "c": "", "o": {"A": "0´17 m/s.", "B": "0´15 m/s.", "C": "0´13 m/s.", "D": "0´10 m/s."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 17, "q": "En una instalación de energía solar térmica, las tuberías del circuito secundario se someterán a una prueba de resistencia mecánica, equivalente a:", "c": "", "o": {"A": "1´5 veces, la presión máxima de trabajo, con un mínimo de 30´6 m.c.a.", "B": "1´5 veces, la presión máxima de trabajo, con un mínimo de 61´2 m.c.a.", "C": "2 veces, la presión máxima de trabajo, con un mínimo de 30´6 m.c.a.", "D": "2 veces, la presión máxima de trabajo, con un mínimo de 61´2 m.c.a."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 18, "q": "La empresa mantenedora medirá y registrará el contenido de partículas sólidas en combustible de una caldera individual de pellet de potencia térmica nominal de 60500 Kcal/h:", "c": "", "o": {"A": "Con una periodicidad mensual, la primera al inicio de la temporada.", "B": "Con una periodicidad bimestral, la primera al inicio de la temporada.", "C": "Con una periodicidad cuatrimestral, la primera al inicio de la temporada.", "D": "Con una periodicidad trimestral, la primera al inicio de temporada. 2ª Convocatoria 2018"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 19, "q": "Los datos del consumo de energía y de agua, obtenidos periódicamente de una instalación de calefacción de un hotel, formada por caldera de bioconbustible solido de 2508000 Kcal/h de potencia térmica, redes de distribución de agua y fan-coil, se conservarán durante:", "c": "", "o": {"A": "Cinco años.", "B": "Tres años.", "C": "Un año.", "D": "Como mínimo, hasta el comienzo de la siguiente temporada."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 20, "q": "Se considera que un centro comercial de 1000 m² de superficie útil, cumple con el valor límite de temperatura, durante la campaña de verano, cuando la temperatura media del recinto, sea:", "c": "", "o": {"A": "Superior a 21º C, medidos a 1´7 m del suelo con equipo de ±0´5º C .de exactitud y humedad relativa del 65%", "B": "Inferior a 25º C, medidos a 1´7 m del suelo con equipo de ±0´5º C .de exactitud y humedad relativa del 65%", "C": "21º C, medidos a 1´7 m del suelo con equipo de ±0´2º C .de exactitud y humedad relativa del 70%.", "D": "25º C, medidos a 1´7 m del suelo con equipo de ±0´2º C .de exactitud y humedad relativa del 70%."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 21, "q": "Una Instalación de calefacción, formada principalmente por caldera a gas de 150 Kw de potencia térmica nominal, redes de tuberías de diferentes diámetros y radiadores de aluminio. ¿El sistema de distribución incluyendo su aislamiento, se inspeccionarán periódicamente, cada?:", "c": "", "o": {"A": "5 años.", "B": "4 años.", "C": "2 años.", "D": "Anualmente, al inicio de la temporada."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 22, "q": "En la sala de Rayos X de un hospital. ¿El caudal mínimo de aire exterior de ventilación será?:", "c": "", "o": {"A": "30 m3 /(h.m2).", "B": "15 m3 /(h.m2).", "C": "10 m3 /(h.m2).", "D": "5 m3 /(h.m2)."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 23, "q": "Indique cuál de los siguientes valores, serían los correctos para cumplir con las exigencias del vigente Reglamento de Instalaciones en Edificios (RITE/2007), en un local privado que alberga una piscina climatizada, cuya temperatura del agua es de 30º C:", "c": "", "o": {"A": "31º C de temperatura seca del aire y humedad relativa del 65%.", "B": "31º C de temperatura seca del aire y humedad relativa del 60%.", "C": "30º C de temperatura seca del aire y humedad relativa del 60%.", "D": "Es indiferente en piscinas privadas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 24, "q": "Los conductos de aire deben cumplir en cuanto a materiales y fabricación:", "c": "", "o": {"A": "y B), son correctas.", "B": "La norma UNE-EN 13403.", "C": "Las que establezca el fabricante en su proceso de fabricación según módulo G.", "D": ""}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 25, "q": "En la instalación térmica de un Instituto de Enseñanza Secundaria, se está sustituyendo la caldera a gasóleo de 215000 Kcal/h de potencia térmica nominal, por otra que utiliza gas natural como combustible. ¿El control de la recepción en obra del aludido generador de calor, lo llevara a cabo?:", "c": "", "o": {"A": "El Instalador habilitado y el Director de la Instalación.", "B": "El Titular de la Instalación, con el visto bueno de la Empresa Instaladora habilitada.", "C": "El Titular de la Instalación y el Instalador habilitado.", "D": "El Instalador habilitado o el Director de la Instalación. 2ª Convocatoria 2018"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 26, "q": "Las unidades exteriores de los equipos autónomos de refrigeración, se situarán en fachada, debiendo quedar integrados en la misma, y ocultas a la vista exterior:", "c": "", "o": {"A": "En todos los edificios existentes que se reformen.", "B": "En todos los edificios de nueva construcción.", "C": "En los edificios de nueva construcción que dispongan de preinstalación.", "D": "En los edificios existentes que se reformen y no dispongan de azotea o terraza."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 27, "q": "En un complejo hospitalario se ha instalado un equipo autónomo de generación de calor a gas natural ubicado en el exterior, a la intemperie, en zona transitada para el uso habitual del edificio sanitario. En tal caso, se dejará alrededor del generador de calor una franja libre para mantenimiento de:", "c": "", "o": {"A": "Un metro (1 m), como mínimo.", "B": "Un metro (1 m), si no existe a ras de suelo, sumideros u otras aperturas dentro de la zona de influencia del equipo.", "C": "Un metro (1 m), como máximo.", "D": "Un metro (1 m), como mínimo, restringiendo el acceso a personal no autorizado."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 28, "q": "¿Qué clase de filtración se usaría para el aire interior de un museo, si el aire exterior presenta una concentración alta de partículas?:", "c": "", "o": {"A": "F6 + F8.", "B": "F7 + F9.", "C": "F5 + F7.", "D": "F8."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 29, "q": "Un circuito hidráulico se dimensionará con una velocidad de paso, a filtro limpio, menor o igual que la velocidad del fluido en las tuberías contiguas, y se protegerá mediante un filtro con una luz como máximo de:", "c": "", "o": {"A": "0´25 mm.", "B": "1 mm.", "C": "1´25 mm.", "D": "2 mm."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2018 (2ª conv.)", "n": 30, "q": "En un sistema de climatización en el que se aportan 2700 litros/s de aire exterior y en el que se han establecido 5500 horas anuales de funcionamiento. ¿Cuál es la eficiencia mínima en calor sensible sobre el aire exterior?:", "c": "", "o": {"A": "64 %.", "B": "55 %.", "C": "50 %.", "D": "47 % 2ª Convocatoria 2018 RESPUESTAS"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 1, "q": "Se entiende por reforma de una instalación térmica:", "c": "", "o": {"A": "Todo cambio que se efectúe en ella y que suponga una modificación del proyecto o memoria técnica con el que fue ejecutada y registrada.", "B": "La sustitución o reposición de un generador de calor o frío por otro de similares características, al requerir modificación del proyecto o memoria técnica.", "C": "La sustitución o reposición de un generador de calor o frío de similares características, aunque ello no suponga una modificación del proyecto o memoria técnica.", "D": "Las respuestas A y C son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 2, "q": "En una fábrica, el Real Decreto 1027/2007 con sus modificaciones es de aplicación a:", "c": "", "o": {"A": "La instalación térmica fija de la oficina de administración, cuyo fin es el bienestar térmico del perso- nal.", "B": "La instalación térmica encargada del proceso industrial de esterilización del material.", "C": "El aire acondicionado portátil instalado en la oficina del director.", "D": "Las respuestas A y C son correctas."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 3, "q": "La memoria técnica de diseño elaborada por instalador habilitado o técnico titulado competente, se redactará en Andalucía:", "c": "", "o": {"A": "Sobre el modelo establecido por la Junta de Andalucía y publicado en el BOJA.", "B": "No hay modelo establecido por la Junta de Andalucía, pero la memoria ha de disponer del siguiente contenido mínimo:  Justificación de que la solución propuesta cumple las exigencias de bienestar térmico e higiene, eficiencia energética y seguridad del RITE.  Breve memoria descriptiva de la instalación, en la que figuren el tipo, el número y las caracterís- ticas de los equipos generadores, sistemas de energías renovables y otros elementos principales.  Cálculo de la potencia térmica instalada de acuerdo con un procedimiento reconocido; explicitán- dose los parámetros de diseño elegidos.  Los planos o esquemas de las instalaciones.", "C": "No hay modelo establecido, solo debe disponer de una breve memoria descriptiva de la instalación, en la que figuren el tipo, el número y las características de los equipos generadores, sistemas de energías renovables y otros elementos principales.", "D": "Ninguna de las anteriores es correcta."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 4, "q": "Para la generación de calefacción y agua caliente sanitaria se instala en un edificio una instalación solar térmica con una superficie de apertura de campo de los captadores de 30 m2 y una caldera de gas con 60 kW de potencia térmica nominal. ¿Qué documentación técnica de diseño y dimensionado debe hacerse como base para la ejecución de la insta- lación?", "c": "", "o": {"A": "Proyecto, por ser la potencia térmica nominal a instalar en generación de calor, mayor que 70 kW.", "B": "El proyecto podrá ser sustituido por una memoria técnica, por ser la potencia térmica nominal a insta- lar en generación de calor, menor o igual que 70 kW.", "C": "Ninguna documentación técnica de diseño, por ser la potencia térmica nominal a instalar en ge- neración de calor, menor o igual que 70 kW.", "D": "Ninguna de las respuestas es correcta 26/09/2020"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 5, "q": "La evaluación periódica del rendimiento de un generador de calor de 80 kW de potencia térmica nominal instalada, se realizará:", "c": "", "o": {"A": "Cada 2 años.", "B": "Cada 3 meses, la primera al inicio de la temporada.", "C": "Cada 2 meses, la primera al inicio de la temporada.", "D": "Una vez al mes."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 6, "q": "En caso de sustitución de un equipo de generación de frío de potencia útil nominal 50 kW por otro equipo de 65 kW, ¿es necesario el registro del certificado de la instalación en el órgano competente de la comunidad autónoma donde radique la instalación, para la pues- ta en servicio?:", "c": "", "o": {"A": "No por tratarse de un generador de potencia útil nominal menor a 70 kW.", "B": "No, tan solo deberá conservar el titular o usuario de la instalación, la factura de adquisición del ge- nerador y de su instalación.", "C": "Sí, por suponer una variación de la potencia útil nominal del generador superior al 25%.", "D": "Las respuestas A y B son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 7, "q": "El Manual de uso y mantenimiento de la instalación debe contener:", "c": "", "o": {"A": "Las instrucciones de seguridad y de manejo y maniobra de la instalación.", "B": "Los programas de funcionamiento y de mantenimiento preventivo.", "C": "El programa de gestión energética.", "D": "Todas las respuestas son correctas."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 8, "q": "El defecto que no supone un peligro inmediato para la seguridad de las personas, bienes o medio ambiente, pero puede reducir de modo sustancial la capacidad de utilización de la instalación térmica o su eficiencia energética, tendría la clasificación de:", "c": "", "o": {"A": "Aceptable", "B": "Leve.", "C": "Grave.", "D": "Muy grave."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 9, "q": "¿Qué norma establece un procedimiento válido para el cálculo de la temperatura operativa y la humedad relativa, para valores de actividad metabólica 3 met, grado de vestimenta 0,5 clo en verano y un PPD del 15%?", "c": "", "o": {"A": "No hay norma, para estos valores la temperatura operativa en verano estará comprendida entre 23 y 25ºC.", "B": "La norma UNE-EN 13779.", "C": "La norma UNE-EN ISO 7730.", "D": "Ninguna de las respuestas es correcta. 26/09/2020"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 10, "q": "En una oficina con una superficie de 50 m2, en la que trabajan 5 personas con una activi- dad metabólica sedentaria, y en la que es baja la producción de sustancias contaminantes por fuentes diferentes del ser humano y no está permitido fumar, el caudal mínimo de aire exterior será:", "c": "", "o": {"A": "27,5 l/s.", "B": "40 l/s", "C": "41,5 l/s", "D": "62,5 l/s."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 11, "q": "¿Qué clase de filtración mínima habrá de emplearse para un aire exterior con concen- traciones altas de partículas, que va a introducirse en un bar?", "c": "", "o": {"A": "F5 + F7.", "B": "F5 + F6", "C": "F6 + F8", "D": "F7."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 12, "q": "Los prefiltros del aire exterior de ventilación:", "c": "", "o": {"A": "Solo se emplearán en caso de aire con concentraciones muy altas de partículas.", "B": "Se instalarán solo en la entrada del aire exterior a la unidad de tratamiento.", "C": "Se instalarán en la entrada del aire exterior a la unidad de tratamiento y en la entrada del aire de re- torno.", "D": "Las opciones A y B son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 13, "q": "¿Está permitido que el aire de extracción de una sauna sea empleado como aire de transferencia hacia un garaje?", "c": "", "o": {"A": "Si", "B": "No", "C": "Si, en caso de que se mezcle con otro aire de extracción que tenga bajo nivel de contaminación.", "D": "Si, en caso de que se mezcle con otro aire de extracción que tenga moderado nivel de contaminación."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 14, "q": "En la determinación de las condiciones de bienestar en un edificio se tendrán en consi- deración y se valorarán:", "c": "", "o": {"A": "Las molestias por corrientes de aire.", "B": "La diferencia vertical de la temperatura del aire. Estratificación.", "C": "La asimetría de temperatura radiante.", "D": "Todas las anteriores son correctas. 26/09/2020"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 15, "q": "La red de conductos de planchas de material aislante, que cumplen la norma UNE-EN 13043 para conductos no metálicos, ¿ha de estar equipada de aperturas de servicio para la limpieza y desinfección de los mismos, acordes a lo establecido en la norma UNE-EN 12097?:", "c": "", "o": {"A": "Si, debiendo resistir las planchas operaciones de limpieza equivalentes a un ciclo de 20 años de uso (una operación de limpieza por año), sin ningún daño.", "B": "Si, debiendo resistir las planchas operaciones de limpieza equivalentes a un ciclo de 10 años de uso (una operación de limpieza por año), sin ningún daño.", "C": "No es necesario que dispongan de las aperturas de servicio según dispone la UNE-EN 12097, es posi- ble cortar aperturas en los conductos cuando proceda la limpieza y luego cerrarlas con cinta de alu- minio.", "D": "No es necesario que dispongan de las aperturas de servicio, siempre que el material de las placas no facilite la proliferación microbiana."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 16, "q": "La memoria técnica de diseño ha de incluir una estimación del consumo…(elija una op- ción), expresado en energía primaria y emisiones de dióxido de carbono, realizada dicha estimación con un método que la buena práctica haya contrastado, indicándose el mismo.", "c": "", "o": {"A": "Una estimación del consumo de energía mensual.", "B": "Una estimación del consumo de energía anual.", "C": "Una estimación del consumo de energía mensual y anual.", "D": "No es necesario ninguna estimación del consumo en la memoria técnica, tan solo se requiere inc- luirla en proyectos emitidos por técnicos competentes."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 17, "q": "Los generadores que empleen energías convencionales:", "c": "", "o": {"A": "Se conectarán hidráulicamente en paralelo y deben poder independizarse entre sí, salvo casos excep- cionales.", "B": "Se conectarán hidráulicamente en serie y deben poder independizarse entre sí, salvo casos excepcio- nales.", "C": "Se conectarán hidráulicamente indistintamente en paralelo o en serie, siempre que puedan inde- pendizarse entre sí.", "D": "No podrán conectarse hidráulicamente."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 18, "q": "¿Está permitida la instalación de un calentador a gas de 25 kW de tipo B (el aire necesario para realizar la combustión del gas se toma de la atmósfera del local donde se encuentra instalado y la evacuación de los productos de la combustión al exterior es conducida)?", "c": "", "o": {"A": "No, salvo que el local cumpla los requisitos de ventilación establecidos para las salas de máquinas.", "B": "No, salvo que el aparato sea del tipo B3x.", "C": "Las opciones A y B son correctas.", "D": "No está permitido en ningún caso. 26/09/2020"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 19, "q": "Conforme el procedimiento simplificado, ¿cuál será el aislamiento mínimo para una tubería de 50 mm de diámetro, que transporta agua caliente sanitaria (funcionamiento continuo) a 65 ºC y discurre por el interior del edificio, si se emplea un material de conductividad térmica 0,040 W(m.K) a 10ºC?", "c": "", "o": {"A": "30 mm", "B": "35 mm", "C": "40 mm", "D": "45 mm"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 20, "q": "Las bombas de calor deben cumplir el siguiente requisito:", "c": "", "o": {"A": "Los fabricantes aportarán las tablas de funcionamiento de los equipos a distintas temperaturas, para facilitar la evaluación y rendimiento energético de la instalación.", "B": "La temperatura del agua a la salida de las plantas deberá ser mantenida constante al variar la carga, salvo excepciones que se justificarán.", "C": "Se procurará que la potencia máxima en los equipos se obtenga con el salto máximo de temperaturas de entrada y salida establecido por el fabricante.", "D": "Todas las anteriores son correctas."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 21, "q": "Las redes de conductos tendrán una estanqueidad correspondiente a la clase:", "c": "", "o": {"A": "B", "B": "C", "C": "D", "D": "Todas la opciones son correctas, según la aplicación."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 22, "q": "Un ventilador que absorbe una potencia de 2.582 W para transportar un caudal de fluido de 13.720 m³/h, pertenecería por su potencia específica a la categoría:", "c": "", "o": {"A": "SPF1", "B": "SPF2", "C": "SPF3", "D": "SPF4"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 23, "q": "El rearme de los dispositivos de seguridad:", "c": "", "o": {"A": "Se permite automático, solo cuando se indique expresamente en las instrucciones técnicas.", "B": "Se permite manual, solo cuando se indique expresamente en las instrucciones técnicas.", "C": "Será automático siempre, sin excepciones.", "D": "Será manual siempre, sin excepciones. 26/09/2020"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 24, "q": "Indique la opción correcta:", "c": "", "o": {"A": "Las instalaciones solares de más de 10 m2 de superficie de apertura han de tener un sistema de medida de la energía final suministrada.", "B": "Las instalaciones de energía solar térmica en las que se entregue a los distintos usuarios la energía solar a través del secundario, pueden prescindir de la contabilización individualizada, siempre que exista un sistema de control de la energía aportada por la instalación solar térmica de forma centra- lizada.", "C": "El diseño del sistema de contabilización de energía solar debe permitir al usuario de la instalación, controlar periódicamente la producción de la instalación.", "D": "Todas las anteriores son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 25, "q": "¿Qué es un sistema todo-aire?:", "c": "", "o": {"A": "Técnica de acondicionamiento en la que el control de las condiciones térmicas interiores está a cargo del sistema de ventilación.", "B": "Técnica de acondicionamiento en la que el control de las condiciones térmicas interiores está a cargo de un subsistema (aparatos autónomos, ventiloconvectores, radiadores, etc.) en combinación con el subsistema de ventilación.", "C": "Máquina o instalación que transfiere calor del entorno natural, como el aire, el agua o la tierra, al edificio, invirtiendo el flujo de calor, de modo que fluya de una temperatura más baja a otra más alta.", "D": "Ninguna de las anteriores es correcta."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 26, "q": "Si el sistema de climatización de una piscina climatizada, expulsa un caudal de aire al ex- terior de 6.120 m3/h, la energía térmica contenida en el aire expulsado debe ser recu- perada con una eficiencia mínima en calor sensible sobre el aire exterior (%) de:", "c": "", "o": {"A": "47 %", "B": "50 %", "C": "55 %", "D": "Ha de indicarse el número de horas anuales de funcionamiento para poder determinarla."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 27, "q": "En un hotel, la sala de máquinas de nueva construcción, con generadores de calor a gas, ha de disponer de:", "c": "", "o": {"A": "Detectores de fugas de gas, conformes con las normas UNE-EN 61779-1 y UNE EN-61779-4.", "B": "Detectores de fugas de gas, conformes con las normas UNE-EN 50194 y UNE EN-50244.", "C": "El cuadro eléctrico de protección y mando de los equipos instalados en la sala, o por lo menos, el interruptor general y el interruptor del sistema de ventilación, deben situarse dentro de la sala y en la proximidad de uno de los accesos.", "D": "Las opciones B y C son correctas. 26/09/2020"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 28, "q": "La evacuación de los productos de la combustión en las instalaciones térmicas se realizará como norma general por conducto por la cubierta del edificio, con la siguiente excepción:", "c": "", "o": {"A": "Instalaciones térmicas existentes que se reformen cambiándose sus generadores y que no dispongan de conducto de evacuación a cubierta.", "B": "Instalaciones térmicas existentes que se reformen cambiándose sus generadores y que dispongan de conducto de evacuación a cubierta, no adecuado al nuevo generador objeto de la reforma.", "C": "En generadores que utilicen combustibles gaseosos, se permitirá la salida directa de estos productos al exterior con conductos por fachada o patio de ventilación, cuando se trate de aparatos estancos de potencia útil nominal inferior o igual a 70 kW o de aparatos de tiro natural para la producción de agua caliente sanitaria de potencia útil inferior o igual a 24,4 kW en determinados casos establecidos en el reglamento.", "D": "Todas las anteriores son correctas."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 29, "q": "La longitud de la conexión flexible que se utilice para conectar la red de conductos a las unidades terminales no será mayor de :", "c": "", "o": {"A": "0,8 m", "B": "1 m", "C": "1,5 m", "D": "2 m"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (1ª conv.)", "n": 30, "q": "En una sala de exposiciones de 2000 m2, se visualizará la temperatura del aire y la hume- dad relativa registradas en cada momento y las que debería tener, por medio de:", "c": "", "o": {"A": "3 dispositivos, uno de ellos en el vestíbulo de acceso.", "B": "2 dispositivos, uno de ellos en el vestíbulo de acceso", "C": "1 dispositivo en el vestíbulo de acceso", "D": "No hay que visualizar la temperatura y humedad registrada, sería suficiente indicar mediante carteles informativos las condiciones de temperatura y humedad límites establecidas por el reglamento. 26/09/2020"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 1, "q": "Se entiende por reforma de una instalación térmica:", "c": "", "o": {"A": "La incorporación a la instalación de nuevos subsistemas de climatización o de producción de A.C.S. y de energías renovables", "B": "Unicamente el cambio de tipo de la energía utilizada", "C": "Unicamente la sustitución del generador de calor de la instalación térmica", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 2, "q": "Con el objeto de facilitar su comprensión y utilización, el RITE se ordena en:", "c": "", "o": {"A": "Tres partes: Disposiciones generales, Instrucciones Técnicas y Apéndices", "B": "Dos partes: Disposiciones generales e Instrucciones Técnicas", "C": "Es único, no está dividido en partes diferenciadas", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 3, "q": "Dentro de las exigencias técnicas de bienestar e higiene se incluyen:", "c": "", "o": {"A": "La calidad térmica del ambiente y el rendimiento energético de los equipos", "B": "Calidad del aire interior e higiene", "C": "Calidad del ambiente atmosférico", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 4, "q": "Para cumplir las exigencias del RITE es necesario aplicar:", "c": "", "o": {"A": "Exclusivamente las Instrucciones Técnicas del RITE", "B": "Las Instrucciones Técnicas y/o alternativamente aportar soluciones que ofrezcan prestaciones equivalen- tes", "C": "Las Instrucciones Técnicas del RITE y además el Código Técnico de la Edificación en su defecto", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 5, "q": "El Certificado de Mantenimiento se suscribirá:", "c": "", "o": {"A": "Anualmente por la empresa mantenedora de la instalación térmica", "B": "Cada cinco años por Organismo de Control Habilitado.", "C": "Anualmente por la empresa mantenedora y el director de mantenimiento, cuando la participación de este sea preceptiva, de la instalación térmica", "D": "Cada dos años por la empresa mantenedora de la instalación térmica"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 6, "q": "Para el ejercicio de la actividad como empresa instaladora / Mantenedora es necesario cumplir uno de los siguientes requisitos:", "c": "", "o": {"A": "Tener suscrito un seguro de responsabilidad civil que cubra los daños que puedan derivarse de sus ac- tuaciones, por una cuantía mínima de 300.000 euros y estar dados de alta en el correspondiente régi- men de la Seguridad Social y al corriente en el cumplimiento de las obligaciones del sistema.", "B": "Disponer de dos operarios en plantilla con carne profesional de instalaciones térmicas en edificios", "C": "Tener en plantilla personal certificado conforme a lo dispuesto en el R.D. 795/2010, por el que se regula la comercialización y manipulación de gases fluorados y equipos basados en los mismos", "D": "Estar dado de alta en el Régimen Especial de Empresas Instaladoras de la Seguridad Social"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 7, "q": "El Titular de la instalación es responsable de:", "c": "", "o": {"A": "Únicamente del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habili- tada.", "B": "Del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habilitada y de las inspecciones obligatorias.", "C": "Del mantenimiento de las instalaciones llevado a cabo por una empresa mantenedora habilitada y de las inspecciones obligatorias. La conservación de la documentación de todas las actuaciones es respon- sabilidad de la empresa mantenedora.", "D": "Ninguna de las anteriores es correcta."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 8, "q": "Los aparatos de recuperación de calor deberán de estar siempre protegidos con una sección de filtros cuya clase será:", "c": "", "o": {"A": "La recomendada por el fabricante o como mínimo F5", "B": "La recomendada por el fabricante o como mínimo F6", "C": "Mínimo F6", "D": "No es necesario que los recuperadores estén protegidos"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 9, "q": "Los prefiltros se instalarán:", "c": "", "o": {"A": "Solo en la entrada de la unidad de tratamiento de aire (U.T.A.)", "B": "Solo en la entrada del aire de retorno", "C": "Solo en locales o edificios cuya calidad del aire interior deba ser IDA 1", "D": "Ninguna de las anteriores es correcta"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 10, "q": "El caudal mínimo de aire de extracción en los locales de servicio será como mínimo:", "c": "", "o": {"A": "2 dm3/s x m2 de superficie en planta", "B": "0,5 dm3/s x m2 de superficie en planta", "C": "1 dm3/s x m2 de superficie en planta", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 11, "q": "En piscinas climatizadas, la temperatura del agua estará comprendida entre:", "c": "", "o": {"A": "Dependerá exclusivamente del uso principal de la piscina", "B": "22º y 28º", "C": "18 y 26º", "D": "24º y 30º según el uso principal de la piscina, salvo usos terapeúticos"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 12, "q": "La temperatura del agua en piscinas climatizadas se medirá:", "c": "", "o": {"A": "En el centro y a unos 20 cm. por debajo de la lámina de agua", "B": "Según el método de la norma UNE-EN-13779", "C": "En tres puntos equidistantes de uno de los vértices y a 10 cm. por debajo de la lámina de agua", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 13, "q": "El caudal mínimo de aire exterior de ventilación para locales no dedicados a ocupación humana permanente con un índice de calidad del aire interior IDA 4 será de:", "c": "", "o": {"A": "0,28 l/s por m2 de superficie del local", "B": "8 l/s y persona", "C": "500 ppm", "D": "0,8 dp"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 14, "q": "En el caso de generadores de calor que utilicen biomasa, el rendimiento mínimo instantáneo exigido será del:", "c": "", "o": {"A": "90% a plena carga", "B": "80% a plena carga", "C": "75% a plena carga y del 50% a media carga", "D": "80% a plena carga salvo estufas e insertables de leña."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 15, "q": "A los quemadores de los generadores de calor alimentados por combustibles líquidos o gaseosos con potencia térmica nominal de 100 kW, se les exigirá una regulación mínima:", "c": "", "o": {"A": "De una marcha", "B": "De dos marchas", "C": "De tres marchas o modulante", "D": "Exclusivamente modulante"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 16, "q": "Para calcular el espesor mínimo del aislamiento térmico por el procedimiento simplificado, se considera un material con la siguientes características de conductividad térmica (ref):", "c": "", "o": {"A": "0,030 W/mK a 20ºC", "B": "0.040 W/mK a 10ºC", "C": "0,020 W/mK a 25ºC", "D": "Ninguna de las anteriores es correcta"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 17, "q": "La caída máxima de presión admisible en unidades de tratamiento de aire (U.T.A.) sera:", "c": "", "o": {"A": "No mayor de 10 Pa", "B": "Igual o mayor de 20 Pa", "C": "No mayor de 40 Pa", "D": "De 40 a 200 Pa dependiendo del tipo de U.T.A."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 18, "q": "El enfriamiento gratuito por aire exterior (Free Cooling) debe ser instalado en los subsistemas:", "c": "", "o": {"A": "De tipo Todo Aire a partir de una potencia térmica nominal mayor que 100 kW", "B": "En todos los de tipo Mixto Agua-Aire", "C": "De tipo Todo Aire, a partir de una potencia térmica nominal mayor que 70 kW", "D": "Es opcional, a criterio del instalador o técnico competente, siguiendo (en subsistemas Todo Aire) las normas UNE-EN 13053 y 1751"}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 19, "q": "Las bombas y ventiladores de potencia eléctrica del motor mayor de 20 kW dispondrán de:", "c": "", "o": {"A": "Un dispositivo que registre las horas de funcionamiento del equipo", "B": "Un sistema de medida de la energía eléctrica consumida", "C": "Un dispositivo que registre las horas de funcionamiento del equipo y un sistema de medida de la energía eléctrica consumida", "D": "Ninguna de las anteriores es correcta"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 20, "q": "La instalación de un calentador a gas de 26 kW de tipo B (Cámara abierta):", "c": "", "o": {"A": "Está prohibida, solo pueden instalarse aparatos de tipo C (Cámara cerrada)", "B": "Es posible si se instala en un local que cumpla los requisitos para sala de máquinas", "C": "La prohibición no afecta a aparatos de tipo B3X (Abierta con tiro forzado)", "D": "B y C son correctas"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 21, "q": "Si se ventila de forma natural al exterior por orificios:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "El local necesita una superficie abierta al aire libre mínima de 700 cm2.", "B": "El local necesita una superficie abierta al aire libre mínima de 2000 cm2.", "C": "El local necesita una superficie abierta al aire libre mínima de 5000 cm2.", "D": "El local necesita una superficie abierta al aire libre mínima de 700 cm2 complementado por otro orificio de superficie 600 cm2."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 22, "q": "Si se ventila de forma natural a través de conducto, la sección libre mínima de los conductos será de:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "1050 cm2 en conductos verticales y 1400 cm2 en los horizontales.", "B": "5000 cm2 en conductos verticales y 8000 cm2 en los horizontales.", "C": "2000 cm2 en conductos verticales y 5000 cm2 en los horizontales.", "D": "2100 cm2 en conductos verticales y 2800 cm2 en los horizontales."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 23, "q": "Si se opta por utilizar ventilación forzada, se instalará un ventilador de impulsión soplando desde la parte inferior de la sala que asegure:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "Un caudal mínimo 2100 m3/h.", "B": "Un caudal mínimo 852 m3/h.", "C": "Un caudal mínimo 1470 m3/h.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 24, "q": "Por tratarse de una caldera alimentada a gas natural, es necesario instalar en el local detectores de fugas combinados con un sistema de corte automático de la alimentación a la caldera, en una cantidad de:", "c": "En el caso del cálculo de la ventilación de una sala de máquinas con una superficie de 60 m2 que tiene instalados en su interior una caldera alimentada de gas natural con un potencia térmica nominal total de 140 kW", "o": {"A": "1 detector como mínimo", "B": "2 detectores como mínimo", "C": "3 detectores como mínimo", "D": "4 detectores distribuidos uniformemente como mínimo"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 25, "q": "El índice de calidad del aire interior (IDA) deberá ser como mínimo el siguiente:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "IDA 1.", "B": "IDA 2.", "C": "IDA 3.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 26, "q": "Si se calcula por el método indirecto por persona, el caudal mínimo del aire exterior de ventilación será:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "3600 dm3/s", "B": "4000 dm3/s", "C": "1200 dm3/s", "D": "800 dm3/s"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 27, "q": "Si se calcula por el método indirecto por ud. de superficie, el caudal mínimo del aire exterior de ventilación será:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "249 dm3/s", "B": "165 dm3/s", "C": "84 dm3/s", "D": "No se puede calcular por este método."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 28, "q": "Si el aire exterior al local tiene una alta concentración de partículas y de gases contaminantes, se requerirá instalar filtros con clase de filtración:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "F5+F7.", "B": "G4/F6.", "C": "F8.", "D": "F7+F9"}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 29, "q": "Los locales no habitables de la guardería:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "Pueden climatizarse según el criterio del titular y/o el instalador.", "B": "Se pueden climatizar manteniendo temperaturas inferiores a 18ºC en invierno y superiores a 26ºC en verano.", "C": "Se pueden climatizar si se utilizan energías renovables o residuales.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2020 (2ª conv.)", "n": 30, "q": "Si se considera que la instalación de climatización de la guardería va a expulsar al exterior un caudal de aire, por medios mecánicos, de 0,5 m3/s:", "c": "Se pretende calcular la instalación de climatización de un establecimiento destinado a gudadería con una ocupación de 60 personas y una superficie de 300 m2", "o": {"A": "Se instalará un sistema de recuperación de calor del aire expulsado.", "B": "La instalación del sistema de recuperación de calor del aire expulsado es a criterio del proyectista/insta- lador.", "C": "Se instalará un sistema de recuperación de calor del aire expulsado si la instalación funciona más de 2000 horas anuales.", "D": "Se instalará un sistema de recuperación de calor del aire expulsado si la instalación funciona más de 3000 horas anuales."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 1, "q": "Para la puesta en servicio de las instalaciones térmicas...:", "c": "", "o": {"A": "Será suficiente con haber emitido el certificado de la instalación.", "B": "Será necesario el registro del certificado de la instalación en el órgano competente de la Comunidad Autónoma donde radique la instalación.", "C": "Será suficiente haber realizado las pruebas que se especifican en la IT 2 con resultados satisfactorios.", "D": "Solo es necesario tener visado el proyecto por el colegio oficial."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 2, "q": "El aire de extracción procedente de un local en el cual está prohibido fumar y las emisiones contaminantes proceden de los materiales de construcción y decoración así como de las personas, será del tipo:", "c": "", "o": {"A": "AE1.", "B": "AE2.", "C": "AE3.", "D": "AE4."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 3, "q": "Indicar el diámetro correcto de la conexión de alimentación de una instalación con una unidad enfriadora de agua de 150 kW de potencia nominal:", "c": "", "o": {"A": "20 mm.", "B": "3/4 pulgada.", "C": "25 mm.", "D": "32 mm."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 4, "q": "Las modificaciones que se produzcan en relación con los datos comunicados en la declaración responsable, así como el cese de la actividad, deberán comunicarse por el titular de la declaración responsable al órgano competente de la comunidad autónoma donde se obtuvo la habilitación:", "c": "", "o": {"A": "En el plazo de quince días desde que se produzcan.", "B": "En el plazo de un mes desde que se produzcan.", "C": "No será necesario que se comunique por el titular de la declaración.", "D": "Se pueden notificar al órgano competente de cualquier comunidad autónoma."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 5, "q": "Las preinstalaciones térmicas en los edificios:", "c": "", "o": {"A": "Se registrarán por medio de una memoria técnica.", "B": "No se registrarán.", "C": "Se registrarán por medio de un proyecto técnico.", "D": "Solo se registrarán si el cliente quiere."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 6, "q": "La pérdida de carga máxima admisible en una rejilla de retorno de aire es...:", "c": "", "o": {"A": "20 mm ca.", "B": "6 mm ca.", "C": "2 Pa.", "D": "2mm ca."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 7, "q": "Una instalación de producción de agua caliente sanitaria para un gimnasio dispone de 3 calentadores acumuladores con potencia térmica nominal unitaria de 30 kW. En este caso:", "c": "", "o": {"A": "Se requerirá la realización de un proyecto.", "B": "No es preceptiva la presentación de proyecto ni tampoco memoria técnica para la acreditación del cumplimiento reglamentario ante el órgano competente de la Comunidad Autónoma.", "C": "El proyecto podrá sustituirse por una memoria técnica.", "D": "Ninguna respuesta es correcta."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 8, "q": "Para el dimensionado de los sistemas de calefacción, se empleará una temperatura de cálculo de las condiciones interiores de:", "c": "", "o": {"A": "Depende de la localidad donde radique la instalación.", "B": "21ºC.", "C": "23ºC.", "D": "25ºC."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 9, "q": "Según el RITE, además del procedimiento de verificación de la exigencia de la calidad acústica de las instalaciones, debe efectuarse de la verificación de la exigencia de:", "c": "", "o": {"A": "Calidad hidrotérmica del ambiente, calidad de aire interior e higiene.", "B": "Calidad térmica del ambiente, calidad de aire exterior e higiene.", "C": "Calidad térmica del ambiente, calidad de aire interior e higiene.", "D": "Solo debe verificarse la calidad acústica de las instalaciones."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 10, "q": "Según el RITE, ¿cuál son los valores máximos de temperatura seca y humedad relativa en una piscina climatizada que tiene el agua del vaso a 24 ºC?", "c": "", "o": {"A": "23 ºC y 65% de HR.", "B": "26 ºC y menos del 65% de HR.", "C": "30 ºC y menos del 65% de HR.", "D": "22 ºC y menos del 65% de HR."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 11, "q": "Indicar la clasificación del sistema de control de la calidad de aire exterior en un sistema de climatización que dispone de un ventilador que se pone en marcha mediante un programador horario.", "c": "", "o": {"A": "IDA-C 4.", "B": "IDA-C 3.", "C": "IDA-C 2.", "D": "IDA-C 1."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 12, "q": "Para compensar las variaciones de longitud a que están sometidas las tuberías en los tendidos de gran longitud debido a la variación de temperatura del fluido que contienen, pueden emplearse:", "c": "", "o": {"A": "Solo cambios de dirección.", "B": "Solo compensadores de dilatación.", "C": "Los cambios de dirección y compensadores de dilatación.", "D": "Vasos de expansión."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 13, "q": "Los materiales empleados en las instalaciones de ACS deben...:", "c": "", "o": {"A": "Soportar tratamientos de choque físico.", "B": "No soportar tratamientos de choque térmico.", "C": "Soportar tratamientos de choque químico.", "D": "De buena relación calidad-precio."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 14, "q": "¿Qué tipo de filtro previo y filtro final, será necesario instalar para una calidad de aire interior IDA 1, si el aire exterior introducido en el local es del tipo ODA 2?", "c": "", "o": {"A": "F7+F8.", "B": "F6+F8.", "C": "F7+F9.", "D": "F5+F7."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 15, "q": "Una caldera de un nuevo edificio, alimentada con pellets tiene un consumo medio diario de 20 kg. La capacidad de almacenamiento deberá ser como mínimo de:", "c": "", "o": {"A": "320 kg.", "B": "300 kg.", "C": "250 kg.", "D": "200 kg."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 16, "q": "Indicar la afirmación correcta para la instalación del conducto concéntrico de evacuación de una caldera mixta de tipo estanco a través de fachada en una zona con tránsito de personas:", "c": "", "o": {"A": "El conducto sobresale 4 cm del muro en la zona exterior.", "B": "El conducto sobresale 4 cm del muro en la zona exterior y al menos 2,20 m del nivel del suelo.", "C": "El conducto sobresale 3 cm del muro en la zona exterior y al menos 2 m del nivel del suelo.", "D": "El conducto sobresale 3 cm del muro en la zona exterior y al menos 2,20 m del nivel del suelo."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 17, "q": "Una instalación térmica con potencia térmica nominal total de 55 kW:", "c": "", "o": {"A": "Se mantendrá por una empresa mantenedora habilitada, no siendo preceptivo que ésta tenga suscrito un contrato de mantenimiento con el titular de la instalación.", "B": "Se mantendrá por una empresa mantenedora habilitada, siendo preceptivo que ésta tenga suscrito un contrato de mantenimiento con el titular de la instalación.", "C": "No es necesario realizar mantenimiento a este tipo de instalaciones.", "D": "El mantenimiento de estas instalaciones lo realizan empresas habilitadas por el Reglamento de Equipos a Presión."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 18, "q": "El equipo generador que complementa el aporte solar y cuya potencia es suficiente para que pueda proporcionar la energía suficiente para cubrir la demanda prevista, se denomina:", "c": "", "o": {"A": "Equipo solar.", "B": "Equipo de energía de apoyo.", "C": "Equipo de energía auxiliar.", "D": "Generador solar de apoyo."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 19, "q": "Según el RITE, la operación que tiene por objeto comprobar que las características técnicas de los equipos y materiales suministrados satisfacen lo exigido por el proyecto o memoria técnica se denomina:", "c": "", "o": {"A": "Control de la recepción.", "B": "Control de la ejecución.", "C": "Control de la instalación terminada.", "D": "Control de calidad."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 20, "q": "¿Qué valor tiene el SFP, medido en W/(m³/s) de un sistema de climatización con distribución de aire por conductos con un caudal de 10800 m3/h si la potencia absorbida por los ventiladores del sistema es de 2000 W?:", "c": "", "o": {"A": "667", "B": "2000", "C": "5,4", "D": "0,185"}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 21, "q": "Las tuberías de una instalación de calefacción donde la temperatura de circulación es de 60ºC discurren vistas por la parte baja de un local calefactado (encima del rodapié). ¿Es obligatorio que las tuberías vayan aisladas?", "c": "", "o": {"A": "Sí.", "B": "Si, por tener una temperatura mayor de 40 ºC.", "C": "No, al circular por un local calefactado.", "D": "Queda a elección del titular de la instalación."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 22, "q": "Las instalaciones de producción centralizada de ACS en edificios previstos para múltiples usuarios:", "c": "", "o": {"A": "Dispondrán de un dispositivo para cada usuario que permitirá regular y medir los consumos, así como interrumpir los servicios desde el exterior de los locales.", "B": "Contarán con un dispositivo de regulación todo-nada.", "C": "Contarán con contadores para cada usuario centralizados por plantas.", "D": "Un dispositivo que permita medir la energía térmica generada y contadores específicos."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 23, "q": "El titular de una instalación de 80 kW de potencia térmica instalada, ¿necesita suscribir un contrato de mantenimiento con una empresa mantenedora autorizada?:", "c": "", "o": {"A": "No.", "B": "Sí.", "C": "Depende del sistema de climatización instalado.", "D": "En el caso de 80 kW es indiferente."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 24, "q": "Una instalación de calefacción que dispone de un generador de 60 kW de potencia nominal, precisará un vaso de expansión que debe ser:", "c": "", "o": {"A": "De tipo cerrado.", "B": "De tipo abierto.", "C": "De tipo abierto o cerrado indistintamente.", "D": "No requiere vaso de expansión."}, "k": "A", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 25, "q": "¿Qué norma UNE se seguirá para la prueba hidrostática de una red de tuberías plásticas?", "c": "", "o": {"A": "UNE 00151", "B": "UNE 12108", "C": "UNE 100000", "D": "UNE ISO 7730"}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 26, "q": "La comprobación de estanqueidad del circuito de tuberías en una instalación de 80 kW de potencia térmica instalada se realizará:", "c": "", "o": {"A": "Una vez al mes.", "B": "Dos veces al año.", "C": "Una vez por temporada.", "D": "Dos veces al mes."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 27, "q": "¿A qué presión se realiza la prueba de resistencia mecánica de una red de ACS?", "c": "", "o": {"A": "2 veces la presión máxima efectiva de trabajo, con mínimo de 3 bar.", "B": "1,5 veces la presión máxima efectiva de trabajo, con mínimo de 3 bar.", "C": "1,5 veces la presión máxima efectiva de trabajo, con mínimo de 6 bar.", "D": "2 veces la presión máxima efectiva de trabajo, con mínimo de 6 bar."}, "k": "D", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 28, "q": "La relación entre la capacidad calorífica de una máquina frigorífica y la capacidad efectivamente absorbida por la unidad, se denomina:", "c": "", "o": {"A": "Capacidad calorífica.", "B": "COP.", "C": "EER.", "D": "Eficiencia energética."}, "k": "C", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 29, "q": "El ventilador de impulsión de la ventilación forzada de una sala de máquinas…:", "c": "", "o": {"A": "Soplará en la parte superior de la sala.", "B": "Soplará en la parte inferior de la sala.", "C": "Asegurará un caudal máximo.", "D": "Es indiferente su lugar de instalación."}, "k": "B", "e": "", "nk": 0}, {"s": "Andalucía 2025 (2ª conv.)", "n": 30, "q": "La Inspección de la Instalación térmica completa para potencias superiores a 70 kW, se realizará a partir de la fecha de emisión del primer certificado…:", "c": "", "o": {"A": "Cuando la instalación tenga más de 10 años de antigüedad.", "B": "Cada 5 años a partir de los 10 años de antigüedad.", "C": "Cuando tenga más de 5 años de antigüedad.", "D": "Cuando tenga más de 15 años de antigüedad."}, "k": "C", "e": "", "nk": 0}, {"s": "Aragón 2023 (sin reglamento)", "n": 1, "q": "Según el RD 1027/2007, para el dimensionamiento de los sistemas de calefacción, ¿qué temperatura de cálculo se empleará para las condiciones interiores?", "c": "", "o": {"A": "25 ºC", "B": "24 ºC", "C": "20 ºC", "D": "21 ºC"}, "k": "D", "e": "IT 1.1.4.1.2, tabla 1.4.1.1: en invierno la temperatura operativa va de 21 a 23 ºC; para calefacción se calcula con 21 ºC.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 2, "q": "Indique cuál de las siguientes frases es cierta referente a las condiciones a cumplir respecto a la filtración del aire exterior mínimo de ventilación.", "c": "", "o": {"A": "Las clases de filtración mínimas a emplear, dependen únicamente de la calidad del aire exterior (ODA).", "B": "Los prefiltros se instalarán en la entrada del aire exterior a la unidad de tratamiento, así como en la entrada del aire de retorno.", "C": "Los aparatos de recuperación de calor no es necesario que se protejan con una sección de filtros.", "D": "Las clases de filtración mínimas a emplear, dependen únicamente de la calidad del aire interior requerida (IDA)."}, "k": "B", "e": "IT 1.1.4.2.4: los prefiltros se instalan en la entrada del aire exterior a la unidad y en la entrada del aire de retorno. La clase de filtro depende de ODA e IDA a la vez.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 3, "q": "Según la clasificación de aire de extracción que realiza el RD 1027/2007, ¿Qué categorías está permitido que pueda ser retornado a los locales?", "c": "", "o": {"A": "Cualquiera de ellos ya que están filtrados.", "B": "El AE 1 si está exento de tabaco.", "C": "Los AE 3 y AE 4.", "D": "Solamente el AE 2."}, "k": "B", "e": "IT 1.1.4.2.5: sólo el aire de categoría AE 1, exento de humo de tabaco, puede retornarse a los locales.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 4, "q": "Con carácter general, los cerramientos (paredes y techos exteriores) de una sala de máquinas, ¿deben tener un elemento o disposición constructiva de baja resistencia mecánica?", "c": "", "o": {"A": "Sí, siempre.", "B": "No, nunca.", "C": "Es totalmente opcional.", "D": "Si, cuando son con generadores de calor a gas."}, "k": "D", "e": "IT 1.3.4.1.2.8: la superficie de baja resistencia mecánica (1/100 del volumen, mínimo 1 m²) se exige en salas de máquinas con generadores a gas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 5, "q": "En el caso de instalar una caldera de biomasa de 32 kW, la evacuación de los productos de combustión se permitirá por fachada si:", "c": "", "o": {"A": "Se trata de una vivienda unifamiliar.", "B": "Se trata de una vivienda en un edificio existente.", "C": "Se trata de una vivienda en un edificio existente siempre que la caldera sea de emisiones NOX de clase 5.", "D": "Nunca se permitirá, siempre la evacuación se realizará por la cubierta del edificio mediante un conducto adecuado."}, "k": "D", "e": "IT 1.3.4.1.3.1: la salida por fachada sólo se permite con combustibles gaseosos (aparatos estancos ≤70 kW o tiro natural ACS ≤24,4 kW). Una caldera de biomasa debe evacuar por cubierta.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 7, "q": "Se pueden utilizar los pasillos como plenums de retorno en instalaciones de climatización:", "c": "", "o": {"A": "Si, solamente en viviendas.", "B": "No, en ningún caso.", "C": "Si, en todos los casos.", "D": "Cuando sirvan de paso del aire desde zonas acondicionadas hacia los locales de servicio."}, "k": "A", "e": "IT 1.3.4.2.10.4: los pasillos y vestíbulos pueden utilizarse como plenums de retorno solamente en viviendas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 8, "q": "¿Cuál sería la categoría mínima de calidad del aire interior (IDA) en un gimnasio ubicado en una residencia de estudiantes?", "c": "", "o": {"A": "IDA 1 (aire de óptima calidad)", "B": "IDA 2 (aire de buena calidad)", "C": "IDA 3 (aire de calidad media)", "D": "IDA 4 (aire de baja calidad)"}, "k": "C", "e": "IT 1.1.4.2.2: los gimnasios son IDA 3 (aire de calidad media), aunque estén dentro de una residencia.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 9, "q": "El caudal de aire de extracción de locales de servicio será como mínimo de:", "c": "", "o": {"A": "2 dm3 /s por planta.", "B": "2 dm3 /s por m2 de superficie en planta.", "C": "Depende de la categoría de la extracción del aire según el uso del local.", "D": "No existe un caudal mínimo."}, "k": "B", "e": "IT 1.1.4.2.5: el caudal de aire de extracción de locales de servicio será como mínimo 2 dm³/s por m² de superficie en planta.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 10, "q": "Según el artículo 2 del Reglamento de Seguridad para Instalaciones Frigoríficas vigente, ¿Qué sistema de refrigeración compacto NO quedaría excluido del ámbito de aplicación del reglamento?", "c": "", "o": {"A": "Con carga de refrigerante inferior a 2´5 kg de refrigerante del grupo L1.", "B": "Con carga de refrigerante inferior a 0´5 kg de refrigerante del grupo L2.", "C": "Con carga de refrigerante superior a 0´5 kg de refrigerante del grupo L2.", "D": "Con carga de refrigerante inferior a 0´5 kg de refrigerante del grupo L3."}, "k": "C", "e": "RSIF (RD 552/2019), art. 2: quedan excluidos los sistemas compactos con menos de 2,5 kg de L1 o menos de 0,5 kg de L2/L3. Con más de 0,5 kg de L2 sí se aplica el reglamento. (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 11, "q": "Complete la siguiente frase: “En el Proyecto o Memoria Técnica se indicarán las prestaciones energéticas de los equipos de generación de calor y frío seleccionados ...”", "c": "", "o": {"A": "Únicamente para su potencia máxima.", "B": "Únicamente para su potencia mínima.", "C": "En el rango de potencias en las que van a trabajar en la instalación.", "D": "No es necesario indicarlas."}, "k": "C", "e": "IT 1.2.4.1.1: en el proyecto o memoria se indican las prestaciones energéticas de los generadores en el rango de potencias en que van a trabajar.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 12, "q": "Los emisores de calefacción deberán estar calculados para una temperatura máxima de entrada al emisor de:", "c": "", "o": {"A": "70 ºC", "B": "60 ºC", "C": "50 ºC", "D": "90 ºC"}, "k": "B", "e": "IT 1.2.4.1.2.1 (RD 178/2021): los emisores de calefacción se calcularán para una temperatura máxima de entrada de 60 ºC.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 13, "q": "Para evitar la congelación del agua en tuberías expuestas a temperaturas del aire menores a las del cambio de estado se podrá recurrir a", "c": "", "o": {"A": "Empleo de una mezcla de agua y anticongelante.", "B": "Circulación del fluido.", "C": "Aislamiento de la tubería.", "D": "Todas son correctas."}, "k": "D", "e": "IT 1.3.4.2.3 (protección contra heladas): se puede usar anticongelante, mantener la circulación o aislar; todas son válidas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 14, "q": "Las instalaciones térmicas se utilizarán y mantendrán de acuerdo con su potencia térmica nominal y sus características técnicas, de conformidad con los siguientes procedimientos: (señale la respuesta incorrecta)", "c": "", "o": {"A": "Programa de gestión energética", "B": "Programa de mantenimiento preventivo", "C": "Instrucciones de manejo y maniobra", "D": "Certificado final de obra"}, "k": "D", "e": "IT 3.1 y 3.3: las instalaciones se usan y mantienen según el programa de mantenimiento preventivo, el programa de gestión energética y las instrucciones de manejo y maniobra. El certificado final de obra no es un procedimiento de uso.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 15, "q": "Con respecto a las comunicaciones de reforma de una instalación térmica existente que precisen comunicación al órgano competente de la Comunidad Autónoma, ¿quién tendrá la obligación de comunicar la acreditación del cumplimiento de las obligaciones reglamentariamente exigibles previas a la puesta en servicio de la instalación?", "c": "", "o": {"A": "El titular de la instalación.", "B": "La empresa instaladora habilitada.", "C": "La empresa mantenedora habilitada.", "D": "El Organismo de Control."}, "k": "B", "e": "Art. 24 RITE: para la puesta en servicio (nueva o reforma) la empresa instaladora presenta el certificado de la instalación y la documentación al órgano competente.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 16, "q": "Según el reglamento de instalaciones térmicas en los edificios (RITE), se considera sala de máquinas al local técnico donde se alojan los equipos de producción de frío o calor y otros equipos auxiliares y accesorios de la instalación térmica, con potencia", "c": "", "o": {"A": "Superior o igual a 60 kW", "B": "Superior o igual a 70 kW", "C": "Superior a 70 kW", "D": "Superior a 100 kW"}, "k": "C", "e": "IT 1.3.4.1.2.1: los generadores de calor con potencia térmica nominal superior a 70 kW deben instalarse en sala de máquinas.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 17, "q": "Los locales con calefacción mediante generadores de aire caliente o tubos radiantes a gas, ¿en qué supuesto tendrán la consideración de sala de máquinas?", "c": "", "o": {"A": "No tendrán la consideración de sala de máquinas", "B": "Con potencia superior o igual a 70 kW", "C": "Con potencia superior a 70 kW", "D": "Con potencia superior a 100 kW"}, "k": "A", "e": "IT 1.3.4.1.2.1: los locales con generadores de aire caliente, tubos radiantes a gas o similares no tienen la consideración de sala de máquinas (se aplica la UNE-EN 13410 para ventilación).", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 18, "q": "Las salas de máquinas con generadores de calor a gas natural se ubicarán preferentemente", "c": "", "o": {"A": "En semisótano o primer sótano.", "B": "En planta baja.", "C": "En cubierta.", "D": "En un nivel igual o superior al semisótano o primer sótano."}, "k": "D", "e": "IT 1.3.4.1.2.8: no se permiten salas con calderas a gas por debajo de semisótano o primer sótano.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 19, "q": "En instalaciones de potencia térmica nominal mayor que 70 kW, el equipamiento mínimo de aparatos de medición en colectores de impulsión y retorno de un fluido portador será:", "c": "", "o": {"A": "Un termómetro.", "B": "Un manómetro.", "C": "Un termómetro y un manómetro.", "D": "Un pirómetro o un pirostato con escala indicadora."}, "k": "C", "e": "IT 1.3.4.4.1 (equipamiento mínimo >70 kW): en colectores de impulsión y retorno, un termómetro y un manómetro.", "nk": 1}, {"s": "Aragón 2023 (sin reglamento)", "n": 20, "q": "La unificación del uso de los conductos de evacuación de los productos de la combustión con otras instalaciones de evacuación", "c": "", "o": {"A": "Está prohibida.", "B": "Está permitida.", "C": "Está recomendada.", "D": "Está permitida en circunstancias especiales."}, "k": "A", "e": "IT 1.3.4.1.3.2: queda prohibida la unificación de los conductos de evacuación de humos con otras instalaciones de evacuación.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 1, "q": "¿Qué espesor mínimo de aislamiento debe tener un material con conductividad térmica a 10°C de 0,040 W/(mK) de una tubería de diámetro exterior de 90 mm que transporta fluidos fríos a 15°C y que discurre por el interior de los edificios?", "c": "", "o": {"A": "20 mm", "B": "30 mm", "C": "35 mm", "D": "40 mm"}, "k": "B", "e": "Tabla 1.2.4.2.3 (fluidos fríos, interior): diámetro 60<D≤90 mm y temperatura mayor de 10 ºC → 30 mm.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 2, "q": "En una instalación de aire acondicionado con refrigerante R-744, ¿cuál es la clase de inflamabilidad del refrigerante?", "c": "", "o": {"A": "1", "B": "2L", "C": "2", "D": "3"}, "k": "A", "e": "El R-744 es CO₂: clase de seguridad A1 según UNE-EN 378 / RSIF, es decir, inflamabilidad clase 1 (no inflamable). (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 3, "q": "En un colegio de 300 alumnos, con 20 alumnos por clase y el docente, se ha de calcular la exigencia de calidad del aire interior. ¿Cuál es el caudal mínimo de aire exterior de ventilación, que hay que inyectar por hora en cada clase?", "c": "", "o": {"A": "1512 m3/h", "B": "1440 m3/h", "C": "945 m3/h", "D": "900 m3/h"}, "k": "C", "e": "Aula: IDA 2 = 12,5 l/s por persona. 21 personas × 12,5 = 262,5 l/s × 3,6 = 945 m³/h.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 4, "q": "En el aula del ejercicio anterior, se precisa calcular la filtración del aire exterior mínimo de ventilación, sabiendo que es un aire puro que se ensucia sólo temporalmente. ¿Cómo mínimo, que clase de filtración hay que instalar?", "c": "", "o": {"A": "F8", "B": "F7", "C": "F9", "D": "F6 + F8"}, "k": "D", "e": "Aire puro que se ensucia temporalmente = ODA 2. Aula = IDA 2. Tabla 1.4.2.5: ODA 2 + IDA 2 → F6 + F8.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 5, "q": "Un sistema de agua caliente sanitaria de potencia 75 kW dispone de un sistema de vaciado total y varios vaciados parciales. ¿Cuál deberá ser el diámetro mínimo de dichos elementos de vaciado?", "c": "", "o": {"A": "20 mm para los sistemas parciales y 32 mm para el sistema total.", "B": "20 mm para los sistemas parciales y 25 mm para el sistema total.", "C": "15 mm para los sistemas parciales y 25 mm para el sistema total.", "D": "Ninguno de los anteriores."}, "k": "B", "e": "IT 1.3.4.2.3 y tabla 3.4.2.3: vaciados parciales DN 20 mm; vaciado total para 70<P≤150 kW en calor: 25 mm.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 6, "q": "En un edificio existente realizamos la reforma de una sala de máquinas de 80 m² con calderas de gas cuya potencia térmica nominal es de 500 kW, en la que no es posible lograr la superficie no resistente al exterior, o a patio de ventilación. ¿Qué opción de las siguientes es la adecuada?", "c": "", "o": {"A": "Se realizará una ventilación forzada y se instalará un sistema de detección y corte de fugas de gas. En la ventilación, se dispondrá de un ventilador de impulsión, soplando en la parte inferior de la sala, que asegure un caudal mínimo, de 1.700 m³/h.", "B": "Se deberá obligatoriamente realizar ventilación natural directa al exterior, mediante aberturas de área libre mínima de 2.000 cm².", "C": "Se podrá realizar ventilación natural directa por conductos horizontales de sección libre mínima de 5.000 cm².", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "IT 1.3.4.1.2.8: si no hay superficie de baja resistencia → ventilación forzada + detección y corte de gas. Caudal mínimo 1,8·PN + 10·A = 1,8·500 + 10·80 = 1.700 m³/h.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 7, "q": "¿Podemos considerar como patio de ventilación, a efectos de evacuación de los pdC, un patio de 4 m2 al cual dan 9 locales que pueden contener aparatos conducidos?", "c": "", "o": {"A": "Sí, siempre.", "B": "No, tendría que ser como mínimo de 4,5 m2 y tratarse de un patio de ventilación de edificios existentes.", "C": "No, tendría que ser como mínimo de 4,5 m2, ya sea un patio de ventilación de edificios nuevos o existentes.", "D": "No, tendría que ser como mínimo de 3 m2."}, "k": "B", "e": "IT 1.3.4.1.3.1: en edificios existentes el patio debe tener 0,5 × NT m² (NT = locales), mínimo 4 m². 0,5 × 9 = 4,5 m². Sólo vale para edificios existentes.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 8, "q": "Para una sala de máquinas, con potencia nominal de generación 200 kW, superficie de local 20 m2 y volumen de local 50 m3, se debe disponer un sistema de ventilación natural por conducto. ¿Cuál debe ser la sección libre mínima (cm2) de los conductos de ventilación, según sea vertical u horizontal?", "c": "", "o": {"A": "Vertical, 150 cm2; horizontal, 200 cm2", "B": "Vertical, 375 cm2; horizontal, 500 cm2", "C": "Vertical, 750 cm2; horizontal, 1000 cm2", "D": "Vertical, 1500 cm2; horizontal, 2000 cm2"}, "k": "D", "e": "IT 1.3.4.1.2.7: conductos verticales 7,5 cm²/kW y horizontales 10 cm²/kW. 200 kW → 1.500 y 2.000 cm².", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 9, "q": "En una sala de máquinas con generadores de calor a gas, con potencia nominal de generación 200 kW y volumen de local 50 m3, ¿cuál debe ser la mínima superficie de baja resistencia mecánica en comunicación directa a una zona exterior o patio descubierto, si dicha superficie se fragmenta en dos?", "c": "", "o": {"A": "1 m2, con un mínimo de 250 cm2 por división", "B": "1,1 m2, con un mínimo de 250 cm2 por división", "C": "2 m2, con un mínimo de 250 cm2 por división", "D": "2,2 m2, con un mínimo de 500 cm2 por división"}, "k": "B", "e": "Superficie = volumen/100 = 0,5 m², pero el mínimo es 1 m². Al fragmentarse se aumenta un 10 % → 1,1 m², con mínimo 250 cm² por división.", "nk": 1}, {"s": "Aragón 2023 (con reglamento)", "n": 10, "q": "La alimentación de los circuitos de una instalación térmica se realizará mediante un dispositivo, denominado desconector, que servirá para reponer las pérdidas de agua. El diámetro mínimo de las conexiones es función de la potencia útil nominal de la instalación. Para una instalación de calefacción de potencia útil nominal 400 kW, el diámetro nominal mínimo de la conexión será:", "c": "", "o": {"A": "20 mm", "B": "25 mm", "C": "32 mm", "D": "40 mm"}, "k": "B", "e": "Tabla 3.4.2.2 (conexión de alimentación): 150<P≤400 kW en calor → DN 25 mm.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 1, "q": "¿A qué grupo pertenecen los refrigerantes no inflamables y de acción tóxica ligera o nula?", "c": "", "o": {"A": "Alta seguridad (L1)", "B": "Media seguridad (L2)", "C": "Media seguridad (A2L)", "D": "Baja seguridad (L3)"}, "k": "A", "e": "RSIF (RD 552/2019): grupo L1 alta seguridad = refrigerantes no inflamables y de toxicidad ligera o nula (A1). (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 2, "q": "¿Cuál es el color de fondo de las señales de las tuberías de refrigerante?", "c": "", "o": {"A": "Blanco RAL 1021", "B": "Amarillo RAL 1021", "C": "Verde RAL 1021", "D": "Azul RAL 1021"}, "k": "B", "e": "RSIF, señalización de tuberías de refrigerante: fondo amarillo RAL 1021. (No es RITE, respuesta elaborada.)", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 3, "q": "Cómo mínimo, ¿Qué categoría de calidad de aire interior se deberá alcanzar en una sala de cine?", "c": "", "o": {"A": "AE 3", "B": "IDA 2", "C": "ODA 2", "D": "IDA 3"}, "k": "D", "e": "IT 1.1.4.2.2: cines, teatros, salones de actos, bares, restaurantes, comercios y gimnasios son IDA 3.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 4, "q": "¿Cuál es la mínima potencia útil nominal que obliga a que los generadores de calor y de frío dispondrán de un dispositivo que permita registrar su número de horas de funcionamiento?", "c": "", "o": {"A": "De 30 kW", "B": "De 50 kW", "C": "De 70 kW", "D": "De 100 Kw"}, "k": "C", "e": "IT 1.2.4.4: generadores de calor y frío de potencia útil nominal mayor que 70 kW llevan contador de horas de funcionamiento.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 5, "q": "Respecto a las dimensiones de una sala de máquinas en una instalación térmica, ¿cuál es la opción correcta?", "c": "", "o": {"A": "La altura mínima de la sala será de 2´25 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´5 m.", "B": "La altura mínima de la sala será de 2´50 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´5 m.", "C": "La altura mínima de la sala será de 2´50 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´3 m.", "D": "La altura mínima de la sala será de 2´25 m; respetándose una altura libre de tuberías y obstáculos sobre la caldera de 0´3 m."}, "k": "B", "e": "IT 1.3.4.1.2.2: altura mínima de la sala 2,50 m y 0,5 m libres sobre la caldera.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 6, "q": "Según el reglamento de instalaciones térmicas, ¿para qué temperatura máxima de entrada al emisor de calefacción han de estar calculados los emisores de calefacción?", "c": "", "o": {"A": "55º C", "B": "60º C", "C": "65º C", "D": "70º C"}, "k": "B", "e": "IT 1.2.4.1.2.1 (RD 178/2021): temperatura máxima de entrada al emisor 60 ºC.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 7, "q": "Según el reglamento de instalaciones térmicas, en edificios nuevos ¿cuál es la capacidad mínima de almacenamiento de biocombustibles?", "c": "", "o": {"A": "La suficiente para cubrir el consumo de 5 días", "B": "La suficiente para cubrir el consumo de 10 días", "C": "La suficiente para cubrir el consumo de 15 días", "D": "La suficiente para cubrir el consumo de 20 días"}, "k": "C", "e": "IT 1.3.4.1.4: en edificios nuevos el almacenamiento de biocombustible cubrirá el consumo de 15 días.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 8, "q": "¿Dónde se instalan los prefiltros?", "c": "", "o": {"A": "A la salida de la unidad de tratamiento del aire exterior.", "B": "Justo antes de los filtros finales.", "C": "Después de la sección de tratamiento.", "D": "En la entrada del aire exterior a la unidad de tratamiento, así como en la entrada del aire de retorno."}, "k": "D", "e": "IT 1.1.4.2.4: prefiltros en la entrada del aire exterior a la unidad de tratamiento y en la entrada del aire de retorno.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 9, "q": "Las instalaciones que requieren sala de máquinas de riesgo alto son aquellas que:", "c": "", "o": {"A": "Han sido realizadas en edificios institucionales o de pública concurrencia.", "B": "Trabajen con agua a temperatura máxima de 100 °C.", "C": "Se hayan realizado reformas en edificios de uso residencial existentes con calderas de gas.", "D": "Se haya cambiado el tipo de energía utilizada"}, "k": "A", "e": "IT 1.3.4.1.2.4: sala de máquinas de riesgo alto = edificios institucionales o de pública concurrencia, o agua a más de 110 ºC.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 10, "q": "¿Con qué periodicidad se realizará la inspección de la instalación térmica completa?", "c": "", "o": {"A": "Anualmente.", "B": "Cada dos años.", "C": "Cada cinco años.", "D": "Cada quince años."}, "k": "D", "e": "IT 4.3.3: la inspección de la instalación térmica completa se realiza cada quince años (la primera al superar los 15 años de antigüedad).", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 11, "q": "La prueba preliminar de estanquidad de las redes de distribución de tuberías en una instalación térmica, que consiste en detener fallos de continuidad de la red y evitar los daños que podría provocar la prueba de resistencia mecánica, se debe realizar a:", "c": "", "o": {"A": "Muy alta presión", "B": "Alta presión", "C": "Media presión", "D": "Baja presión"}, "k": "D", "e": "IT 2.2.2: la prueba preliminar de estanquidad se hace a baja presión para detectar fallos de continuidad antes de la prueba de resistencia.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 12, "q": "En una nueva instalación o en la reforma de una existente, ¿quién tiene la obligación de comunicar la acreditación del cumplimiento de las condiciones reglamentariamente exigibles previas a la puesta en servicio de la instalación térmica?", "c": "", "o": {"A": "El titular de la instalación.", "B": "El usuario de la instalación.", "C": "La empresa instaladora habilitada en instalaciones térmicas.", "D": "El instalador habilitado en instalaciones térmicas."}, "k": "C", "e": "Art. 24 RITE: la empresa instaladora presenta al órgano competente el certificado de la instalación y la documentación para la puesta en servicio.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 13, "q": "En el caso de reforma de una instalación térmica existente, por sustitución de una caldera de gas por un equipo de aerotermia de potencia térmica nominal de generación de calor superior a 5 kW, ¿debe realizarse la comunicación de reforma de instalación existente, según Orden de 27 de abril de 2009?", "c": "", "o": {"A": "Siempre.", "B": "Sí, pero solo en el caso de que la potencia térmica nominal de generación de calor instalada sea superior a 70 kW.", "C": "Sí, pero solo si comporta una variación superior al 25% de la su potencia útil nominal del equipo sustituido.", "D": "No."}, "k": "A", "e": "Art. 2.3 RITE: sustituir un generador por otro de distintas características o cambiar el tipo de energía es una reforma, y toda reforma de ≥5 kW se comunica (art. 15 y 24). En Aragón lo regula la Orden de 27/4/2009.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 14, "q": "En un edificio de nueva construcción, de 3 plantas y 4 viviendas por planta, se plantea una instalación térmica en edificio compuesta por un generador de calor y frío por vivienda, de potencia térmicas nominales 10,8 kW en calor y 9,5 kW en frío, ¿cuál debe ser la documentación técnica sobre la que debe ejecutarse la instalación?", "c": "", "o": {"A": "Proyecto de la instalación térmica del edificio.", "B": "Proyecto de la instalación térmica de cada vivienda.", "C": "Memoria técnica de la instalación térmica del edificio.", "D": "Memoria técnica de la instalación térmica de cada vivienda."}, "k": "A", "e": "Art. 15.2 RITE: con varios generadores en un edificio la potencia es la suma: 12 viviendas × 10,8 kW = 129,6 kW ≥ 70 kW → proyecto de la instalación del edificio.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 15, "q": "En el caso de reforma de una instalación térmica, por sustitución de un generador de calor o de frío por otro de diferentes características, si la potencia térmica nominal de generación de calor o frío es superior a 5 kW e inferior a 70 kW, ¿qué documentación técnica debe presentarse en la comunicación de reforma de instalación existente, según Orden de 27 de abril de 2009?", "c": "", "o": {"A": "Únicamente certificado de instalación térmi
