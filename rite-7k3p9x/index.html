ca, suscrito por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa", "B": "Memoria técnica y certificado de la instalación térmica, suscritos por empresa instaladora y profesional habilitados en instalaciones térmicas.", "C": "Memoria técnica y certificado de instalación térmica, suscritos por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa; certificado de inspección favorable emitido por organismo de control acreditado.", "D": "Proyecto y certificado de dirección de obra; certificado de instalación térmica, suscritos por empresa instaladora habilitada en instalaciones térmicas y profesional habilitado en instalaciones térmicas perteneciente a la empresa; certificado de inspección favorable emitido por organismo de control acreditado."}, "k": "B", "e": "Arts. 15 y 16 RITE: entre 5 y 70 kW basta memoria técnica más certificado de la instalación, firmados por la empresa instaladora y el instalador habilitado. No hace falta OCA ni proyecto.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 16, "q": "En el caso de una instalación térmica de potencia superior a 5 kW e inferior a 70 kW, en el control de la instalación terminada, todas las pruebas deben realizarse en presencia de:", "c": "", "o": {"A": "El titular de la instalación.", "B": "El inspector de la empresa suministradora.", "C": "El instalador habilitado de la empresa instaladora habilitada.", "D": "El director de la instalación."}, "k": "C", "e": "IT 2.1: todas las pruebas se efectúan en presencia del instalador habilitado, o del director de la instalación cuando éste sea preceptivo (≥70 kW, con proyecto).", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 17, "q": "En una instalación térmica de una vivienda, de potencia térmica nominal de generación de calor 30 kW y combustible gas, la periodicidad de las operaciones de mantenimiento preventivo será, al menos:", "c": "", "o": {"A": "Cada cuatro años.", "B": "Cada dos años.", "C": "Anual.", "D": "Semestral."}, "k": "B", "e": "Tabla 3.1: calderas murales a gas ≤70 kW en viviendas → mantenimiento cada 2 años.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 18, "q": "En salas de máquinas con generadores de calor a gas, los cerramientos (paredes y techos exteriores) del recinto deben tener una superficie de baja resistencia mecánica de superficie mínima que, en m2, sea la centésima parte del volumen del local expresado en m3, con un mínimo de:", "c": "", "o": {"A": "1 m2", "B": "2 m2", "C": "250 cm2", "D": "500 cm2"}, "k": "A", "e": "IT 1.3.4.1.2.8: superficie de baja resistencia = 1/100 del volumen en m³, con un mínimo de 1 m².", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 19, "q": "En una instalación térmica de un edificio, de potencia térmica nominal de generación de frío superior a 70 kW e inferior a 1000 kW, la evaluación periódica del rendimiento de los equipos generadores de frío debe realizarse al menos:", "c": "", "o": {"A": "Una vez al mes; la primera al inicio de la temporada.", "B": "Cada tres meses; la primera al inicio de la temporada.", "C": "Anualmente.", "D": "Cada dos años."}, "k": "B", "e": "IT 3.4.2 y tabla 3.5: generadores de frío de 70 a 1.000 kW → cada 3 meses, la primera al inicio de la temporada.", "nk": 1}, {"s": "Aragón 2025 (sin reglamento)", "n": 20, "q": "Sólo puede ser retornado a los locales el aire de extracción de categoría:", "c": "", "o": {"A": "AE 4", "B": "AE 3", "C": "AE 2", "D": "AE 1"}, "k": "D", "e": "IT 1.1.4.2.5: sólo puede retornarse el aire AE 1 (exento de humo de tabaco).", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 1, "q": "En un bloque de viviendas con generadores de calor instalados en azotea, cuya potencia térmica nominal total es de 400.000 kcal/h, ¿cuál es la periodicidad mínima con la que la empresa mantenedora debe medir y registrar el contenido de CO y CO₂ en los productos de la combustión?", "c": "", "o": {"A": "1 mes", "B": "2 meses", "C": "3 meses", "D": "2 años"}, "k": "C", "e": "400.000 kcal/h ÷ 860 = 465 kW. Tabla 3.4 (medidas en generadores de calor): 70<P≤1.000 kW → cada 3 meses.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 3, "q": "Teniendo en cuenta que la potencia útil nominal a instalar en un generador de calor es inferior a 70kW. ¿Cuál es el espesor mínimo de aislamiento en mm para conductos y accesorios que transportan fluidos calientes que discurren por el interior de edificios para un diámetro exterior de 40 mm. y una temperatura máxima del fluido de 50ºC, suponiendo una conductividad térmica de referencia a 10 ºC de 0,04 W/mK?:", "c": "", "o": {"A": "20 mm", "B": "30 mm", "C": "50 mm", "D": "Depende del diámetro exterior del conducto."}, "k": "B", "e": "IT 1.2.4.2.2: para P ≤70 kW y conductividad 0,040 W/(m·K), conductos en interior 30 mm y en exterior 50 mm.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 4, "q": "Un sistema de agua caliente sanitario de potencia 400 kW dispone de un sistema de vaciado total y varios parciales. ¿Cuál es el diámetro mínimo de los elementos de vaciado?", "c": "", "o": {"A": "20 mm para los sistemas parciales y 32 mm para el sistema total.", "B": "20 mm para los sistemas parciales y 25 mm para el sistema total.", "C": "25 mm para los sistemas parciales y 25 mm para el sistema total.", "D": "Ninguna de las respuestas anteriores es correcta."}, "k": "A", "e": "Tabla 3.4.2.3: vaciados parciales DN 20 mm; vaciado total con 150<P≤400 kW en calor → 32 mm.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 5, "q": "Calcula la ventilación mínima de una sala de máquinas con una superficie de 35 m² que tiene instalados en su interior generadores de calor con una potencia térmica nominal total de 200 kW que utilizan como combustible biomasa, si se ventila de forma natural al exterior por orificios:", "c": "", "o": {"A": "El local necesita una superficie abierta al aire libre mínima de 1.000 cm²", "B": "El local necesita una superficie abierta al aire libre mínima de 5.000 cm²", "C": "Al ser combustible de biomasa no es precisa ventilación mínima.", "D": "La ventilación deberá ser obligatoriamente forzada."}, "k": "A", "e": "IT 1.3.4.1.2.7: ventilación natural por orificios 5 cm²/kW → 200 × 5 = 1.000 cm². También vale para biomasa.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 6, "q": "Indicar el caudal mínimo de aire exterior de ventilación necesario para un local de oficinas de 200 m2 ocupado por 20 personas, considerando personas con actividad metabólica de aproximadamente 1,2 met, con baja producción de sustancias contaminantes por fuentes diferentes del ser humano y que no está permitido fumar.", "c": "", "o": {"A": "100 l/s", "B": "160 l/s", "C": "250 l/s", "D": "400 l/s"}, "k": "C", "e": "Oficinas: IDA 2 = 12,5 l/s por persona. 20 × 12,5 = 250 l/s.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 7, "q": "El aire exterior de ventilación se introducirá debidamente filtrado en los edificios. Indicar la clase de filtración a emplear en una cafetería, considerando que el aire exterior contiene concentraciones altas de partículas:", "c": "", "o": {"A": "F7", "B": "F5 + F7", "C": "F8", "D": "F6 + F8"}, "k": "B", "e": "Cafetería = IDA 3. Aire exterior con altas concentraciones de partículas = ODA 3. Tabla 1.4.2.5: ODA 3 + IDA 3 → F5 + F7.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 8, "q": "En el caso de centrales de producción de calor con generadores de combustible líquido o gaseoso, ¿cuál es la mínima potencia útil nominal para la que se precisarán instalar dos o mas generadores?", "c": "", "o": {"A": "1000 kW", "B": "400 kW", "C": "100 kW", "D": "70 kW"}, "k": "B", "e": "IT 1.2.4.1.2.2: si la potencia útil nominal a instalar es mayor que 400 kW se instalarán dos o más generadores.", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 9, "q": "En una sala de máquinas con generadores de calor a gas, con potencia nominal de generación 300 kW y volumen de local 80 m3, si se fragmenta en dos partes ¿cuál debe ser la mínima superficie de baja resistencia mecánica en comunicación directa a una zona exterior o patio descubierto?", "c": "", "o": {"A": "0,8 m2", "B": "1 m2", "C": "1,1 m2", "D": "2 m2"}, "k": "C", "e": "80 m³/100 = 0,8 m² → mínimo 1 m². Fragmentada: +10 % → 1,1 m².", "nk": 1}, {"s": "Aragón 2025 (con reglamento)", "n": 10, "q": "La prueba de resistencia mecánica se efectuará a continuación de la prueba preliminar: una vez llenada la red con el fluido de prueba, se someterá a las uniones a un esfuerzo por la aplicación de la presión de prueba, que, en el caso de circuitos cerrados de agua refrigerada o de agua caliente hasta una temperatura máxima de servicio de 100 ºC, será equivalente:", "c": "", "o": {"A": "Una vez y media la presión máxima efectiva de trabajo a la temperatura de servicio, con un mínimo de 6 bar.", "B": "Dos veces la presión máxima efectiva de trabajo a la temperatura de servicio, con un mínimo de 6 bar.", "C": "Dos veces la presión máxima efectiva de trabajo a la temperatura de servicio, con un mínimo de 4 bar.", "D": "Una vez y media la presión máxima efectiva de trabajo a la temperatura de servicio, con un mínimo de 4 bar."}, "k": "A", "e": "IT 2.2.2: circuitos cerrados de agua hasta 100 ºC → 1,5 veces la presión máxima de trabajo, con un mínimo de 6 bar.", "nk": 1}, {"s": "Aragón 2026 (sin reglamento)", "n": 1, "q": "En una instalación de producción de agua caliente sanitaria por medio de un calentador instantáneo de potencia térmica nominal 70kW, ¿qué documentación técnica es preceptiva presentar para acreditar el cumplimiento reglamentario ante el órgano competente de la Comunidad Autónoma?", "c": "", "o": {"A": "Proyecto.", "B": "Memoria técnica.", "C": "No es preceptivo presentar ningún tipo de documentación.", "D": "Comunicación de puesta en marcha."}, "k": "A", "e": "Art. 15.1.a) RITE: potencia térmica nominal ≥ 70 kW → proyecto function start(mode){let list;
