const RES=`<div class="card res"><div class="small">Lo que más se repite en los exámenes oficiales (Andalucía, Aragón, Madrid) y en los tests de tu academia. Apréndete estos números.</div>
<h3>1. Papeles y potencias (art. 15, 16, 24)</h3><ul><li>Menos de 5 kW: sin documentación. De 5 a 70 kW: <b>memoria técnica</b>. 70 kW o más: <b>proyecto</b> (técnico titulado).</li><li>Varios generadores en un edificio: se <b>suma</b> la potencia (12 viviendas × 10,8 kW = 129,6 kW → proyecto).</li><li>ACS con calentadores/termos: sin documentación si la suma ≤ 70 kW.</li><li>Solar sin apoyo: potencia = superficie × <b>0,7 kW/m²</b>.</li><li>Puesta en servicio (obra nueva o reforma): la <b>empresa instaladora</b> registra el certificado de la instalación ante la comunidad autónoma.</li><li>Pruebas finales en presencia del <b>instalador habilitado</b> (o del director de la instalación si hay proyecto).</li><li>Reforma = nuevo subsistema, cambiar generador por otro distinto, ampliar potencia o cambiar tipo de energía.</li></ul>
<h3>2. Bienestar y calidad del aire (IT 1.1)</h3><ul><li>Temperatura: verano 23–25 ºC (HR 45–60 %); invierno 21–23 ºC (HR 40–50 %). Cálculo de calefacción: <b>21 ºC</b>.</li><li>Velocidad del aire: mezcla v = t/100 − 0,07; desplazamiento v = t/100 − 0,10.</li><li>IDA 1 (hospitales, guarderías, laboratorios) 20 l/s·persona · IDA 2 (oficinas, aulas, residencias, hoteles) 12,5 · IDA 3 (comercios, cines, bares, restaurantes, gimnasios) 8 · IDA 4 5.</li><li>Por superficie (locales sin ocupación permanente): IDA 2 0,83 · IDA 3 0,55 · IDA 4 0,28 l/s·m².</li><li>Filtros: ODA 1 → F9/F8/F7/F5 (IDA 1 a 4). ODA 2 → F7+F9 / F6+F8 / F5+F7 / F5+F6. ODA 3 → F7+F9 / F7+F9 / F5+F7 / F5+F6.</li><li><b>Prefiltros</b> en la entrada de aire exterior y en la entrada del aire de retorno. Filtros finales después del ventilador de impulsión (quirófanos).</li><li>Aire de extracción: AE 1 (oficinas, aulas, pasillos) es el único que puede <b>retornarse</b>. AE 2 solo como aire de transferencia a aseos/garajes. AE 3 y AE 4 (cocinas, laboratorios, aparcamientos) se expulsan.</li><li>Extracción de locales de servicio: 2 l/s·m². Garajes y viviendas: CTE HS 3. Ruido: CTE HR.</li><li>Piscinas climatizadas: agua 24–30 ºC; aire 1–2 ºC por encima del agua, máximo 30 ºC; humedad ≤ 65 %.</li><li>ACS: acumulación a 60 ºC, red ≥ 50 ºC, capaz de llegar a 70 ºC (legionela, RD 865/2003).</li></ul>
<h3>3. Eficiencia energética (IT 1.2)</h3><ul><li>Más de 400 kW: dos o más generadores. Fraccionar potencia.</li><li>Emisores calculados para entrada máxima de <b>60 ºC</b> (RD 178/2021). Bombas de calor: temperatura de salida constante.</li><li>Aislamiento tuberías: tablas por diámetro y temperatura; para λ ≠ 0,04 se recalcula. Conductos (≤70 kW): interior 30 mm, exterior 50 mm. Pérdida máxima en conductos: 4 %.</li><li>Recuperador de calor obligatorio si expulsa más de <b>0,5 m³/s</b>; eficiencia según horas y caudal (tabla 2.4.5.1).</li><li>Enfriamiento gratuito (free-cooling) en todo-aire de más de 70 kW.</li><li>Ventiladores: SFP 0–7; impulsión climatización máx. SFP 4, ventilación SFP 3; extracción SFP 3 / SFP 2. Wesp = W/(m³/s).</li><li>Contabilización >70 kW: contador de energía térmica, horas de funcionamiento del generador, consumo eléctrico en frío; bombas/ventiladores >20 kW: horas; compresores >70 kW: arrancadas.</li><li>Rendimiento mínimo en inspección: <b>80 %</b>. EER = frío/eléctrica; COP = calor/eléctrica.</li><li>Temperaturas límite en edificios públicos (IT 3.8): calefacción ≤ 21 ºC; refrigeración ≥ 26 ºC.</li></ul>
<h3>4. Seguridad (IT 1.3)</h3><ul><li>Generadores de más de <b>70 kW</b>: en sala de máquinas. No son sala de máquinas los generadores de aire caliente ni tubos radiantes a gas.</li><li>Sala de riesgo alto: edificios institucionales/pública concurrencia o agua > 110 ºC.</li><li>Sala: altura mínima 2,50 m; 0,5 m libres sobre la caldera; 200 lux (uniformidad 0,5); interruptor de ventilación junto a la puerta; no se usa para otros fines; desagüe.</li><li>Gas: superficie de baja resistencia = volumen/100 (m²), mínimo <b>1 m²</b>; si se fragmenta +10 % y mínimo 250 cm² por trozo. Patio mínimo 2 × 2 m. Si no se puede: ventilación forzada + detección y corte de gas. Prohibido por debajo de semisótano/primer sótano.</li><li>Ventilación natural: aberturas 5 cm²/kW; gas: orificio inferior a < 50 cm del suelo y superior 10·A cm² a < 30 cm del techo. Conductos: verticales 7,5 cm²/kW, horizontales 10 cm²/kW (< 10 m). Forzada: 1,8·PN + 10·A m³/h, soplando por la parte baja.</li><li>Chimeneas: prohibido unificar con otras evacuaciones. Más de 400 kW: conducto propio. Común a varios generadores si la suma ≤ 400 kW. Por fachada solo gas estanco ≤ 70 kW (unifamiliar o reforma con NOx clase 5). Patio en edificio existente: 0,5 × nº locales, mínimo 4 m².</li><li>Biomasa: silo para 15 días en edificios nuevos; separación del generador; procedimiento de vaciado.</li><li>Tuberías: alimentación con desconector (DN según potencia: ≤70: 15 mm, ≤150: 20, ≤400: 25, >400: 32). Vaciado parcial DN 20; vaciado total ≤70: 20, ≤150: 25, ≤400: 32, >400: 40 (calor).</li><li>Equipamiento >70 kW: termómetro y manómetro en colectores; en chimeneas pirómetro/pirostato.</li><li>Pasillos como plenum de retorno: solo en viviendas.</li></ul>
<h3>5. Montaje y pruebas (IT 2)</h3><ul><li>Prueba preliminar de estanquidad a <b>baja presión</b>; luego resistencia mecánica: agua ≤ 100 ºC → 1,5 × presión máxima, mínimo <b>6 bar</b>; agua > 100 ºC o refrigerante → según norma; redes de ACS igual que agua. Después, prueba de libre dilatación.</li><li>Pruebas de recepción, limpieza de redes, equilibrado, eficiencia energética (análisis de combustión).</li></ul>
<h3>6. Mantenimiento (IT 3)</h3><ul><li>≤ 70 kW: se mantiene según manual; calderas murales gas en viviendas cada <b>2 años</b> (otros usos: anual); ACS gas ≤24,4 kW: 5 años (viviendas); aire acondicionado ≤12 kW: 4 años; 12–70 kW: 2 años. Más de 70 kW: mensual y <b>contrato</b> con empresa mantenedora.</li><li>Director de mantenimiento obligatorio: más de 5.000 kW calor y/o 1.000 kW frío, o solar > 400 kW.</li><li>Medidas en generadores (CO, CO₂, temperaturas, tiro): 20–70 kW cada 2 años; 70–1.000 kW cada <b>3 meses</b>; más de 1.000 kW mensual. Limpieza del quemador: mensual.</li><li>Registro de operaciones: conservar <b>5 años</b>. Programa de gestión energética.</li><li>El titular es responsable de que se haga el mantenimiento.</li></ul>
<h3>7. Inspecciones (IT 4)</h3><ul><li>Generadores de calor >70 kW y de frío >70 kW: inspección periódica por OCA (hoy cada 4 años). Rendimiento mínimo 80 %.</li><li>Instalación completa: cuando tenga más de <b>15 años</b> y después cada 15 años.</li><li>Calificación: aceptable; <b>condicionada</b> (1 defecto grave o 1 leve repetido sin corregir); negativa (1 muy grave o 2 graves).</li></ul>
<h3>8. Conocimientos básicos y refrigeración (tests de la academia)</h3><ul><li>Calor sensible Q = m·ce·ΔT; ce agua 1 kcal/kg·ºC (4,18 kJ/kg·K); aire 0,24 kcal/kg·ºC, ρ 1,2 kg/m³. 1 kW = 860 kcal/h. 0 K = −273,15 ºC.</li><li>Conducción (sólidos), convección (fluidos), radiación. Calor latente = cambio de estado sin cambiar temperatura.</li><li>Suelo radiante 30–35 ºC, ideal con condensación. Purgador quita el aire; vaso de expansión absorbe la dilatación. Bitubo con retorno invertido = más equilibrado.</li><li>RSIF (RD 552/2019): L1 alta seguridad (A1, no inflamables), L2 media (A2L, A2, B1, B2L, B2), L3 baja (A3, B3). Excluidos: compactos < 2,5 kg L1 o < 0,5 kg L2/L3. Locales categoría A/B/C. Tuberías de refrigerante: fondo amarillo RAL 1021. Estanqueidad a 0,9–1,0 × PS; resistencia 1,1 × PS; vacío de deshidratación ≤ 270 Pa.</li><li>Gases fluorados: RD 115/2017, Reglamento (UE) 2024/573 y 2024/2215 (certificados). PCA/GWP (calentamiento), ODP (ozono), LII (inflamabilidad). Botellas en vertical, nunca al sol. Subenfriamiento normal 3–7 K.</li><li>CTE HE 4: ACS de referencia a 60 ºC; demanda por persona (hotel ***** 69 l/día, vivienda 28 l/día).</li></ul></div>`

const $=s=>document.querySelector(s), app=$('#app');
const LS='rite_fallos_v1'; let fallos=new Set(JSON.parse(localStorage.getItem(LS)||'[]'));
const id=q=>q.s+'|'+q.n; const save=()=>localStorage.setItem(LS,JSON.stringify([...fallos]));
let st=null,timer=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function home(){clearInterval(timer);
app.innerHTML=`<div class="card"><button id="vozbtn" class="btn2" onclick="toggleVoz()">${voz?'🔊 Voz: sí':'🔈 Voz: no'}</button><div class="small">Con la voz activada, al responder el móvil te lee la respuesta correcta.</div></div><div class="card"><b>Por dónde empezar</b><p class="small">"Las más probables" son las preguntas cuyo tema se repite en 5 o más exámenes distintos (Andalucía, Aragón, Madrid y tu academia): papeles según potencia, IDA/ODA y filtros, salas de máquinas y su ventilación, chimeneas, biomasa, pruebas, mantenimiento, inspecciones, ACS, refrigerantes y cálculos básicos. Empieza por ahí y por la pestaña Resumen.</p>
<b>Cómo es el examen real</b><p class="small">En los exámenes oficiales publicados (Andalucía): 30 preguntas tipo test de 4 opciones, 45 minutos. Acierto +1, fallo −0,5, en blanco 0. Apto con 15 puntos. Se permite consultar el RITE (RD 1027/2007) y calculadora.</p>
<button class="btn" onclick="start('top')">Las más probables (120 preguntas)</button>
<button class="btn2" onclick="start('exam')">Simulacro de examen (30 preguntas · 45 min)</button>
<button class="btn2" onclick="start('practice')">Practicar con todas (respuesta al momento)</button>
<button class="btn2" onclick="start('acad')">Practicar solo los tests de tu academia</button>
<button class="btn2" onclick="start('fallos')">Repasar mis fallos (${fallos.size})</button></div>
<div class="card"><b>Practicar un examen o cuestionario concreto</b><select id="src">${SRCS.map(s=>`<option>${s}</option>`).join('')}</select>
<button class="btn2" onclick="start('src')">Empezar este examen</button></div>
<div class="card small"><b>De dónde salen las preguntas</b><br>Tests de tu academia (Kualifica, curso RITE 0926: 285 preguntas con su respuesta). Exámenes oficiales publicados por la Junta de Andalucía (2018, 2020 y 2025, con su plantilla oficial de respuestas), el examen de la Comunidad de Madrid de 2017 (respuestas del documento publicado) y los exámenes del Gobierno de Aragón de 2023, 2025 y 2026 (sin clave oficial: la respuesta se ha razonado con el RITE vigente y se indica el artículo). Las preguntas anteriores a 2021 se corrigieron con el RITE vigente en esa fecha; desde el RD 178/2021 algún dato puede haber cambiado (sobre todo inspecciones y documentación). Ante la duda, manda el texto del RITE en el BOE.</div>`}
function start(mode){let list;
if(mode==='exam')list=shuffle(Q.filter(q=>Object.keys(q.o).length==4&&!q.ac)).slice(0,30);
else if(mode==='acad')list=shuffle(Q.filter(q=>q.ac));
else if(mode==='top')list=shuffle(Q.filter(q=>q.top));
else if(mode==='practice')list=shuffle(Q);
else if(mode==='fallos'){list=shuffle(Q.filter(q=>fallos.has(id(q))));if(!list.length){alert('Aún no tienes fallos guardados.');return}}
else{const s=$('#src').value;list=Q.filter(q=>q.s===s)}
st={mode,list,i:0,ans:{},end:mode==='exam'?Date.now()+45*60e3:0};
if(st.end)timer=setInterval(()=>{const t=st.end-Date.now();if(t<=0){finish();return}const e=$('#tm');if(e)e.textContent=fmt(t)},1000);
show()}
function fmt(t){const m=Math.floor(t/60e3),s=Math.floor(t/1e3)%60;return m+':'+String(s).padStart(2,'0')}
function show(){const q=st.list[st.i],a=st.ans[st.i],exam=st.mode==='exam',reveal=!exam&&a!==undefined;
app.innerHTML=`<div class="card"><div class="meta"><span>Pregunta ${st.i+1} de ${st.list.length}</span>${exam?`<span><b id="tm">${fmt(st.end-Date.now())}</b></span>`:''}<span>${q.s}, nº ${q.n}</span>${exam?'':`<span id="vozbtn" style="cursor:pointer" onclick="toggleVoz()">${voz?'🔊 Voz: sí':'🔈 Voz: no'}</span>`}</div>
<div class="bar"><i style="width:${(st.i+1)/st.list.length*100}%"></i></div>
${q.c?`<div class="ctx">${esc(q.c)}</div>`:''}<div class="q">${esc(q.q)}</div>
${Object.entries(q.o).map(([k,v])=>{let c='';if(reveal){if(k===q.k)c='ok';else if(k===a)c='bad'}else if(exam&&a===k)c='sel';
return `<button class="opt ${c}" ${exam&&a===k?'style="border-color:#0f4c81;background:#dbeafe"':''} onclick="pick('${k}')"><b>${k})</b>${esc(v)}</button>`}).join('')}
${reveal?`<div class="ex">${a===q.k?'<b style="color:#16a34a">Correcto.</b>':'<b style="color:#dc2626">Incorrecto.</b>'} ${q.nk?'Respuesta razonada con el RITE (no hay clave oficial)':'Respuesta oficial'}: <b>${q.k}) ${esc(q.o[q.k])}</b>${q.e?'<br>'+esc(q.e):''}</div>`:''}
<div class="row" style="margin-top:10px"><button class="btn2" onclick="nav(-1)" ${st.i?'':'disabled'}>◀ Anterior</button>
${st.i<st.list.length-1?`<button class="btn" onclick="nav(1)">Siguiente ▶</button>`:`<button class="btn" onclick="finish()">Terminar</button>`}</div>
${exam?`<button class="btn2" onclick="if(confirm('¿Entregar el examen ya?'))finish()">Entregar examen</button>`:''}
<button class="btn2" onclick="if(confirm('¿Salir al inicio?'))home()">Salir</button></div>`}
function pick(k){if(st.mode!=='exam'&&st.ans[st.i]!==undefined)return;const q=st.list[st.i];
if(st.mode==='exam'&&st.ans[st.i]===k){delete st.ans[st.i];show();return}
st.ans[st.i]=k;if(k!==q.k)fallos.add(id(q));else if(st.mode==='fallos')fallos.delete(id(q));save();show();if(voz&&st.mode!=='exam')habla((k===q.k?'Correcto. ':'Incorrecto. ')+'La respuesta correcta es la '+q.k+': '+q.o[q.k])}
function nav(d){st.i=Math.max(0,Math.min(st.list.length-1,st.i+d));show()}
function finish(){clearInterval(timer);let ok=0,ko=0,bl=0;st.list.forEach((q,i)=>{const a=st.ans[i];if(a===undefined)bl++;else if(a===q.k)ok++;else ko++});
const pts=ok-(st.mode==='exam'?ko*0.5:0),total=st.list.length,need=total/2;
app.innerHTML=`<div class="card"><div class="big">${pts.toFixed(1)} / ${total}</div><p style="text-align:center;font-weight:700;color:${pts>=need?'#16a34a':'#dc2626'}">${pts>=need?'APTO':'NO APTO'} ${st.mode==='exam'?'(aprobado con 15)':''}</p>
<p class="small" style="text-align:center">Aciertos ${ok} · Fallos ${ko} · En blanco ${bl}${st.mode==='exam'?' · cada fallo resta 0,5':''}</p>
<button class="btn" onclick="home()">Volver al inicio</button><button class="btn2" onclick="start('fallos')">Repasar mis fallos</button></div>
${st.mode==='exam'?st.list.map((q,i)=>{const a=st.ans[i];return `<div class="card"><div class="meta"><span>${i+1}. ${q.s}, nº ${q.n}</span><span>${a===undefined?'En blanco':a===q.k?'<b style="color:#16a34a">Bien</b>':'<b style="color:#dc2626">Mal</b>'}</span></div>${q.c?`<div class="ctx">${esc(q.c)}</div>`:''}<div class="q">${esc(q.q)}</div>${a&&a!==q.k?`<div class="small">Tu respuesta: ${a}) ${esc(q.o[a])}</div>`:''}<div class="ex">Correcta: <b>${q.k}) ${esc(q.o[q.k])}</b>${q.e?'<br>'+esc(q.e):''}</div></div>`}).join(''):''}`;window.scrollTo(0,0)}
home();
</script></body></html>
